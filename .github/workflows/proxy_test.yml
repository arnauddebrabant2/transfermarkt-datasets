name: Weekly Transfermarkt Scrape

on:
  schedule:
    - cron: '0 4 * * 1'  # Elke maandag om 04:00 UTC
  workflow_dispatch:

env:
  CURRENT_SEASON: '2025'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install poetry aiohttp beautifulsoup4 lxml
          git clone https://github.com/dcaribou/transfermarkt-scraper.git /tmp/scraper
          cd /tmp/scraper
          poetry config virtualenvs.create false
          poetry install --without dev

      - name: Verifieer scraper
        run: |
          cd /tmp/scraper
          git rev-parse --short HEAD
          python -c "import tfmkt; print('tfmkt OK')"

      - name: Maak output map aan
        run: mkdir -p data/raw data/csv

      - name: Stap 0 - Bestaande CSV data inladen
        run: |
          python3 << 'PYEOF'
          import gzip, shutil
          from pathlib import Path
          CSV = Path('data/csv')
          for gz_file in sorted(CSV.glob('*.csv.gz')):
              stem = gz_file.stem
              out_name = 'appearances_existing.csv' if stem == 'appearances.csv' else stem
              out_path = CSV / out_name
              print(f"Decomprimeer {gz_file.name} -> {out_name} ({gz_file.stat().st_size // 1024} KB)")
              with gzip.open(gz_file, 'rb') as f_in:
                  with open(out_path, 'wb') as f_out:
                      shutil.copyfileobj(f_in, f_out)
          PYEOF

      - name: Stap 1+2 - Clubs/spelers uit bestaande CSV's
        run: |
          python3 << 'PYEOF'
          import csv, json, sys
          from pathlib import Path
          RAW = Path('data/raw')
          CSV = Path('data/csv')
          RAW.mkdir(parents=True, exist_ok=True)
          clubs_csv = CSV / 'clubs.csv'
          if not clubs_csv.exists():
              print("FOUT: clubs.csv ontbreekt!"); sys.exit(1)
          n_clubs = 0
          with open(clubs_csv, encoding='utf-8') as fi, open(RAW / 'clubs.json', 'w', encoding='utf-8') as fo:
              reader = csv.DictReader(fi)
              for row in reader:
                  club_id = (row.get('club_id') or '').strip()
                  url = (row.get('url') or '').strip()
                  comp_id = (row.get('domestic_competition_id') or '').strip()
                  if not club_id or not url: continue
                  href = url.replace('https://www.transfermarkt.co.uk', '').replace('https://www.transfermarkt.com', '')
                  if not href.startswith('/'): href = '/' + href
                  fo.write(json.dumps({'type': 'club', 'href': href, 'parent': {'type': 'competition', 'competition_type': 'first_tier', 'href': f'/x/startseite/wettbewerb/{comp_id}', 'country_code': comp_id}}) + '\n')
                  n_clubs += 1
          print(f"clubs.json: {n_clubs} clubs")
          players_csv = CSV / 'players.csv'
          if not players_csv.exists():
              print("FOUT: players.csv ontbreekt!"); sys.exit(1)
          n_players = 0
          with open(players_csv, encoding='utf-8') as fi, open(RAW / 'players.json', 'w', encoding='utf-8') as fo:
              reader = csv.DictReader(fi)
              for row in reader:
                  player_id = (row.get('player_id') or '').strip()
                  url = (row.get('url') or '').strip()
                  club_id = (row.get('current_club_id') or '').strip()
                  if not player_id or not url: continue
                  href = url.replace('https://www.transfermarkt.co.uk', '').replace('https://www.transfermarkt.com', '')
                  if not href.startswith('/'): href = '/' + href
                  fo.write(json.dumps({'type': 'player', 'href': href, 'parent': {'type': 'club', 'href': f'/x/startseite/verein/{club_id}', 'current_club': {'href': f'/x/startseite/verein/{club_id}'}}}) + '\n')
                  n_players += 1
          print(f"players.json: {n_players} spelers")
          PYEOF

      - name: Stap 2e - Incrementeel filter
        run: |
          python3 << 'PYEOF'
          import json, csv
          from pathlib import Path
          from datetime import datetime, timedelta
          PLAYERS_FULL = Path('data/raw/players.json')
          PLAYERS_FILTERED = Path('data/raw/players_to_scrape.json')
          APPEARANCES_EXISTING = Path('data/csv/appearances_existing.csv')
          THRESHOLD_DAYS = 7
          MAX_PLAYERS_PER_RUN = 2000
          threshold_date = datetime.now() - timedelta(days=THRESHOLD_DAYS)
          print(f"Drempel: spelers met appearance na {threshold_date.date()} overslaan")
          last_seen = {}
          if APPEARANCES_EXISTING.exists():
              with open(APPEARANCES_EXISTING, encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      pid = str(row.get('player_id', ''))
                      date_str = row.get('date', '')
                      if not pid or not date_str: continue
                      dt = None
                      for fmt in ('%Y-%m-%d', '%m/%d/%y', '%b %d, %Y'):
                          try: dt = datetime.strptime(date_str, fmt); break
                          except: continue
                      if dt and (pid not in last_seen or dt > last_seen[pid]):
                          last_seen[pid] = dt
              print(f"Historische appearances: {len(last_seen)} unieke spelers")
          candidates = []
          total = 0
          with open(PLAYERS_FULL, encoding='utf-8') as f_in:
              for line in f_in:
                  line = line.strip()
                  if not line: continue
                  total += 1
                  try: p = json.loads(line)
                  except: continue
                  href = p.get('href', '')
                  parts = href.rstrip('/').split('/')
                  pid = parts[parts.index('spieler') + 1] if 'spieler' in parts else ''
                  last = last_seen.get(pid)
                  if last is not None and last > threshold_date: continue
                  priority = last if last else datetime(1970, 1, 1)
                  candidates.append((priority, line))
          candidates.sort(key=lambda x: x[0])
          selected = candidates[:MAX_PLAYERS_PER_RUN]
          with open(PLAYERS_FILTERED, 'w', encoding='utf-8') as f_out:
              for _, line in selected:
                  f_out.write(line + '\n')
          print(f"Geselecteerd: {len(selected)}/{total}")
          PYEOF

      - name: Stap 3 - Appearances ophalen via ceapi
        timeout-minutes: 120
        continue-on-error: true
        run: |
          echo "=== Debug: bestanden checken ==="
          ls -la data/raw/ 2>/dev/null || echo "data/raw/ bestaat niet!"
          echo "--- players_to_scrape.json ---"
          wc -l data/raw/players_to_scrape.json 2>/dev/null || echo "BESTAND BESTAAT NIET"
          echo "Eerste 2 regels:"
          head -2 data/raw/players_to_scrape.json 2>/dev/null || echo "LEEG"
          echo "=== Start Python ==="
          python3 << 'PYEOF'
          import json, asyncio, aiohttp, os
          from pathlib import Path

          RAW = Path('data/raw')
          PLAYERS_FILE = RAW / 'players_to_scrape.json'
          OUT_FILE = RAW / 'appearances.json'
          SEASONS = {2024, 2025}
          CEAPI_URL = "https://www.transfermarkt.co.uk/ceapi/performance-game/{player_id}"
          PROXY = os.environ.get('HTTPS_PROXY') or os.environ.get('HTTP_PROXY') or ''
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json",
              "Referer": "https://www.transfermarkt.co.uk/",
          }
          CONCURRENCY = 3
          DELAY = 1.5

          def get_player_ids():
              ids, seen = [], set()
              if not PLAYERS_FILE.exists():
                  print("FOUT: players_to_scrape.json niet gevonden")
                  return ids
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          p = json.loads(line)
                          href = p.get('href', '')
                          parts = href.rstrip('/').split('/')
                          if 'spieler' in parts:
                              pid = parts[parts.index('spieler') + 1]
                              if pid and pid not in seen:
                                  ids.append(pid)
                                  seen.add(pid)
                      except: pass
              return ids

          def parse_appearances(player_id, data):
              results = []
              for perf in data.get('performance', []):
                  gi = perf.get('gameInformation', {}) or {}
                  stats = perf.get('statistics', {}) or {}
                  clubs = perf.get('clubsInformation', {}) or {}
                  season_id = gi.get('seasonId') or (gi.get('season') or {}).get('id')
                  if season_id not in SEASONS:
                      continue
                  cards = stats.get('cardStatistics', {}) or {}
                  goals = stats.get('goalStatistics', {}) or {}
                  playing = stats.get('playingTimeStatistics', {}) or {}
                  date_str = ((gi.get('date') or {}).get('dateTimeUTC') or '')[:10]
                  game_id = str(gi.get('gameId', ''))
                  club_id = str((clubs.get('club') or {}).get('clubId', ''))
                  yellow = 1 if (cards.get('yellowCard') or {}).get('minute') else 0
                  yellow_red = 1 if (cards.get('yellowRedCard') or {}).get('minute') else 0
                  red = 1 if (cards.get('redCard') or {}).get('minute') else 0
                  results.append({
                      'appearance_id': f"{game_id}_{player_id}",
                      'game_id': game_id,
                      'player_id': player_id,
                      'player_club_id': club_id,
                      'date': date_str,
                      'player_name': '',
                      'competition_id': str(gi.get('competitionId', '')),
                      'yellow_cards': yellow + yellow_red,
                      'red_cards': red,
                      'goals': goals.get('goalsScoredTotal') or 0,
                      'assists': goals.get('assists') or 0,
                      'minutes_played': playing.get('playedMinutes') or 0,
                  })
              return results

          async def fetch_player(session, semaphore, player_id):
              url = CEAPI_URL.format(player_id=player_id)
              async with semaphore:
                  await asyncio.sleep(DELAY)
                  try:
                      kwargs = {'proxy': PROXY} if PROXY else {}
                      async with session.get(url, headers=HEADERS, timeout=aiohttp.ClientTimeout(total=30), **kwargs) as resp:
                          if resp.status == 200:
                              raw = await resp.json(content_type=None)
                              return parse_appearances(player_id, raw.get('data') or raw)
                          elif resp.status == 405:
                              return []  # Speler niet actief, stilletjes overslaan
                          else:
                              print(f"  [{resp.status}] speler {player_id}")
                              return []
                  except Exception as e:
                      print(f"  [FOUT] speler {player_id}: {e}")
                      return []

          async def main():
              player_ids = get_player_ids()
              print(f"Spelers te scrapen: {len(player_ids)}")
              print(f"Eerste 5 player IDs: {player_ids[:5]}")
              print(f"Proxy: {PROXY[:40] + '...' if PROXY else 'GEEN'}")
              if not player_ids:
                  return

              # Test eerste speler direct
              import aiohttp as _aiohttp
              async with _aiohttp.ClientSession() as _s:
                  _url = CEAPI_URL.format(player_id=player_ids[0])
                  print(f"Test URL: {_url}")
                  async with _s.get(_url, headers=HEADERS, timeout=_aiohttp.ClientTimeout(total=10)) as _r:
                      print(f"Test status: {_r.status}")
                      if _r.status == 200:
                          _d = await _r.json(content_type=None)
                          _perfs = (_d.get('data') or _d).get('performance', [])
                          print(f"Test performances: {len(_perfs)}, seizoenen: {set(p.get('gameInformation',{}).get('seasonId') for p in _perfs[:5])}")

              semaphore = asyncio.Semaphore(CONCURRENCY)
              all_appearances = []
              async with aiohttp.ClientSession(connector=aiohttp.TCPConnector(ssl=False)) as session:
                  tasks = [fetch_player(session, semaphore, pid) for pid in player_ids]
                  for i, coro in enumerate(asyncio.as_completed(tasks)):
                      all_appearances.extend(await coro)
                      if (i + 1) % 100 == 0:
                          print(f"  {i+1}/{len(player_ids)} spelers, {len(all_appearances)} appearances")
              seen = set()
              unique = [a for a in all_appearances if a['appearance_id'] not in seen and not seen.add(a['appearance_id'])]
              print(f"Nieuw: {len(unique)} appearances")
              if unique:
                  with open(OUT_FILE, 'w', encoding='utf-8') as f:
                      for obj in unique:
                          f.write(json.dumps(obj) + '\n')
                  print(f"✅ appearances.json: {len(unique)} regels")
              else:
                  print("⚠️  Geen appearances gevonden")

          asyncio.run(main())
          PYEOF

      - name: Stap 4 - Wedstrijden scrapen
        timeout-minutes: 60
        continue-on-error: true
        run: |
          cd /tmp/scraper
          echo "=== Wedstrijden seizoen $CURRENT_SEASON ==="
          python -m tfmkt games \
            -p $GITHUB_WORKSPACE/data/competitions.json \
            -s $CURRENT_SEASON \
            >> $GITHUB_WORKSPACE/data/raw/games.json || true
          echo "Wedstrijden: $(wc -l < $GITHUB_WORKSPACE/data/raw/games.json 2>/dev/null || echo 0)"

      - name: Stap 5 - JSON naar CSV omzetten en samenvoegen
        run: |
          python3 << 'PYEOF'
          import json, csv
          from pathlib import Path
          RAW = Path('data/raw')
          OUT = Path('data/csv')
          OUT.mkdir(exist_ok=True)
          def load_jsonl(path):
              items = []
              if not path.exists(): return items
              with open(path, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          try: items.append(json.loads(line))
                          except: pass
              return items
          def load_csv_existing(path):
              rows = []
              if not path.exists(): return rows
              with open(path, encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  for row in reader: rows.append(row)
              return rows
          def extract_id(href):
              if not href: return ''
              parts = href.rstrip('/').split('/')
              for key in ('wettbewerb', 'verein', 'spieler', 'spielbericht'):
                  if key in parts: return parts[parts.index(key) + 1]
              return parts[-1]

          # ── APPEARANCES ──
          APP_COLS = ['appearance_id','game_id','player_id','player_club_id','date','player_name','competition_id','yellow_cards','red_cards','goals','assists','minutes_played']
          new_apps = load_jsonl(RAW / 'appearances.json')
          existing_apps = load_csv_existing(OUT / 'appearances_existing.csv')
          app_map = {r['appearance_id']: r for r in existing_apps}
          for r in new_apps:
              if r.get('appearance_id'):
                  app_map[r['appearance_id']] = r
          merged = list(app_map.values())
          if merged:
              with open(OUT / 'appearances.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=APP_COLS, extrasaction='ignore')
                  w.writeheader(); w.writerows(merged)
              print(f'appearances.csv: {len(merged)} rijen (was {len(existing_apps)}, +{len(merged)-len(existing_apps)} nieuw)')
          else:
              print('appearances.csv: geen data')

          # ── GAMES ──
          games = load_jsonl(RAW / 'games.json')
          new_game_rows = []
          for g in games:
              result = g.get('result', '') or ''
              try: home_goals, away_goals = [x.strip() for x in result.split(':')]
              except: home_goals, away_goals = '', ''
              home_id = extract_id((g.get('home_club') or {}).get('href', ''))
              away_id = extract_id((g.get('away_club') or {}).get('href', ''))
              comp_id = (g.get('parent') or {}).get('country_code', '') or extract_id((g.get('parent') or {}).get('href', ''))
              new_game_rows.append({'game_id': g.get('game_id', ''), 'competition_id': comp_id, 'season': g.get('season', '2025'), 'date': g.get('date', ''), 'home_club_id': home_id, 'away_club_id': away_id, 'home_club_goals': home_goals, 'away_club_goals': away_goals, 'home_club_name': g.get('home_club_name', ''), 'away_club_name': g.get('away_club_name', ''), 'stadium': g.get('stadium', ''), 'attendance': g.get('attendance', ''), 'url': f"https://www.transfermarkt.co.uk{g.get('href', '')}"})
          existing_games = load_csv_existing(OUT / 'games.csv')
          game_map = {r['game_id']: r for r in existing_games}
          for r in new_game_rows:
              if r['game_id']: game_map[str(r['game_id'])] = r
          merged_games = list(game_map.values())
          if merged_games:
              with open(OUT / 'games.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(merged_games[0].keys()))
                  w.writeheader(); w.writerows(merged_games)
              print(f'games.csv: {len(merged_games)} rijen')
          else:
              print('games.csv: geen data')

          Path('data/csv/appearances_existing.csv').unlink(missing_ok=True)
          print('Klaar!')
          PYEOF

      - name: Stap 6 - Debuten ophalen
        timeout-minutes: 30
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import asyncio, aiohttp, csv, re
          from pathlib import Path
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup
          PLAYERS_CSV = Path("data/csv/players.csv")
          MAX_PER_RUN = 500
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36", "Accept-Language": "nl-BE,nl;q=0.9,en;q=0.8", "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"}
          MONTHS = {"jan":"01","feb":"02","mar":"03","apr":"04","may":"05","jun":"06","jul":"07","aug":"08","sep":"09","oct":"10","nov":"11","dec":"12"}
          HIGHEST_TITLES = {"eerste klasse","eerste divisie","highest division","1st division","premier league","bundesliga","serie a","la liga","ligue 1","eredivisie"}
          SECOND_TITLES = {"tweede klasse","tweede divisie","second division","2nd division","2. bundesliga","serie b","segunda division","ligue 2","eerste divisie"}
          DEBUT_COLS = ["debut_highest_division_date","debut_highest_division_club","debut_highest_division_competition","debut_second_tier_date","debut_second_tier_club","debut_second_tier_competition"]
          def clean(el):
              return re.sub(r"\s+", " ", (el.get_text(" ", strip=True) if el else "").strip())
          def norm(s):
              return re.sub(r"\s+", " ", (s or "").strip().lower())
          def parse_date(text):
              s = norm(text).replace("\xa0", " "); parts = s.split()
              if len(parts) < 3: return ""
              day = re.sub(r"\D", "", parts[0]).zfill(2); month = MONTHS.get(parts[1], ""); year = re.sub(r"\D", "", parts[2])
              return f"{year}-{month}-{day}" if day and month and year else ""
          def build_url(row):
              pid = str(row.get("player_id","")).strip(); url = str(row.get("url","")).strip(); slug = ""
              if url:
                  try:
                      parts = urlparse(url).path.strip("/").split("/")
                      if "spieler" in parts:
                          i = parts.index("spieler"); slug = parts[i-1] if i > 0 else ""; pid = parts[i+1] if i+1 < len(parts) else pid
                  except: pass
              base = f"https://www.transfermarkt.be/{slug}" if slug else "https://www.transfermarkt.be/spieler"
              return f"{base}/debuets/spieler/{pid}"
          def parse_page(html):
              soup = BeautifulSoup(html, "lxml"); result = {c: "" for c in DEBUT_COLS}
              table = None
              for div in soup.select("div.box"):
                  h2 = div.select_one("h2.content-box-headline")
                  if h2 and "debut" in norm(clean(h2)):
                      table = div.select_one("table"); break
              if not table: table = soup.select_one("div.responsive-table table")
              if not table: return result
              current = ""
              for tr in table.select("tbody tr"):
                  hd = tr.select_one("td.hauptlink[colspan]")
                  if hd: current = norm(clean(hd)); continue
                  cells = tr.find_all("td", recursive=False)
                  if len(cells) < 4: continue
                  date_val = parse_date(clean(cells[3]))
                  if not date_val: continue
                  competition = clean(cells[1]); club = ""
                  img = cells[2].find("img")
                  if img and img.get("title"): club = img["title"].strip()
                  if not club:
                      a = cells[2].find("a")
                      if a: club = (a.get("title") or clean(a)).strip()
                  if current in HIGHEST_TITLES and not result["debut_highest_division_date"]:
                      result["debut_highest_division_date"] = date_val; result["debut_highest_division_club"] = club; result["debut_highest_division_competition"] = competition
                  elif current in SECOND_TITLES and not result["debut_second_tier_date"]:
                      result["debut_second_tier_date"] = date_val; result["debut_second_tier_club"] = club; result["debut_second_tier_competition"] = competition
                  if result["debut_highest_division_date"] and result["debut_second_tier_date"]: break
              return result
          with open(PLAYERS_CSV, encoding="utf-8") as f:
              reader = csv.DictReader(f); fields = list(reader.fieldnames or []); rows = list(reader)
          for col in DEBUT_COLS:
              if col not in fields: fields.append(col)
          date_pattern = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          def has_debut(row):
              return bool(date_pattern.match((row.get("debut_highest_division_date") or "").strip()) or date_pattern.match((row.get("debut_second_tier_date") or "").strip()))
          todo = [(i, r) for i, r in enumerate(rows) if not has_debut(r) and r.get("player_id")]
          print(f"Spelers zonder debut-data: {len(todo)}")
          if len(todo) > MAX_PER_RUN: print(f"Beperkt tot {MAX_PER_RUN}"); todo = todo[:MAX_PER_RUN]
          if not todo: print("Niets te doen"); import sys; sys.exit(0)
          async def fetch_one(session, semaphore, idx, row):
              async with semaphore:
                  await asyncio.sleep(0.3)
                  url = build_url(row)
                  try:
                      async with session.get(url, headers=HEADERS, timeout=aiohttp.ClientTimeout(total=20), allow_redirects=True) as resp:
                          if resp.status == 200:
                              html = await resp.text()
                              return idx, (html if len(html) >= 3000 else None), "ok"
                          return idx, None, f"http{resp.status}"
                  except Exception as e: return idx, None, f"error:{type(e).__name__}"
          async def main():
              semaphore = asyncio.Semaphore(8); updated = 0
              async with aiohttp.ClientSession() as session:
                  tasks = [fetch_one(session, semaphore, i, r) for i, r in todo]; done = 0
                  for coro in asyncio.as_completed(tasks):
                      idx, html, status = await coro; done += 1
                      if html:
                          parsed = parse_page(html)
                          for k, v in parsed.items():
                              if v: rows[idx][k] = v
                          if parsed.get("debut_highest_division_date") or parsed.get("debut_second_tier_date"): updated += 1
                      if done % 50 == 0: print(f"  {done}/{len(todo)}, {updated} bijgewerkt")
              print(f"Klaar: {updated}/{len(todo)} bijgewerkt")
              with open(PLAYERS_CSV, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore"); w.writeheader()
                  for r in rows: w.writerow({k: r.get(k, "") for k in fields})
          asyncio.run(main())
          PYEOF

      - name: Commit en push CSV's
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/csv/*.csv; do [ -f "$f" ] && gzip -f "$f" || true; done
          git add data/csv/
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "ScoutAI data update: ${TIMESTAMP}" || echo "Geen wijzigingen"
          git push

      - name: Samenvatting
        run: |
          echo "=== SCRAPING KLAAR ==="
          for f in data/csv/*; do
            echo "$f: $(wc -c < $f) bytes"
          done
