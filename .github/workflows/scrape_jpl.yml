name: JPL ScoutAI Update

on:
  schedule:
    - cron: '0 5 * * 2'  # Elke dinsdag om 05:00 UTC (na weekly run)
  workflow_dispatch:

jobs:
  scrape_jpl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transfermarkt-scraper
        run: |
          pip install poetry
          git clone https://github.com/dcaribou/transfermarkt-scraper.git /tmp/scraper
          cd /tmp/scraper
          poetry config virtualenvs.create false
          poetry install --without dev
          pip install aiohttp asyncio
          echo 'USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"' >> /tmp/scraper/tfmkt/settings.py
          echo 'ROBOTSTXT_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"' >> /tmp/scraper/tfmkt/settings.py
          python3 $GITHUB_WORKSPACE/patch_scraper.py

      - name: Maak output map aan
        run: mkdir -p data/raw data/csv

      - name: Stap 0 - Bestaande CSV data inladen
        run: |
          python3 << 'PYEOF'
          import gzip, shutil
          from pathlib import Path
          CSV = Path('data/csv')
          for gz_file in sorted(CSV.glob('*.csv.gz')):
              stem = gz_file.stem
              out_name = 'appearances_existing_jpl.csv' if stem == 'appearances_jpl.csv' else (
                         'appearances_existing.csv' if stem == 'appearances.csv' else stem)
              out_path = CSV / out_name
              print(f"Decomprimeer {gz_file.name} -> {out_name} ({gz_file.stat().st_size // 1024} KB)")
              with gzip.open(gz_file, 'rb') as f_in:
                  with open(out_path, 'wb') as f_out:
                      shutil.copyfileobj(f_in, f_out)
          PYEOF

      - name: Stap 1 - JPL clubs scrapen (BE1 + BE2)
        run: |
          cd /tmp/scraper
          # Maak een tijdelijk competitions.json met alleen BE1 en BE2
          echo '{"type":"competition","country_name":"Belgium","country_code":"BE1","competition_type":"first_tier","href":"/jupiler-pro-league/startseite/wettbewerb/BE1"}' > /tmp/be_comps.json
          echo '{"type":"competition","country_name":"Belgium","country_code":"BE2","competition_type":"second_tier","href":"/challenger-pro-league/startseite/wettbewerb/BE2"}' >> /tmp/be_comps.json
          for SEASON in 2024 2025; do
            echo "=== JPL Clubs seizoen $SEASON ==="
            python -m tfmkt clubs \
              -p /tmp/be_comps.json \
              -s $SEASON \
              >> $GITHUB_WORKSPACE/data/raw/clubs_jpl.json || true
          done
          echo "JPL Clubs: $(wc -l < $GITHUB_WORKSPACE/data/raw/clubs_jpl.json)"

      - name: Stap 2 - JPL spelers scrapen
        run: |
          cd /tmp/scraper
          for SEASON in 2024 2025; do
            echo "=== JPL Spelers seizoen $SEASON ==="
            python -m tfmkt players \
              -p $GITHUB_WORKSPACE/data/raw/clubs_jpl.json \
              -s $SEASON \
              >> $GITHUB_WORKSPACE/data/raw/players_jpl.json || true
          done
          echo "JPL Spelers: $(wc -l < $GITHUB_WORKSPACE/data/raw/players_jpl.json)"

      - name: Stap 2b - JPL marktwaarden ophalen
        timeout-minutes: 15
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, asyncio, aiohttp
          from pathlib import Path
          RAW = Path('data/raw')
          PLAYERS_FILE = RAW / 'players_jpl.json'
          MV_FILE = RAW / 'market_values_jpl.json'

          # Stap 1: haal marktwaarden rechtstreeks uit de players.json
          # De scraper slaat current_market_value op van de TM spelerspagina
          results = {}
          if PLAYERS_FILE.exists():
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          p = json.loads(line)
                          href = p.get('href', '')
                          parts = href.rstrip('/').split('/')
                          if 'spieler' not in parts: continue
                          pid = parts[parts.index('spieler') + 1]
                          # Probeer alle mogelijke veldnamen
                          for field in ['current_market_value','market_value','marketValue']:
                              mv = p.get(field)
                              if mv and str(mv).strip() not in ('', 'None', '0', '-'):
                                  results[pid] = str(mv).strip()
                                  break
                      except: pass
          print(f"Marktwaarden uit scraper: {len(results)} spelers")

          # Stap 2: probeer ook ceapi voor spelers zonder waarde
          missing = [pid for pid in results if not results.get(pid)]
          all_ids = []
          if PLAYERS_FILE.exists():
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          p = json.loads(line)
                          href = p.get('href', '')
                          parts = href.rstrip('/').split('/')
                          if 'spieler' in parts:
                              pid = parts[parts.index('spieler') + 1]
                              if pid not in results:
                                  all_ids.append(pid)
                      except: pass

          if all_ids:
              MARKET_VALUES_API = "https://www.transfermarkt.com/ceapi/marketValueDevelopment/graph/"
              HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36", "Accept": "application/json"}
              async def fetch_mv(session, player_id, semaphore):
                  async with semaphore:
                      url = f"{MARKET_VALUES_API}{player_id}"
                      try:
                          async with session.get(url, headers=HEADERS, timeout=aiohttp.ClientTimeout(total=10)) as resp:
                              if resp.status == 200:
                                  data = await resp.json(content_type=None)
                                  values = data.get('list', [])
                                  if values:
                                      return player_id, values[-1].get('mw', '')
                      except: pass
                      return player_id, None
              async def main():
                  semaphore = asyncio.Semaphore(3)
                  async with aiohttp.ClientSession() as session:
                      tasks = [fetch_mv(session, pid, semaphore) for pid in all_ids]
                      for coro in asyncio.as_completed(tasks):
                          pid, mv = await coro
                          if mv: results[pid] = mv
              asyncio.run(main())
              print(f"Na ceapi: {len(results)} totaal")

          # Sla op als integers (niet als strings)
          results_int = {}
          for pid, mv in results.items():
              try:
                  v = int(float(str(mv))) if mv else 0
                  if v > 0:
                      results_int[str(pid)] = v
              except: pass
          with open(MV_FILE, 'w', encoding='utf-8') as f:
              json.dump(results_int, f)
          print(f"market_values_jpl.json: {len(results_int)} spelers opgeslagen (als integers)")
          PYEOF
          echo "JPL Marktwaarden: $(wc -c < $GITHUB_WORKSPACE/data/raw/market_values_jpl.json 2>/dev/null || echo 0) bytes"

      - name: Stap 2c - JPL transfers ophalen
        timeout-minutes: 20
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, asyncio, aiohttp
          from pathlib import Path
          RAW = Path('data/raw')
          PLAYERS_FILE = RAW / 'players_jpl.json'
          TRANSFERS_FILE = RAW / 'transfers_jpl.json'
          TRANSFERS_API = "https://www.transfermarkt.co.uk/ceapi/transferHistory/list/"
          HEADERS = {"User-Agent": "transfermarkt-datasets/1.0", "Accept": "application/json"}
          def get_player_ids():
              ids, seen = [], set()
              if not PLAYERS_FILE.exists(): return ids
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          p = json.loads(line)
                          href = p.get('href', '')
                          parts = href.rstrip('/').split('/')
                          if 'spieler' in parts:
                              pid = parts[parts.index('spieler') + 1]
                              if pid and pid not in seen:
                                  ids.append(pid); seen.add(pid)
                      except: pass
              return ids
          async def fetch_transfers(session, player_id, semaphore):
              async with semaphore:
                  url = f"{TRANSFERS_API}{player_id}"
                  try:
                      async with session.get(url, headers=HEADERS, timeout=aiohttp.ClientTimeout(total=10)) as resp:
                          if resp.status == 200:
                              data = await resp.json(content_type=None)
                              return player_id, data.get('transfers', [])
                  except: pass
                  return player_id, []
          async def main():
              player_ids = get_player_ids()
              print(f"JPL transfers ophalen voor {len(player_ids)} spelers...")
              semaphore = asyncio.Semaphore(5)
              all_transfers = []
              async with aiohttp.ClientSession() as session:
                  tasks = [fetch_transfers(session, pid, semaphore) for pid in player_ids]
                  done = 0
                  for coro in asyncio.as_completed(tasks):
                      pid, transfers = await coro
                      for t in transfers:
                          t['player_id'] = pid
                          all_transfers.append(t)
                      done += 1
              print(f"Klaar: {len(all_transfers)} transfers")
              with open(TRANSFERS_FILE, 'w', encoding='utf-8') as f:
                  for t in all_transfers:
                      f.write(json.dumps(t) + chr(10))
          asyncio.run(main())
          PYEOF
          echo "JPL Transfers: $(wc -l < $GITHUB_WORKSPACE/data/raw/transfers_jpl.json 2>/dev/null || echo 0)"

      - name: Stap 2d - JPL valuations ophalen
        timeout-minutes: 20
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, asyncio, aiohttp
          from pathlib import Path
          RAW = Path('data/raw')
          PLAYERS_FILE = RAW / 'players_jpl.json'
          VALUATIONS_FILE = RAW / 'valuations_jpl.json'

          # Stap 1: haal market_value_history uit players.json (scraper data)
          all_vals = []
          player_ids_missing = []
          if PLAYERS_FILE.exists():
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          p = json.loads(line)
                          href = p.get('href', '')
                          parts = href.rstrip('/').split('/')
                          if 'spieler' not in parts: continue
                          pid = parts[parts.index('spieler') + 1]
                          history = p.get('market_value_history', [])
                          # Scraper kan history opslaan als lijst of als {'data': [...]}
                          if isinstance(history, dict):
                              history = history.get('data', [])
                          if isinstance(history, list) and history:
                              for h in history:
                                  if isinstance(h, dict):
                                      h['player_id'] = pid
                                      all_vals.append(h)
                          else:
                              player_ids_missing.append(pid)
                      except: pass
          print(f"Valuations uit scraper: {len(all_vals)} (voor {len(player_ids_missing)} spelers ontbreekt history)")

          # Stap 2: ceapi voor spelers zonder history
          if player_ids_missing:
              MV_API = "https://www.transfermarkt.com/ceapi/marketValueDevelopment/graph/"
              HEADERS = {"User-Agent": "transfermarkt-datasets/1.0", "Accept": "application/json"}
              async def fetch_val(session, player_id, semaphore):
                  async with semaphore:
                      try:
                          async with session.get(f"{MV_API}{player_id}", headers=HEADERS, timeout=aiohttp.ClientTimeout(total=10)) as resp:
                              if resp.status == 200:
                                  data = await resp.json(content_type=None)
                                  return player_id, data.get('list', [])
                      except: pass
                      return player_id, []
              async def main():
                  semaphore = asyncio.Semaphore(5)
                  async with aiohttp.ClientSession() as session:
                      tasks = [fetch_val(session, pid, semaphore) for pid in player_ids_missing]
                      for coro in asyncio.as_completed(tasks):
                          pid, values = await coro
                          for v in values:
                              v['player_id'] = pid
                              all_vals.append(v)
              asyncio.run(main())
              print(f"Na ceapi: {len(all_vals)} valuations totaal")

          with open(VALUATIONS_FILE, 'w', encoding='utf-8') as f:
              for v in all_vals:
                  f.write(json.dumps(v) + chr(10))
          print(f"valuations_jpl.json: {len(all_vals)} rijen")
          PYEOF
          echo "JPL Valuations: $(wc -l < $GITHUB_WORKSPACE/data/raw/valuations_jpl.json 2>/dev/null || echo 0)"
      - name: Stap 3 - JPL optredens scrapen
        timeout-minutes: 60
        continue-on-error: true
        run: |
          cd /tmp/scraper
          for SEASON in 2024 2025; do
            echo "=== JPL Optredens seizoen $SEASON ==="
            python -m tfmkt appearances \
              -p $GITHUB_WORKSPACE/data/raw/players_jpl.json \
              -s $SEASON \
              >> $GITHUB_WORKSPACE/data/raw/appearances_jpl.json || true
          done
          echo "JPL Optredens: $(wc -l < $GITHUB_WORKSPACE/data/raw/appearances_jpl.json)"

      - name: Stap 3b - JPL wedstrijden scrapen
        timeout-minutes: 30
        continue-on-error: true
        run: |
          cd /tmp/scraper
          for SEASON in 2024 2025; do
            echo "=== JPL Wedstrijden seizoen $SEASON ==="
            echo '{"type":"competition","country_name":"Belgium","country_code":"BE1","competition_type":"first_tier","href":"/jupiler-pro-league/startseite/wettbewerb/BE1"}' > /tmp/be_comps.json
          python -m tfmkt games \
              -p /tmp/be_comps.json \
              -s $SEASON \
              >> $GITHUB_WORKSPACE/data/raw/games_jpl.json || true
          done
          echo "JPL Wedstrijden: $(wc -l < $GITHUB_WORKSPACE/data/raw/games_jpl.json)"

      - name: Stap 4 - JSON naar aparte JPL CSV bestanden
        run: |
          python3 << 'PYEOF'
          import json, csv, gzip
          from pathlib import Path
          RAW = Path('data/raw')
          OUT = Path('data/csv')
          OUT.mkdir(exist_ok=True)

          def load_jsonl(path):
              items = []
              if not path.exists(): return items
              with open(path, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          try: items.append(json.loads(line))
                          except: pass
              return items

          def extract_id(href):
              if not href: return ''
              parts = href.rstrip('/').split('/')
              for key in ['wettbewerb','verein','spieler','spielbericht']:
                  if key in parts: return parts[parts.index(key)+1]
              return parts[-1]

          def parse_market_value(mv_str):
              if not mv_str: return ''
              s = str(mv_str).strip()
              # Als het al een getal is
              try:
                  v = int(float(s))
                  if v > 0: return v
              except: pass
              # Verwijder valuta symbolen
              s = s.replace('€','').replace('£','').replace('$','').strip()
              s_low = s.lower()
              try:
                  if 'mio' in s_low or s_low.endswith('m') or ' m' in s_low:
                      s2 = s_low.replace('mio.','').replace('mio','').replace(' m','').replace('m','').replace(',','.').strip()
                      return int(float(s2) * 1_000_000)
                  if 'th.' in s_low or s_low.endswith('k') or ' k' in s_low or 'tsd' in s_low:
                      s2 = s_low.replace('th.','').replace('tsd.','').replace('tsd','').replace(' k','').replace('k','').replace(',','.').strip()
                      return int(float(s2) * 1_000)
                  s2 = s.replace('.','').replace(',','').strip()
                  return int(float(s2))
              except: return ''

          def _fix_encoding(s):
              if not s: return s
              return str(s).replace(chr(226)+chr(130)+chr(172), 'EUR').replace(chr(194), '')

          # Marktwaarden - laad uit market_values_jpl.json
          mv_lookup = {}
          mv_file = RAW / 'market_values_jpl.json'
          if mv_file.exists():
              with open(mv_file, encoding='utf-8') as f:
                  raw_mv = json.load(f)
              for pid, mv in raw_mv.items():
                  try:
                      v = int(float(str(mv))) if mv else 0
                      if v > 0:
                          mv_lookup[str(pid)] = v
                  except: pass
              print(f"Marktwaarden geladen: {len(mv_lookup)} spelers")
              if mv_lookup:
                  sample = list(mv_lookup.items())[:3]
                  print(f"Sample mv_lookup: {sample}")
          else:
              print("WAARSCHUWING: market_values_jpl.json niet gevonden")

          # ── CLUBS JPL ──
          clubs = load_jsonl(RAW / 'clubs_jpl.json')
          club_lookup = {}
          club_rows = []
          for c in clubs:
              comp_href = c.get('parent', {}).get('href', '')
              comp_id = extract_id(comp_href)
              club_id = c.get('id') or extract_id(c.get('href', ''))
              club_lookup[c.get('href', '')] = {'club_id': club_id, 'name': c.get('name', ''), 'competition_id': comp_id}
              club_rows.append({
                  'club_id': club_id, 'name': c.get('name', ''),
                  'domestic_competition_id': comp_id,
                  'squad_size': c.get('squad_size', ''),
                  'average_age': c.get('average_age', ''),
                  'total_market_value': c.get('total_market_value', ''),
                  'coach_name': c.get('coach_name', ''),
                  'url': f"https://www.transfermarkt.co.uk{c.get('href', '')}",
              })
          seen_club_ids = set()
          unique_clubs = []
          for r in club_rows:
              if r['club_id'] and r['club_id'] not in seen_club_ids:
                  seen_club_ids.add(r['club_id']); unique_clubs.append(r)
          if unique_clubs:
              with open(OUT / 'clubs_jpl.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(unique_clubs[0].keys()))
                  w.writeheader(); w.writerows(unique_clubs)
              print(f'clubs_jpl.csv: {len(unique_clubs)} clubs')

          # ── SPELERS JPL ──
          debut_cols = [
              'hoogste_divisie_debut_date','hoogste_divisie_debut_club',
              'tweede_niveau_debut_date','tweede_niveau_debut_club',
              'debut_highest_division_date','debut_highest_division_club','debut_highest_division_competition',
              'debut_second_tier_date','debut_second_tier_club','debut_second_tier_competition',
          ]
          players = load_jsonl(RAW / 'players_jpl.json')
          player_rows = []
          seen_pids = set()
          for p in players:
              club_href = p.get('parent', {}).get('href', '')
              club_info = club_lookup.get(club_href, {})
              player_id = p.get('id') or extract_id(p.get('href', ''))
              if player_id in seen_pids: continue
              seen_pids.add(player_id)
              height_raw = p.get('height', '') or ''
              try: height_cm = int(float(height_raw.replace('m','').replace(',','.').strip()) * 100)
              except: height_cm = ''
              pos = p.get('position', '') or ''
              pos_map = {
                  'goalkeeper':'Goalkeeper',
                  'centre-back':'Defender','left-back':'Defender','right-back':'Defender','defender':'Defender',
                  'attacking midfield':'Midfield','midfielder':'Midfield','midfield':'Midfield',
                  'centre-forward':'Attack','left winger':'Attack','right winger':'Attack','forward':'Attack','attack':'Attack'
              }
              position = next((v for k, v in pos_map.items() if k in pos.lower()), 'Midfield')
              # Zoek op string én zonder leading zeros
              mv = mv_lookup.get(str(player_id), '') or mv_lookup.get(str(int(player_id)) if str(player_id).isdigit() else player_id, '')
              if not mv:
                  # Probeer alle veldnamen die scraper gebruikt
                  for field in ['current_market_value', 'market_value', 'marketValue']:
                      mv_raw = p.get(field) or ''
                      if mv_raw and str(mv_raw).strip() not in ('', 'None', '0', '-'):
                          mv = parse_market_value(str(mv_raw))
                          if mv: break
              mv_high_raw = p.get('highest_market_value') or ''
              try: mv_high = int(str(mv_high_raw).replace('e','').replace(',','').strip()) if mv_high_raw else ''
              except: mv_high = ''
              first_name = p.get('name', '') or ''
              last_name = p.get('last_name', '') or ''
              player_rows.append({
                  'player_id': player_id,
                  'name': f"{first_name} {last_name}".strip() or first_name,
                  'first_name': first_name, 'last_name': last_name,
                  'date_of_birth': p.get('date_of_birth', ''), 'age': p.get('age', ''),
                  'country_of_citizenship': p.get('citizenship', ''),
                  'country_of_birth': (p.get('place_of_birth') or {}).get('country', ''),
                  'position': position, 'sub_position': pos,
                  'foot': p.get('foot', ''), 'height_in_cm': height_cm,
                  'market_value_in_eur': mv, 'highest_market_value_in_eur': mv_high,
                  'contract_expiration_date': p.get('contract_expires', ''),
                  'current_club_id': club_info.get('club_id', ''),
                  'current_club_name': club_info.get('name', ''),
                  'current_club_domestic_competition_id': club_info.get('competition_id', ''),
                  'image_url': p.get('image_url', ''),
                  'url': f"https://www.transfermarkt.co.uk{p.get('href', '')}",
              })
          if player_rows:
              all_cols = list(player_rows[0].keys()) + [c for c in debut_cols if c not in player_rows[0]]
              with_mv = sum(1 for r in player_rows if r.get('market_value_in_eur'))
              print(f"Spelers met marktwaarde: {with_mv}/{len(player_rows)}")
              with open(OUT / 'players_jpl.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=all_cols, extrasaction='ignore')
                  w.writeheader()
                  for row in player_rows:
                      w.writerow({k: row.get(k, '') for k in all_cols})
              print(f'players_jpl.csv: {len(player_rows)} spelers')

          # ── APPEARANCES JPL ──
          appearances = load_jsonl(RAW / 'appearances_jpl.json')
          app_rows = []
          seen_app_ids = set()
          for a in appearances:
              parent = a.get('parent') or {}
              player_id = extract_id(parent.get('href', ''))
              player_club_id = extract_id((parent.get('current_club') or {}).get('href', ''))
              result_raw = a.get('result')
              if isinstance(result_raw, dict): result_href = result_raw.get('href', '')
              elif isinstance(result_raw, str): result_href = result_raw
              else: result_href = ''
              game_id = extract_id(result_href)
              date = a.get('date', '')
              appearance_id = f"{player_id}_{date.replace('/', '')}" if player_id and date else ''
              if not appearance_id or appearance_id in seen_app_ids: continue
              seen_app_ids.add(appearance_id)
              min_raw = a.get('minutes_played', '') or ''
              try: minutes_played = int(str(min_raw).replace("'", "").strip())
              except: minutes_played = 0
              def card_count(val):
                  if val is None or val == '' or val == 0: return 0
                  return 1
              def safe_int(val):
                  try: return int(val) if val != '' and val is not None else 0
                  except: return 0
              app_rows.append({
                  'appearance_id': appearance_id, 'game_id': game_id,
                  'player_id': player_id, 'player_club_id': player_club_id,
                  'date': date,
                  'player_name': f"{parent.get('name', '')} {parent.get('last_name', '')}".strip(),
                  'competition_id': a.get('competition_code', ''),
                  'yellow_cards': card_count(a.get('yellow_cards')),
                  'red_cards': card_count(a.get('red_cards')),
                  'goals': safe_int(a.get('goals')),
                  'assists': safe_int(a.get('assists')),
                  'minutes_played': minutes_played,
                  'position_in_game': str(a.get('position_in_game', '') or '').strip(),
              })
          if app_rows:
              with open(OUT / 'appearances_jpl.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(app_rows[0].keys()))
                  w.writeheader(); w.writerows(app_rows)
              print(f'appearances_jpl.csv: {len(app_rows)} optredens')

          # ── TRANSFERS JPL ──
          transfers_raw = load_jsonl(RAW / 'transfers_jpl.json')
          transfer_rows = []
          seen_t = set()
          for t in transfers_raw:
              player_id = str(t.get('player_id', ''))
              row = {
                  'player_id': player_id,
                  'transfer_date': t.get('date', '') or t.get('transferDate', ''),
                  'transfer_season': t.get('season', ''),
                  'from_club_name': str(t.get('from', '') or t.get('fromClubName', '')),
                  'to_club_name': str(t.get('to', '') or t.get('toClubName', '')),
                  'transfer_fee': _fix_encoding(t.get('fee', '') or t.get('transferFee', '')),
                  'market_value_at_transfer': _fix_encoding(t.get('mv', '') or t.get('marketValue', '')),
              }
              key = f"{row['player_id']}_{row['transfer_date']}_{row['to_club_name']}"
              if key not in seen_t:
                  seen_t.add(key); transfer_rows.append(row)
          if transfer_rows:
              with open(OUT / 'transfers_jpl.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(transfer_rows[0].keys()))
                  w.writeheader(); w.writerows(transfer_rows)
              print(f'transfers_jpl.csv: {len(transfer_rows)} transfers')

          # ── VALUATIONS JPL ──
          # Scraper formaat: datum_mw, mw, verein, date_x, market_value
          # ceapi formaat:   date, market_value, club_name
          # Als valuations_jpl.json leeg is: gebruik market_values_jpl.json als fallback
          valuations_raw = load_jsonl(RAW / 'valuations_jpl.json')
          if not valuations_raw and mv_lookup:
              print("Valuations leeg - gebruik market_values_jpl.json als fallback")
              import datetime
              today = datetime.date.today().strftime('%Y-%m-%d')
              for pid, mv_val in mv_lookup.items():
                  valuations_raw.append({
                      'player_id': pid,
                      'date': today,
                      'date_timestamp': '',
                      'market_value_in_eur': mv_val,
                      'club_name': '',
                      'age': '',
                  })
              print(f"Fallback valuations: {len(valuations_raw)} rijen")
          val_rows = []
          seen_v = set()
          for v in valuations_raw:
              player_id = str(v.get('player_id', ''))
              if not player_id: continue
              # Datum: probeer alle veldnamen
              date = (v.get('datum_mw') or v.get('date') or '').strip()
              # Timestamp als fallback voor datum
              ts = str(v.get('date_x') or v.get('date_timestamp') or '')
              # Marktwaarde: scraper gebruikt 'mw' of 'market_value'
              mv_raw = v.get('market_value') or v.get('mw') or ''
              # Club: scraper gebruikt 'verein', ceapi gebruikt 'club_name'
              club = v.get('verein') or v.get('club_name') or ''
              # Deduplicatie op player_id + datum + timestamp
              key = f"{player_id}_{date}_{ts}"
              if key in seen_v: continue
              seen_v.add(key)
              val_rows.append({
                  'player_id': player_id,
                  'date': date,
                  'date_timestamp': ts,
                  'market_value_in_eur': parse_market_value(str(mv_raw)) if mv_raw else '',
                  'club_name': str(club),
                  'age': str(v.get('age') or ''),
              })
          if val_rows:
              with open(OUT / 'jpl_player_valuations.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(val_rows[0].keys()))
                  w.writeheader(); w.writerows(val_rows)
              print(f'jpl_player_valuations.csv: {len(val_rows)} valuations')
          else:
              print('WAARSCHUWING: geen valuations data gevonden in valuations_jpl.json')

          # ── GAMES JPL ──
          games = load_jsonl(RAW / 'games_jpl.json')
          game_rows = []
          seen_g = set()
          for g in games:
              # Ondersteunt zowel scraper als dcaribou formaat
              if g.get('home_club_id'):
                  game_id = str(g.get('game_id', ''))
                  if game_id in seen_g: continue
                  seen_g.add(game_id)
                  game_rows.append({
                      'game_id': game_id,
                      'competition_id': g.get('competition_id', ''),
                      'season': g.get('season', ''),
                      'date': g.get('date', ''),
                      'home_club_id': g.get('home_club_id', ''),
                      'away_club_id': g.get('away_club_id', ''),
                      'home_club_goals': g.get('home_club_goals', ''),
                      'away_club_goals': g.get('away_club_goals', ''),
                      'home_club_name': g.get('home_club_name', ''),
                      'away_club_name': g.get('away_club_name', ''),
                      'stadium': g.get('stadium', ''),
                      'attendance': g.get('attendance', ''),
                      'url': g.get('url', ''),
                  })
              else:
                  result = g.get('result', '') or ''
                  try:
                      home_goals, away_goals = result.split(':')
                      home_goals = home_goals.strip(); away_goals = away_goals.strip()
                  except: home_goals, away_goals = '', ''
                  home_id = extract_id((g.get('home_club') or {}).get('href', ''))
                  away_id = extract_id((g.get('away_club') or {}).get('href', ''))
                  comp_id = (g.get('parent') or {}).get('country_code', '') or                             extract_id((g.get('parent') or {}).get('href', ''))
                  game_id = str(g.get('game_id', ''))
                  if game_id in seen_g: continue
                  seen_g.add(game_id)
                  game_rows.append({
                      'game_id': game_id,
                      'competition_id': comp_id,
                      'season': g.get('season', ''),
                      'date': g.get('date', ''),
                      'home_club_id': home_id,
                      'away_club_id': away_id,
                      'home_club_goals': home_goals,
                      'away_club_goals': away_goals,
                      'home_club_name': g.get('home_club_name', ''),
                      'away_club_name': g.get('away_club_name', ''),
                      'stadium': g.get('stadium', ''),
                      'attendance': g.get('attendance', ''),
                      'url': f"https://www.transfermarkt.co.uk{g.get('href', '')}",
                  })
          if game_rows:
              with open(OUT / 'jpl_games.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(game_rows[0].keys()))
                  w.writeheader(); w.writerows(game_rows)
              print(f'jpl_games.csv: {len(game_rows)} wedstrijden')

          print('JPL conversie klaar!')
          PYEOF

      - name: Commit en push CSVs
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"
          # Verwijder tijdelijk bestand dat niet gecommit mag worden
          rm -f data/csv/appearances_existing_jpl.csv data/csv/appearances_existing_jpl.csv.gz
          for f in data/csv/*_jpl.csv data/csv/jpl_*.csv; do [ -f "$f" ] && gzip -f "$f" || true; done
          git add data/csv/players_jpl.csv.gz data/csv/clubs_jpl.csv.gz || true
          git add data/csv/appearances_jpl.csv.gz || true
          git add data/csv/transfers_jpl.csv.gz || true
          git add data/csv/jpl_player_valuations.csv.gz data/csv/jpl_games.csv.gz || true
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M)
          git commit -m "JPL update ${TIMESTAMP}" || echo "Geen wijzigingen"
          git pull --rebase origin master || true
          git push

      - name: Samenvatting
        run: |
          echo "=== JPL UPDATE KLAAR ==="
          for f in data/csv/*.csv.gz; do
            echo "$f: $(wc -c < $f) bytes"
          done
