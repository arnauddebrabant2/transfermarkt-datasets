name: Scrape Flags - Vlaggen en Logo's voor Competities

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Stap 0 - Decompress competitions.csv.gz
        run: |
          python3 << 'PYEOF'
          import gzip, shutil
          from pathlib import Path
          gz = Path('data/csv/competitions.csv.gz')
          if gz.exists():
              with gzip.open(gz, 'rb') as f_in:
                  with open('data/csv/competitions.csv', 'wb') as f_out:
                      shutil.copyfileobj(f_in, f_out)
              print(f"Gedecomprimeerd: {gz.stat().st_size // 1024} KB")
          PYEOF

      - name: Stap 1 - Vlaggen en logo's scrapen per competitie
        timeout-minutes: 300
        run: |
          python3 << 'PYEOF'
          import requests, csv, time, re, random
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          DATA = Path('data/csv')
          BASE = 'https://www.transfermarkt.co.uk'
          START_FROM = 931   # 1-based index; hervat vanaf rij 931
          SAVE_EVERY = 25

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept-Language': 'en-GB,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml',
              'Referer': BASE + '/',
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=3):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=20, allow_redirects=True)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 403:
                          wait = 60 * (i + 1)
                          print(f'  403 - wacht {wait}s...', end='')
                          time.sleep(wait)
                      elif r.status_code == 405:
                          print(f' HTTP405', end='')
                          time.sleep(5 * (i + 1))
                      else:
                          print(f' HTTP{r.status_code}', end='')
                          time.sleep(3 * (i + 1))
                  except Exception as e:
                      print(f'  Fout: {e}', end='')
                      time.sleep(5)
              return None

          def abs_url(src):
              if not src:
                  return ''
              return src if src.startswith('http') else urljoin('https://tmssl.akamaized.net', src)

          def save_rows(comp_file, fields, rows):
              with open(comp_file, 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
                  w.writeheader()
                  for row in rows:
                      w.writerow({k: row.get(k, '') for k in fields})

          def find_flag_and_logo(soup, comp_id):
              flag_id = ''
              flag_url = ''
              logo_url = ''

              header_box = soup.select_one('.data-header__box')

              if header_box:
                  flag_img = header_box.select_one('img.data-header__box__flag')
                  if flag_img:
                      src = flag_img.get('src', '')
                      m = re.search(r'/images/flagge/[^/]+/(\d+)\.', src)
                      if m:
                          flag_id = m.group(1)
                          flag_url = abs_url(src)

                  for img in header_box.find_all('img', src=True):
                      src = img.get('src', '')
                      if '/images/logo/' in src or f'/{comp_id.lower()}.png' in src.lower():
                          logo_url = abs_url(src)
                          break

              if not flag_id:
                  for img in soup.find_all('img', src=True):
                      src = img.get('src', '')
                      if '/images/flagge/' not in src:
                          continue
                      m = re.search(r'/images/flagge/[^/]+/(\d+)\.', src)
                      if m:
                          flag_id = m.group(1)
                          flag_url = abs_url(src)
                          break

              if not logo_url:
                  for img in soup.find_all('img', src=True):
                      src = img.get('src', '')
                      if '/images/logo/' in src or f'/{comp_id.lower()}.png' in src.lower():
                          logo_url = abs_url(src)
                          break

              return flag_id, flag_url, logo_url

          comp_file = DATA / 'competitions.csv'
          rows = []
          fields = []

          with open(comp_file, encoding='utf-8') as f:
              reader = csv.DictReader(f)
              fields = list(reader.fieldnames or [])
              rows = list(reader)

          for col in ['flag_id', 'flag_url', 'logo_url']:
              if col not in fields:
                  fields.append(col)

          already = sum(1 for r in rows if r.get('flag_id') and r.get('logo_url'))
          print(f'Competities: {len(rows)}, al verwerkt: {already}')
          print(f'Hervatten vanaf index: {START_FROM}')

          updated = 0
          checked = 0

          for i, row in enumerate(rows, start=1):
              if i < START_FROM:
                  continue

              comp_id  = (row.get('competition_id') or '').strip()
              comp_url = (row.get('url') or '').strip()

              # sla reeds volledig verwerkte rijen over
              if row.get('flag_id') and row.get('logo_url'):
                  continue

              if not comp_url:
                  print(f'[{i:4d}/{len(rows)}] {comp_id:12s} NO_URL')
                  continue

              checked += 1
              print(f'[{i:4d}/{len(rows)}] {comp_id:12s}', end=' ', flush=True)

              r = get(comp_url)
              if not r:
                  print('SKIP')
                  # NIET leegmaken; bestaande waarden behouden
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')
              new_flag_id, new_flag_url, new_logo_url = find_flag_and_logo(soup, comp_id)

              # Alleen overschrijven als we effectief iets gevonden hebben
              if new_flag_id:
                  row['flag_id'] = new_flag_id
              if new_flag_url:
                  row['flag_url'] = new_flag_url
              if new_logo_url:
                  row['logo_url'] = new_logo_url

              updated += 1

              print(f'flag:{row.get("flag_id","-") or "-":5s} logo:{"ok" if row.get("logo_url") else "-"}')

              if updated % SAVE_EVERY == 0:
                  save_rows(comp_file, fields, rows)
                  print(f'  [SAVE] {updated} bijgewerkt vanaf startpunt')

              time.sleep(0.8 + random.uniform(0, 0.4))

          save_rows(comp_file, fields, rows)
          print(f'\nKlaar: {updated} bijgewerkt, {checked} gecontroleerd vanaf startpunt')
          PYEOF

      - name: Stap 2 - Gzippen en committen
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"

          gzip -f data/csv/competitions.csv
          echo "competitions.csv.gz: $(wc -c < data/csv/competitions.csv.gz) bytes"

          git add data/csv/competitions.csv.gz
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "ScoutAI: vlaggen en logo's competities [${TIMESTAMP}]" || echo "Geen wijzigingen"
          git push
