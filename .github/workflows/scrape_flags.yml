name: Scrape Flags - Vlaggen en Logo's voor Competities

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Stap 0 - Decompress competitions.csv.gz
        run: |
          python3 << 'PYEOF'
          import gzip, shutil
          from pathlib import Path
          gz = Path('data/csv/competitions.csv.gz')
          if gz.exists():
              with gzip.open(gz, 'rb') as f_in:
                  with open('data/csv/competitions.csv', 'wb') as f_out:
                      shutil.copyfileobj(f_in, f_out)
              print(f"Gedecomprimeerd: {gz.stat().st_size // 1024} KB")
          PYEOF

      - name: Stap 1 - Vlaggen en logo's scrapen per competitie
        timeout-minutes: 300
        run: |
          python3 << 'PYEOF'
          import requests, csv, time, re, random
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          DATA = Path('data/csv')
          BASE = 'https://www.transfermarkt.co.uk'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept-Language': 'en-GB,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml',
              'Referer': BASE + '/',
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=3):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=20)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 403:
                          wait = 60 * (i + 1)
                          print(f'  403 - wacht {wait}s...')
                          time.sleep(wait)
                      else:
                          print(f' HTTP{r.status_code}', end='')
                          time.sleep(3)
                  except Exception as e:
                      print(f'  Fout: {e}')
                      time.sleep(5)
              return None

          def abs_url(src):
              if not src:
                  return ''
              return src if src.startswith('http') else urljoin('https://tmssl.akamaized.net', src)

          def find_flag_and_logo(soup, comp_id):
            flag_id = ''
            flag_url = ''
            logo_url = ''
        
            # 1) Eerst expliciet de header-box nemen
            header_box = soup.select_one('.data-header__box')
        
            if header_box:
                # vlag: class data-header__box__flag
                flag_img = header_box.select_one('img.data-header__box__flag')
                if flag_img:
                    src = flag_img.get('src', '')
                    m = re.search(r'/images/flagge/[^/]+/(\d+)\.', src)
                    if m:
                        flag_id = m.group(1)
                        flag_url = src if src.startswith('http') else urljoin('https://tmssl.akamaized.net', src)
        
                # logo: meestal ander img element in dezelfde header-box
                for img in header_box.find_all('img', src=True):
                    src = img.get('src', '')
                    if '/images/logo/' in src or f'/{comp_id.lower()}.png' in src.lower():
                        logo_url = src if src.startswith('http') else urljoin('https://tmssl.akamaized.net', src)
                        break
        
            # 2) fallback vlag als header niets gaf
            if not flag_id:
                for img in soup.find_all('img', src=True):
                    src = img.get('src', '')
                    if '/images/flagge/' not in src:
                        continue
                    m = re.search(r'/images/flagge/[^/]+/(\d+)\.', src)
                    if m:
                        flag_id = m.group(1)
                        flag_url = src if src.startswith('http') else urljoin('https://tmssl.akamaized.net', src)
                        break
        
            # 3) fallback logo
            if not logo_url:
                for img in soup.find_all('img', src=True):
                    src = img.get('src', '')
                    if '/images/logo/' in src or f'/{comp_id.lower()}.png' in src.lower():
                        logo_url = src if src.startswith('http') else urljoin('https://tmssl.akamaized.net', src)
                        break
        
            return flag_id, flag_url, logo_url

          comp_file = DATA / 'competitions.csv'
          rows = []
          fields = []

          with open(comp_file, encoding='utf-8') as f:
              reader = csv.DictReader(f)
              fields = list(reader.fieldnames or [])
              rows = list(reader)

          for col in ['flag_id', 'flag_url', 'logo_url']:
              if col not in fields:
                  fields.append(col)

          already = sum(1 for r in rows if r.get('flag_id') and r.get('logo_url'))
          print(f'Competities: {len(rows)}, al verwerkt: {already}')

          updated = 0
          for i, row in enumerate(rows):
              comp_id  = row.get('competition_id', '')
              comp_url = row.get('url', '')

              if row.get('flag_id') and row.get('logo_url'):
                  continue

              if not comp_url:
                  row['flag_id'] = ''
                  row['flag_url'] = ''
                  row['logo_url'] = ''
                  continue

              print(f'[{i+1:4d}/{len(rows)}] {comp_id:12s}', end=' ', flush=True)

              r = get(comp_url)
              if not r:
                  print('SKIP')
                  row['flag_id'] = ''
                  row['flag_url'] = ''
                  row['logo_url'] = ''
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')
              flag_id, flag_url, logo_url = find_flag_and_logo(soup, comp_id)

              row['flag_id'] = flag_id
              row['flag_url'] = flag_url
              row['logo_url'] = logo_url
              updated += 1

              print(f'flag:{flag_id or "-":5s} logo:{"ok" if logo_url else "-"}')

              if updated % 100 == 0:
                  with open(comp_file, 'w', newline='', encoding='utf-8') as f:
                      w = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
                      w.writeheader()
                      for r2 in rows:
                          w.writerow({k: r2.get(k, '') for k in fields})
                  print(f'  [SAVE] {updated} bijgewerkt')

              time.sleep(0.8 + random.uniform(0, 0.4))

          with open(comp_file, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              w.writeheader()
              for row in rows:
                  w.writerow({k: row.get(k, '') for k in fields})

          print(f'\nKlaar: {updated} bijgewerkt, {len(rows)} totaal')
          PYEOF

      - name: Stap 2 - Gzippen en committen
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"
          gzip -f data/csv/competitions.csv
          echo "competitions.csv.gz: $(wc -c < data/csv/competitions.csv.gz) bytes"
          git add data/csv/competitions.csv.gz
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "ScoutAI: vlaggen en logo's competities [${TIMESTAMP}]" || echo "Geen wijzigingen"
          git push
