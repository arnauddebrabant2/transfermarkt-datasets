name: Scrape Player Debuts

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Decompress players.csv.gz
        run: |
          python3 << 'PYEOF'
          import gzip, shutil
          from pathlib import Path

          gz = Path("data/csv/players.csv.gz")
          csvf = Path("data/csv/players.csv")

          if gz.exists():
              with gzip.open(gz, "rb") as f_in, open(csvf, "wb") as f_out:
                  shutil.copyfileobj(f_in, f_out)
              print(f"Decompressed: {gz} -> {csvf}")
          else:
              raise FileNotFoundError("data/csv/players.csv.gz niet gevonden")
          PYEOF

      - name: Scrape debuts and checkpoint every 250
        timeout-minutes: 320
        env:
          WORKERS: "4"
          SAVE_EVERY: "50"
          COMMIT_EVERY: "250"
          START_FROM: "1"
          BATCH_SIZE: "120"
        run: |
          python3 << 'PYEOF'
          import csv
          import os
          import re
          import time
          import gzip
          import shutil
          import subprocess
          from pathlib import Path
          from datetime import datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import requests
          from bs4 import BeautifulSoup

          PLAYERS_FILE = Path("data/csv/players.csv")
          GZ_FILE = Path("data/csv/players.csv.gz")

          WORKERS = int(os.getenv("WORKERS", "4"))
          SAVE_EVERY = int(os.getenv("SAVE_EVERY", "50"))
          COMMIT_EVERY = int(os.getenv("COMMIT_EVERY", "250"))
          START_FROM = int(os.getenv("START_FROM", "1"))
          BATCH_SIZE = int(os.getenv("BATCH_SIZE", "120"))

          USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36"

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept-Language": "nl-BE,nl;q=0.9,en;q=0.8",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Referer": "https://www.transfermarkt.be/",
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def run_cmd(cmd):
              print(">", " ".join(cmd), flush=True)
              subprocess.run(cmd, check=False)

          def save_rows(rows, fields):
              tmp = PLAYERS_FILE.with_suffix(".csv.tmp")
              with open(tmp, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  for row in rows:
                      w.writerow({k: row.get(k, "") for k in fields})
              tmp.replace(PLAYERS_FILE)

          def gzip_players():
              with open(PLAYERS_FILE, "rb") as f_in, gzip.open(GZ_FILE, "wb") as f_out:
                  shutil.copyfileobj(f_in, f_out)

          def git_checkpoint(msg):
              gzip_players()
              run_cmd(["git", "config", "user.name", "ScoutAI Bot"])
              run_cmd(["git", "config", "user.email", "actions@users.noreply.github.com"])
              run_cmd(["git", "add", str(GZ_FILE)])
              run_cmd(["git", "commit", "-m", msg])
              run_cmd(["git", "push"])

          def parse_date_nl(text):
              if not text:
                  return ""

              text = text.strip().lower()
              months = {
                  "jan.": "01", "feb.": "02", "mrt.": "03", "apr.": "04",
                  "mei": "05", "jun.": "06", "jul.": "07", "aug.": "08",
                  "sep.": "09", "okt.": "10", "nov.": "11", "dec.": "12",
                  "jan": "01", "feb": "02", "mrt": "03", "apr": "04",
                  "jun": "06", "jul": "07", "aug": "08", "sep": "09",
                  "okt": "10", "nov": "11", "dec": "12",
              }

              parts = text.replace("\xa0", " ").split()
              if len(parts) < 3:
                  return ""

              day = re.sub(r"\D", "", parts[0]).zfill(2)
              mon = months.get(parts[1], "")
              year = re.sub(r"\D", "", parts[2])

              if not mon or not year:
                  return ""

              return f"{year}-{mon}-{day}"

          def normalize_text(s):
              return re.sub(r"\s+", " ", (s or "").strip().lower())

          def find_section_rows(soup):
              table = soup.select_one("div.responsive-table table")
              if not table:
                  return {}

              result = {}
              current_section = None

              tbody = table.find("tbody")
              if not tbody:
                  return result

              for tr in tbody.find_all("tr", recursive=False):
                  head = tr.find("td", class_="hauptlink")
                  if head:
                      current_section = normalize_text(head.get_text(" ", strip=True))
                      continue

                  tds = tr.find_all("td", recursive=False)
                  if len(tds) < 4 or not current_section:
                      continue

                  if current_section not in result:
                      result[current_section] = tr

              return result

          def extract_club_name_from_row(tr):
              if not tr:
                  return ""
              tds = tr.find_all("td", recursive=False)
              if len(tds) < 3:
                  return ""
              club_td = tds[2]
              img = club_td.find("img")
              if img and img.get("title"):
                  return img.get("title", "").strip()
              a = club_td.find("a")
              if a:
                  return a.get("title", "").strip() or a.get_text(" ", strip=True)
              return club_td.get_text(" ", strip=True)

          def extract_date_from_row(tr):
              if not tr:
                  return ""
              tds = tr.find_all("td", recursive=False)
              if len(tds) < 4:
                  return ""
              return parse_date_nl(tds[3].get_text(" ", strip=True))

          def scrape_one(player_id, player_url):
              url = (player_url or "").strip()
              if not url:
                  return {"status": "no_url"}

              debut_url = re.sub(r"/profil/", "/debuets/", url)
              if "/debuets/" not in debut_url:
                  debut_url = url.rstrip("/") + "/debuets"

              try:
                  r = session.get(debut_url, timeout=20)

                  if r.status_code == 404:
                      return {"status": "not_found"}
                  if r.status_code in (403, 429):
                      return {"status": "blocked"}
                  if r.status_code != 200:
                      return {"status": f"http_{r.status_code}"}

                  soup = BeautifulSoup(r.text, "html.parser")
                  sections = find_section_rows(soup)

                  top_row = None
                  second_row = None

                  for key, row in sections.items():
                      if "hoogste divisie" in key:
                          top_row = row
                      elif "2de niveau" in key or "tweede niveau" in key or "2e niveau" in key:
                          second_row = row

                  return {
                      "status": "ok",
                      "hoogste_divisie_debut_date": extract_date_from_row(top_row),
                      "hoogste_divisie_debut_club": extract_club_name_from_row(top_row),
                      "tweede_niveau_debut_date": extract_date_from_row(second_row),
                      "tweede_niveau_debut_club": extract_club_name_from_row(second_row),
                  }

              except requests.RequestException:
                  return {"status": "request_error"}
              except Exception as e:
                  return {"status": f"error:{type(e).__name__}"}

          with open(PLAYERS_FILE, encoding="utf-8") as f:
              reader = csv.DictReader(f)
              fields = list(reader.fieldnames or [])
              rows = list(reader)

          new_cols = [
              "hoogste_divisie_debut_date",
              "hoogste_divisie_debut_club",
              "tweede_niveau_debut_date",
              "tweede_niveau_debut_club",
          ]
          for c in new_cols:
              if c not in fields:
                  fields.append(c)

          todo = []
          already = 0

          for idx, row in enumerate(rows, start=1):
              if idx < START_FROM:
                  continue

              if row.get("hoogste_divisie_debut_date") or row.get("tweede_niveau_debut_date"):
                  already += 1
                  continue

              pid = (row.get("player_id") or "").strip()
              purl = (row.get("url") or "").strip()
              name = (row.get("name") or "").strip()

              if not pid or not purl:
                  continue

              todo.append((idx, pid, name, purl))

          print(f"Spelers: {len(rows)}", flush=True)
          print(f"Al verwerkt: {already}", flush=True)
          print(f"Start vanaf: {START_FROM}", flush=True)
          print(f"Nog te doen: {len(todo)}", flush=True)
          print(f"Workers: {WORKERS}", flush=True)
          print(f"Batch size: {BATCH_SIZE}", flush=True)

          processed_since_save = 0
          processed_since_commit = 0
          total_done = 0

          row_map = {str((r.get("player_id") or "").strip()): r for r in rows}

          with ThreadPoolExecutor(max_workers=WORKERS) as ex:
              for batch_start in range(0, len(todo), BATCH_SIZE):
                  batch = todo[batch_start:batch_start + BATCH_SIZE]
                  futures = {}

                  for idx, pid, name, purl in batch:
                      futures[ex.submit(scrape_one, pid, purl)] = (idx, pid, name)
                      time.sleep(0.03)

                  for fut in as_completed(futures):
                      idx, pid, name = futures[fut]
                      res = fut.result()
                      row = row_map.get(str(pid))
                      if row is None:
                          continue

                      if res.get("status") == "ok":
                          row["hoogste_divisie_debut_date"] = res.get("hoogste_divisie_debut_date", "") or row.get("hoogste_divisie_debut_date", "")
                          row["hoogste_divisie_debut_club"] = res.get("hoogste_divisie_debut_club", "") or row.get("hoogste_divisie_debut_club", "")
                          row["tweede_niveau_debut_date"] = res.get("tweede_niveau_debut_date", "") or row.get("tweede_niveau_debut_date", "")
                          row["tweede_niveau_debut_club"] = res.get("tweede_niveau_debut_club", "") or row.get("tweede_niveau_debut_club", "")

                      total_done += 1
                      processed_since_save += 1
                      processed_since_commit += 1

                      top = row.get("hoogste_divisie_debut_date") or "-"
                      second = row.get("tweede_niveau_debut_date") or "-"
                      print(
                          f"[{idx:5d}/{len(rows)}] {pid:<8} {name[:35]:<35} -> {res.get('status','?'):<12} | hoogste:{top} | tweede:{second}",
                          flush=True
                      )

                      if processed_since_save >= SAVE_EVERY:
                          save_rows(rows, fields)
                          processed_since_save = 0
                          print(f"  [SAVE] {total_done} verwerkt sinds start", flush=True)

                      if processed_since_commit >= COMMIT_EVERY:
                          save_rows(rows, fields)
                          ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
                          git_checkpoint(f"ScoutAI debuts checkpoint [{ts}]")
                          processed_since_commit = 0
                          print(f"  [COMMIT/PUSH] {total_done} verwerkt sinds start", flush=True)

                  save_rows(rows, fields)
                  print(
                      f"  [BATCH DONE] {min(batch_start + BATCH_SIZE, len(todo))}/{len(todo)} todo verwerkt",
                      flush=True
                  )

          save_rows(rows, fields)
          ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          git_checkpoint(f"ScoutAI debuts full [{ts}]")
          print("Klaar.", flush=True)
          PYEOF

      - name: Summary
        run: |
          echo "=== DEBUT SCRAPE KLAAR ==="
          ls -lh data/csv/players.csv.gz
