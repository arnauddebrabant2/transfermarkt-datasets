name: Scrape Player Debuts

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml pandas

      - name: Decompress players.csv.gz
        run: |
          python3 << 'PYEOF'
          import gzip, shutil
          from pathlib import Path

          gz = Path("data/csv/players.csv.gz")
          csv_path = Path("data/csv/players.csv")

          if gz.exists():
              with gzip.open(gz, "rb") as f_in:
                  with open(csv_path, "wb") as f_out:
                      shutil.copyfileobj(f_in, f_out)
              print(f"Gedecomprimeerd: {gz} -> {csv_path}")
          elif csv_path.exists():
              print("players.csv bestaat al")
          else:
              raise FileNotFoundError("Geen data/csv/players.csv.gz of data/csv/players.csv gevonden")
          PYEOF

      - name: Scrape debuts from Transfermarkt
        timeout-minutes: 300
        run: |
          python3 << 'PYEOF'
          import csv
          import random
          import re
          import time
          from pathlib import Path
          from urllib.parse import urlparse

          import pandas as pd
          import requests
          from bs4 import BeautifulSoup

          DATA_DIR = Path("data/csv")
          PLAYERS_FILE = DATA_DIR / "players.csv"

          START_FROM = 1
          SAVE_EVERY = 50
          SLEEP_MIN = 1.2
          SLEEP_MAX = 2.2

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept-Language": "nl-BE,nl;q=0.9,en;q=0.8",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Referer": "https://www.transfermarkt.be/",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def save_rows(path, fields, rows):
              with open(path, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  for row in rows:
                      w.writerow({k: row.get(k, "") for k in fields})

          def clean_text(x):
              if not x:
                  return ""
              return re.sub(r"\s+", " ", x.get_text(" ", strip=True)).strip()

          def parse_date(s):
              s = (s or "").strip()
              if not s:
                  return ""
              dt = pd.to_datetime(s, dayfirst=True, errors="coerce")
              if pd.isna(dt):
                  return ""
              return dt.strftime("%Y-%m-%d")

          def extract_player_id_and_slug(row):
              player_id = str(row.get("player_id", "")).strip()
              url = str(row.get("url", "")).strip()

              if player_id and url:
                  try:
                      parts = urlparse(url).path.strip("/").split("/")
                      if "spieler" in parts:
                          idx = parts.index("spieler")
                          slug = parts[idx - 1] if idx - 1 >= 0 else ""
                          pid = parts[idx + 1] if idx + 1 < len(parts) else player_id
                          return pid, slug
                  except:
                      pass

              return player_id, ""

          def build_debut_url(player_id, slug):
              slug = (slug or "").strip().strip("/")
              if slug:
                  return f"https://www.transfermarkt.be/{slug}/debuets/spieler/{player_id}"
              return f"https://www.transfermarkt.be/spieler/debuets/spieler/{player_id}"

          def get(url, retries=4):
              last_status = None
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=25, allow_redirects=True)
                      last_status = r.status_code

                      if r.status_code == 200:
                          return r, "ok"

                      if r.status_code in (403, 429):
                          wait = 45 * (i + 1)
                          print(f"  HTTP{r.status_code} wacht {wait}s", end="")
                          time.sleep(wait)
                          continue

                      if r.status_code == 404:
                          return None, "not_found"

                      if r.status_code in (301, 302, 303, 307, 308):
                          time.sleep(2)
                          continue

                      if r.status_code in (401, 405, 406):
                          time.sleep(10 * (i + 1))
                          continue

                      time.sleep(5 * (i + 1))
                  except Exception:
                      time.sleep(6 * (i + 1))

              if last_status in (403, 429, 401, 405, 406):
                  return None, "blocked"
              if last_status == 404:
                  return None, "not_found"
              return None, "error"

          def parse_debut_page(html):
              soup = BeautifulSoup(html, "lxml")

              result = {
                  "debut_highest_division_date": "",
                  "debut_highest_division_club": "",
                  "debut_highest_division_competition": "",
                  "debut_second_tier_date": "",
                  "debut_second_tier_club": "",
                  "debut_second_tier_competition": "",
              }

              box = None
              for div in soup.select("div.box"):
                  h2 = div.select_one("h2.content-box-headline")
                  if h2 and "debut" in clean_text(h2).lower():
                      box = div
                      break

              if not box:
                  return result

              table = box.select_one("table")
              if not table:
                  return result

              current_section = None

              for tr in table.select("tbody tr"):
                  section_td = tr.select_one("td.hauptlink[colspan]")
                  if section_td:
                      current_section = clean_text(section_td).lower()
                      continue

                  cells = tr.find_all("td")
                  if len(cells) < 4:
                      continue

                  competition_cell = cells[1]
                  club_cell = cells[2]
                  date_cell = cells[3]

                  competition = clean_text(competition_cell)
                  date_val = parse_date(clean_text(date_cell))

                  club_link = club_cell.select_one("a[title]")
                  club_name = ""
                  if club_link:
                      club_name = (club_link.get("title") or "").strip()
                  if not club_name:
                      club_name = clean_text(club_cell)

                  if current_section == "hoogste divisie":
                      if not result["debut_highest_division_date"]:
                          result["debut_highest_division_date"] = date_val
                          result["debut_highest_division_club"] = club_name
                          result["debut_highest_division_competition"] = competition

                  elif current_section in ("2de niveau", "tweede niveau", "second tier", "2. niveau"):
                      if not result["debut_second_tier_date"]:
                          result["debut_second_tier_date"] = date_val
                          result["debut_second_tier_club"] = club_name
                          result["debut_second_tier_competition"] = competition

              return result

          rows = []
          fields = []

          with open(PLAYERS_FILE, encoding="utf-8") as f:
              reader = csv.DictReader(f)
              fields = list(reader.fieldnames or [])
              rows = list(reader)

          debut_cols = [
              "debut_highest_division_date",
              "debut_highest_division_club",
              "debut_highest_division_competition",
              "debut_second_tier_date",
              "debut_second_tier_club",
              "debut_second_tier_competition",
          ]

          for col in debut_cols:
              if col not in fields:
                  fields.append(col)

          already_done = sum(
              1 for r in rows
              if (r.get("debut_highest_division_date") or r.get("debut_second_tier_date"))
          )

          print(f"Spelers: {len(rows)}")
          print(f"Al verwerkt: {already_done}")
          print(f"Start vanaf: {START_FROM}")

          processed = 0
          checked = 0

          for idx, row in enumerate(rows, start=1):
              if idx < START_FROM:
                  continue

              player_id, slug = extract_player_id_and_slug(row)
              player_name = (row.get("name") or "").strip()

              if not player_id:
                  print(f"[{idx:5d}/{len(rows)}] {'-':8s} {player_name[:35]:35s} -> no_player_id")
                  continue

              if row.get("debut_highest_division_date") or row.get("debut_second_tier_date"):
                  continue

              checked += 1
              url = build_debut_url(player_id, slug)

              r, status = get(url)

              if not r:
                  print(
                      f"[{idx:5d}/{len(rows)}] {player_id:8s} {player_name[:35]:35s} "
                      f"-> {status:10s} | second:- | highest:-"
                  )
                  continue

              parsed = parse_debut_page(r.text)

              row["debut_highest_division_date"] = parsed["debut_highest_division_date"]
              row["debut_highest_division_club"] = parsed["debut_highest_division_club"]
              row["debut_highest_division_competition"] = parsed["debut_highest_division_competition"]

              row["debut_second_tier_date"] = parsed["debut_second_tier_date"]
              row["debut_second_tier_club"] = parsed["debut_second_tier_club"]
              row["debut_second_tier_competition"] = parsed["debut_second_tier_competition"]

              processed += 1

              second_show = row["debut_second_tier_date"] or "-"
              highest_show = row["debut_highest_division_date"] or "-"

              print(
                  f"[{idx:5d}/{len(rows)}] {player_id:8s} {player_name[:35]:35s} "
                  f"-> ok         | second:{second_show} | highest:{highest_show}"
              )

              if processed % SAVE_EVERY == 0:
                  save_rows(PLAYERS_FILE, fields, rows)
                  print(f"  [SAVE] {processed} verwerkt sinds start")

              time.sleep(random.uniform(SLEEP_MIN, SLEEP_MAX))

          save_rows(PLAYERS_FILE, fields, rows)
          print(f"\nKlaar: {processed} bijgewerkt, {checked} gecontroleerd")
          PYEOF

      - name: Gzip and commit
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"

          gzip -f data/csv/players.csv
          echo "players.csv.gz: $(wc -c < data/csv/players.csv.gz) bytes"

          git add data/csv/players.csv.gz
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "ScoutAI: player debuts added [${TIMESTAMP}]" || echo "Geen wijzigingen"
          git push

      - name: Summary
        run: |
          echo "=== PLAYER DEBUT SCRAPE KLAAR ==="
          echo "data/csv/players.csv.gz: $(wc -c < data/csv/players.csv.gz) bytes"
