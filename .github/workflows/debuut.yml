name: Scrape Player Debuts

on:
  workflow_dispatch:
    inputs:
      start_from:
        description: "Start vanaf rijnummer (voor resume)"
        required: false
        default: "1"
      workers:
        description: "Aantal parallelle workers"
        required: false
        default: "8"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Decompress players.csv.gz
        run: |
          python3 << 'PYEOF'
          import gzip, shutil
          from pathlib import Path

          gz  = Path("data/csv/players.csv.gz")
          csv = Path("data/csv/players.csv")

          if gz.exists():
              with gzip.open(gz, "rb") as fi, open(csv, "wb") as fo:
                  shutil.copyfileobj(fi, fo)
              print(f"Gedecomprimeerd: {gz} -> {csv} ({csv.stat().st_size // 1024} KB)")
          elif csv.exists():
              print("players.csv bestaat al")
          else:
              raise FileNotFoundError("Geen players.csv.gz of players.csv gevonden")
          PYEOF

      - name: Scrape debuts from Transfermarkt
        timeout-minutes: 300
        env:
          START_FROM: ${{ github.event.inputs.start_from || '1' }}
          WORKERS: ${{ github.event.inputs.workers || '8' }}
          SAVE_EVERY: "100"
          COMMIT_EVERY: "500"
          BATCH_SIZE: "400"
        run: |
          python3 << 'PYEOF'
          import csv
          import gzip
          import os
          import random
          import re
          import shutil
          import subprocess
          import threading
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter

          DATA_DIR = Path("data/csv")
          PLAYERS_FILE = DATA_DIR / "players.csv"
          GZ_FILE = DATA_DIR / "players.csv.gz"

          START_FROM = int(os.getenv("START_FROM", "1"))
          WORKERS = int(os.getenv("WORKERS", "8"))
          SAVE_EVERY = int(os.getenv("SAVE_EVERY", "100"))
          COMMIT_EVERY = int(os.getenv("COMMIT_EVERY", "500"))
          BATCH_SIZE = int(os.getenv("BATCH_SIZE", "400"))

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept-Language": "nl-BE,nl;q=0.9,en;q=0.8,de;q=0.7,fr;q=0.6",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Referer": "https://www.transfermarkt.be/",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          HIGHEST_TITLES = {
              "hoogste divisie",
              "highest division",
              "höchste spielklasse",
              "division la plus haute",
              "massima divisione",
              "primera division",
              "primeira divisão",
              "en yüksek lig",
          }

          SECOND_TITLES = {
              "2de niveau",
              "tweede niveau",
              "2e niveau",
              "second tier",
              "second division",
              "2nd division",
              "2. spielklasse",
              "2. liga",
              "deuxième division",
              "seconda divisione",
              "segunda division",
          }

          thread_local = threading.local()

          MONTHS = {
              "jan.": "01", "jan": "01",
              "feb.": "02", "feb": "02",
              "mrt.": "03", "mrt": "03", "mar.": "03", "mar": "03",
              "apr.": "04", "apr": "04",
              "mei": "05", "may": "05",
              "jun.": "06", "jun": "06",
              "jul.": "07", "jul": "07",
              "aug.": "08", "aug": "08",
              "sep.": "09", "sep": "09",
              "okt.": "10", "okt": "10", "oct.": "10", "oct": "10",
              "nov.": "11", "nov": "11",
              "dec.": "12", "dec": "12",
          }

          def get_session():
              if hasattr(thread_local, "session"):
                  return thread_local.session

              s = requests.Session()
              s.headers.update(HEADERS)

              adapter = HTTPAdapter(pool_connections=100, pool_maxsize=100, max_retries=0)
              s.mount("http://", adapter)
              s.mount("https://", adapter)

              thread_local.session = s
              return s

          def run_cmd(cmd):
              print(">", " ".join(cmd), flush=True)
              subprocess.run(cmd, check=False)

          def save_rows(path, fields, rows):
              tmp = path.with_suffix(".tmp")
              with open(tmp, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  for row in rows:
                      w.writerow({k: row.get(k, "") for k in fields})
              tmp.replace(path)

          def gzip_players():
              with open(PLAYERS_FILE, "rb") as fi, gzip.open(GZ_FILE, "wb") as fo:
                  shutil.copyfileobj(fi, fo)

          def git_checkpoint(msg):
              gzip_players()
              for cmd in [
                  ["git", "config", "user.name", "ScoutAI Bot"],
                  ["git", "config", "user.email", "actions@users.noreply.github.com"],
                  ["git", "add", str(GZ_FILE)],
                  ["git", "commit", "-m", msg],
                  ["git", "push"],
              ]:
                  run_cmd(cmd)

          def clean_text(el):
              if not el:
                  return ""
              return re.sub(r"\s+", " ", el.get_text(" ", strip=True)).strip()

          def normalize_text(s):
              return re.sub(r"\s+", " ", (s or "").strip().lower())

          def parse_date(text):
              s = normalize_text(text).replace("\xa0", " ")
              if not s:
                  return ""

              parts = s.split()
              if len(parts) < 3:
                  return ""

              day = re.sub(r"\D", "", parts[0]).zfill(2)
              month = MONTHS.get(parts[1], "")
              year = re.sub(r"\D", "", parts[2])

              if not day or not month or not year:
                  return ""
              return f"{year}-{month}-{day}"

          def build_debut_url(row):
              player_id = str(row.get("player_id", "")).strip()
              url = str(row.get("url", "")).strip()
              slug = ""

              if url:
                  try:
                      parts = urlparse(url).path.strip("/").split("/")
                      if "spieler" in parts:
                          idx = parts.index("spieler")
                          slug = parts[idx - 1] if idx > 0 else ""
                          player_id = parts[idx + 1] if idx + 1 < len(parts) else player_id
                  except Exception:
                      pass

              if slug and player_id:
                  return f"https://www.transfermarkt.be/{slug}/debuets/spieler/{player_id}"
              return f"https://www.transfermarkt.be/spieler/debuets/spieler/{player_id}"

          def fetch(url, retries=3):
              session = get_session()

              for attempt in range(retries):
                  try:
                      r = session.get(url, timeout=20, allow_redirects=True)

                      if r.status_code == 200:
                          return r, "ok"
                      if r.status_code == 404:
                          return None, "not_found"

                      if r.status_code in (403, 429):
                          time.sleep(8 * (attempt + 1))
                          continue

                      time.sleep(2 * (attempt + 1))
                  except Exception:
                      time.sleep(2 * (attempt + 1))

              return None, "error"

          def parse_debut_page(html):
              soup = BeautifulSoup(html, "lxml")

              result = {
                  "debut_highest_division_date": "",
                  "debut_highest_division_club": "",
                  "debut_highest_division_competition": "",
                  "debut_second_tier_date": "",
                  "debut_second_tier_club": "",
                  "debut_second_tier_competition": "",
              }

              table = None
              for div in soup.select("div.box"):
                  h2 = div.select_one("h2.content-box-headline")
                  if h2 and "debut" in normalize_text(clean_text(h2)):
                      table = div.select_one("table")
                      break

              if not table:
                  table = soup.select_one("div.responsive-table table")
              if not table:
                  return result

              current_section = ""

              for tr in table.select("tbody tr"):
                  header_td = tr.select_one("td.hauptlink[colspan]")
                  if header_td:
                      current_section = normalize_text(clean_text(header_td))
                      continue

                  cells = tr.find_all("td", recursive=False)
                  if len(cells) < 4:
                      continue

                  competition = clean_text(cells[1])
                  date_val = parse_date(clean_text(cells[3]))
                  if not date_val:
                      continue

                  club = ""
                  img = cells[2].find("img")
                  if img and img.get("title"):
                      club = img.get("title", "").strip()

                  if not club:
                      a = cells[2].find("a")
                      if a:
                          club = (a.get("title") or clean_text(a)).strip()

                  if current_section in HIGHEST_TITLES and not result["debut_highest_division_date"]:
                      result["debut_highest_division_date"] = date_val
                      result["debut_highest_division_club"] = club
                      result["debut_highest_division_competition"] = competition

                  elif current_section in SECOND_TITLES and not result["debut_second_tier_date"]:
                      result["debut_second_tier_date"] = date_val
                      result["debut_second_tier_club"] = club
                      result["debut_second_tier_competition"] = competition

                  if result["debut_highest_division_date"] and result["debut_second_tier_date"]:
                      break

              return result

          def scrape_one(row):
              url = build_debut_url(row)
              response, status = fetch(url)

              if not response:
                  return row, status

              parsed = parse_debut_page(response.text)
              for k, v in parsed.items():
                  row[k] = v

              # heel kleine jitter, niet meer 1-2 sec
              time.sleep(random.uniform(0.03, 0.12))
              return row, "ok"

          with open(PLAYERS_FILE, encoding="utf-8") as f:
              reader = csv.DictReader(f)
              fields = list(reader.fieldnames or [])
              rows = list(reader)

          debut_cols = [
              "debut_highest_division_date",
              "debut_highest_division_club",
              "debut_highest_division_competition",
              "debut_second_tier_date",
              "debut_second_tier_club",
              "debut_second_tier_competition",
          ]
          for col in debut_cols:
              if col not in fields:
                  fields.append(col)

          todo = []
          already = 0

          for idx, row in enumerate(rows, start=1):
              if idx < START_FROM:
                  continue

              if row.get("debut_highest_division_date") or row.get("debut_second_tier_date"):
                  already += 1
                  continue

              if not row.get("player_id"):
                  continue

              todo.append((idx, row))

          print(f"Spelers totaal: {len(rows)}", flush=True)
          print(f"Al verwerkt:    {already}", flush=True)
          print(f"Nog te doen:    {len(todo)}", flush=True)
          print(f"Workers:        {WORKERS}", flush=True)
          print(f"Batch size:     {BATCH_SIZE}", flush=True)

          processed = 0
          since_save = 0
          since_commit = 0

          with ThreadPoolExecutor(max_workers=WORKERS) as ex:
              for batch_start in range(0, len(todo), BATCH_SIZE):
                  batch = todo[batch_start:batch_start + BATCH_SIZE]
                  futures = {ex.submit(scrape_one, row): (idx, row) for idx, row in batch}

                  for fut in as_completed(futures):
                      idx, orig = futures[fut]
                      updated_row, status = fut.result()

                      name = (updated_row.get("name") or "").strip()[:35]
                      pid = (updated_row.get("player_id") or "").strip()
                      highest = updated_row.get("debut_highest_division_date") or "-"
                      second = updated_row.get("debut_second_tier_date") or "-"

                      print(
                          f"[{idx:5d}/{len(rows)}] {pid:8s} {name:<35s} -> {status:<10s} | highest:{highest} | second:{second}",
                          flush=True
                      )

                      processed += 1
                      since_save += 1
                      since_commit += 1

                      if since_save >= SAVE_EVERY:
                          save_rows(PLAYERS_FILE, fields, rows)
                          since_save = 0
                          print(f"  [SAVE] {processed} verwerkt", flush=True)

                      if since_commit >= COMMIT_EVERY:
                          save_rows(PLAYERS_FILE, fields, rows)
                          ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
                          git_checkpoint(f"ScoutAI debuts checkpoint [{ts}]")
                          since_commit = 0
                          print(f"  [COMMIT] {processed} verwerkt", flush=True)

                  save_rows(PLAYERS_FILE, fields, rows)
                  print(f"  [BATCH DONE] {min(batch_start + BATCH_SIZE, len(todo))}/{len(todo)}", flush=True)

          save_rows(PLAYERS_FILE, fields, rows)
          ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          git_checkpoint(f"ScoutAI debuts volledig [{ts}]")
          print(f"\nKlaar: {processed} bijgewerkt", flush=True)
          PYEOF

      - name: Summary
        run: |
          echo "=== PLAYER DEBUT SCRAPE KLAAR ==="
          [ -f data/csv/players.csv.gz ] && echo "players.csv.gz: $(wc -c < data/csv/players.csv.gz) bytes"
