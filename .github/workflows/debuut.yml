name: Scrape Transfermarkt Debuts

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas lxml

      - name: Maak output map aan
        run: mkdir -p data/csv data/tmp

      - name: Decompress players.csv.gz
        run: |
          python3 << 'PYEOF'
          import gzip, shutil
          from pathlib import Path

          gz = Path('data/csv/players.csv.gz')
          out = Path('data/csv/players.csv')

          if gz.exists():
              with gzip.open(gz, 'rb') as f_in, open(out, 'wb') as f_out:
                  shutil.copyfileobj(f_in, f_out)
              print(f"Gedecomprimeerd: {gz.name} -> {out.name}")
          elif out.exists():
              print("players.csv bestaat al")
          else:
              raise FileNotFoundError("Geen players.csv.gz of players.csv gevonden")
          PYEOF

      - name: Scrape debuten
        timeout-minutes: 320
        run: |
          python3 << 'PYEOF'
          import re
          import time
          import random
          import pandas as pd
          import requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          DATA = Path("data/csv")
          TMP = Path("data/tmp")
          TMP.mkdir(exist_ok=True)

          PLAYERS_FILE = DATA / "players.csv"
          CHECKPOINT_FILE = TMP / "debut_checkpoint.csv"

          START_FROM = 1          # 1-based index
          SAVE_EVERY = 25
          MIN_SLEEP = 2.5
          MAX_SLEEP = 5.5

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "nl-BE,nl;q=0.9,en-GB;q=0.8,en;q=0.7",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Referer": "https://www.transfermarkt.be/",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          DATE_RE = re.compile(r'(\d{4}-\d{2}-\d{2}|\d{2}\.\d{2}\.\d{4}|\d{2}/\d{2}/\d{4})')

          def normalize_date(s):
              if not s:
                  return ""
              s = str(s).strip()
              try:
                  dt = pd.to_datetime(s, dayfirst=True, errors="coerce")
                  if pd.isna(dt):
                      return ""
                  return dt.strftime("%Y-%m-%d")
              except:
                  return ""

          def build_debut_urls(player_url, player_id):
              urls = []

              if player_url and str(player_url).strip():
                  u = str(player_url).strip()

                  # algemene vervangingen op bestaande speler-url
                  patterns = [
                      (r'/profil/spieler/\d+', f'/debuets/spieler/{player_id}'),
                      (r'/marktwertverlauf/spieler/\d+', f'/debuets/spieler/{player_id}'),
                      (r'/leistungsdaten/spieler/\d+', f'/debuets/spieler/{player_id}'),
                      (r'/transfers/spieler/\d+', f'/debuets/spieler/{player_id}'),
                      (r'/verletzungen/spieler/\d+', f'/debuets/spieler/{player_id}'),
                      (r'/geruechte/spieler/\d+', f'/debuets/spieler/{player_id}'),
                  ]
                  for pat, repl in patterns:
                      if re.search(pat, u):
                          urls.append(re.sub(pat, repl, u))

                  # fallback door alles na speler slug opnieuw te bouwen
                  m = re.search(r'^(https?://[^/]+/[^/]+)/[^/]+/spieler/(\d+)', u)
                  if m:
                      base_slug = m.group(1)
                      pid = m.group(2)
                      urls.append(f"{base_slug}/debuets/spieler/{pid}")

              # harde fallbacks
              urls.extend([
                  f"https://www.transfermarkt.be/spieler/debuets/spieler/{player_id}",
                  f"https://www.transfermarkt.co.uk/spieler/debuets/spieler/{player_id}",
                  f"https://www.transfermarkt.com/spieler/debuets/spieler/{player_id}",
              ])

              # unique
              seen = set()
              out = []
              for u in urls:
                  if u and u not in seen:
                      seen.add(u)
                      out.append(u)
              return out

          def get(url, retries=3):
              last_status = None
              for attempt in range(retries):
                  try:
                      r = session.get(url, timeout=25, allow_redirects=True)
                      last_status = r.status_code

                      if r.status_code == 200:
                          txt = r.text or ""
                          low = txt.lower()
                          if "please enable js" in low or "access denied" in low or "forbidden" in low:
                              return None, "blocked"
                          return r, "ok"

                      if r.status_code in (403, 429):
                          time.sleep(20 * (attempt + 1))
                      elif r.status_code in (404,):
                          return None, "not_found"
                      else:
                          time.sleep(5 * (attempt + 1))
                  except Exception:
                      time.sleep(5 * (attempt + 1))

              if last_status in (403, 429):
                  return None, "blocked"
              if last_status == 404:
                  return None, "not_found"
              return None, "error"

          def clean_text(x):
              return re.sub(r'\s+', ' ', str(x or '')).strip()

          def extract_date_from_text(text):
              text = clean_text(text)
              m = DATE_RE.search(text)
              if not m:
                  return ""
              return normalize_date(m.group(1))

          def extract_competition_from_row(cells):
              texts = [clean_text(td.get_text(" ", strip=True)) for td in cells]
              texts = [t for t in texts if t]
              if not texts:
                  return ""

              # neem eerste niet-datum, niet puur numerieke, niet mini-label tekst
              bad_parts = {"datum", "date", "club", "verein", "age", "leeftijd"}
              for t in texts:
                  low = t.lower()
                  if extract_date_from_text(t):
                      continue
                  if low in bad_parts:
                      continue
                  if re.fullmatch(r'[\d\W]+', t):
                      continue
                  if len(t) < 3:
                      continue
                  return t
              return ""

          def parse_debut_page(html):
              soup = BeautifulSoup(html, "lxml")

              page_text = soup.get_text(" ", strip=True).lower()
              if "debu" not in page_text and "debut" not in page_text:
                  return None

              pro_date = ""
              pro_comp = ""
              first_date = ""
              first_comp = ""

              # Strategie 1: zoek blocks/tables met relevante headings
              tables = soup.find_all("table")
              for table in tables:
                  container_text = clean_text(table.get_text(" ", strip=True)).lower()

                  is_pro_table = any(x in container_text for x in [
                      "profdebuut", "prodebuut", "professional debut", "profidebüt", "profidebuet"
                  ])
                  is_first_table = any(x in container_text for x in [
                      "debuut in hoogste divisie", "debut in top-flight", "top-flight debut",
                      "debuut eerste divisie", "debuut 1ste elftal", "erstliga-debüt"
                  ])

                  if not is_pro_table and not is_first_table:
                      continue

                  rows = table.find_all("tr")
                  for tr in rows:
                      cells = tr.find_all(["td", "th"])
                      if not cells:
                          continue

                      row_text = clean_text(tr.get_text(" ", strip=True))
                      row_date = extract_date_from_text(row_text)
                      row_comp = extract_competition_from_row(cells)

                      if is_pro_table and not pro_date and row_date:
                          pro_date = row_date
                          pro_comp = row_comp

                      if is_first_table and not first_date and row_date:
                          first_date = row_date
                          first_comp = row_comp

              # Strategie 2: zoek labels globaal in de pagina en kijk nearby text
              if not pro_date or not first_date:
                  all_rows = soup.find_all(["tr", "div", "li", "p"])
                  for el in all_rows:
                      txt = clean_text(el.get_text(" ", strip=True))
                      low = txt.lower()

                      if not pro_date and any(x in low for x in ["profdebuut", "prodebuut", "professional debut", "profidebüt"]):
                          row_date = extract_date_from_text(txt)
                          if row_date:
                              pro_date = row_date
                              if not pro_comp:
                                  pro_comp = txt

                      if not first_date and any(x in low for x in ["top-flight debut", "debuut in hoogste divisie", "debuut eerste divisie", "erstliga-debüt"]):
                          row_date = extract_date_from_text(txt)
                          if row_date:
                              first_date = row_date
                              if not first_comp:
                                  first_comp = txt

              return {
                  "pro_debut_date": pro_date,
                  "pro_debut_competition": clean_text(pro_comp)[:180],
                  "first_team_debut_date": first_date,
                  "first_team_debut_competition": clean_text(first_comp)[:180],
              }

          def save_checkpoint(df):
              df.to_csv(CHECKPOINT_FILE, index=False, encoding="utf-8")
              df.to_csv(PLAYERS_FILE, index=False, encoding="utf-8")

          # laad bestaande data
          if CHECKPOINT_FILE.exists():
              players = pd.read_csv(CHECKPOINT_FILE, low_memory=False)
              print("Checkpoint geladen")
          else:
              players = pd.read_csv(PLAYERS_FILE, low_memory=False)

          for col in [
              "pro_debut_date",
              "pro_debut_competition",
              "first_team_debut_date",
              "first_team_debut_competition",
              "debut_scrape_status",
              "debut_scrape_url",
          ]:
              if col not in players.columns:
                  players[col] = ""

          total = len(players)
          already = ((players["debut_scrape_status"].fillna("") != "")).sum()
          print(f"Spelers: {total}")
          print(f"Al verwerkt: {already}")
          print(f"Start vanaf: {START_FROM}")

          processed = 0

          for idx, row in players.iterrows():
              rownum = idx + 1
              if rownum < START_FROM:
                  continue

              status_now = str(row.get("debut_scrape_status", "") or "").strip()
              if status_now in {"ok", "not_found"}:
                  continue

              player_id = str(row.get("player_id", "") or "").strip()
              player_name = clean_text(row.get("name", ""))

              if not player_id:
                  players.at[idx, "debut_scrape_status"] = "no_player_id"
                  continue

              player_url = str(row.get("url", "") or "").strip()
              urls = build_debut_urls(player_url, player_id)

              final_status = "not_found"
              found_data = None
              used_url = ""

              for url in urls:
                  r, st = get(url, retries=3)

                  if st == "ok" and r is not None:
                      parsed = parse_debut_page(r.text)
                      if parsed is not None:
                          found_data = parsed
                          used_url = url
                          final_status = "ok"
                          break
                      else:
                          final_status = "parse_failed"

                  elif st == "blocked":
                      final_status = "blocked"
                      used_url = url
                      # niet verder blijven proberen op hetzelfde moment
                      break
                  elif st == "not_found":
                      final_status = "not_found"
                      used_url = url
                      continue
                  else:
                      final_status = st
                      used_url = url
                      continue

              if found_data:
                  players.at[idx, "pro_debut_date"] = found_data.get("pro_debut_date", "") or players.at[idx, "pro_debut_date"]
                  players.at[idx, "pro_debut_competition"] = found_data.get("pro_debut_competition", "") or players.at[idx, "pro_debut_competition"]
                  players.at[idx, "first_team_debut_date"] = found_data.get("first_team_debut_date", "") or players.at[idx, "first_team_debut_date"]
                  players.at[idx, "first_team_debut_competition"] = found_data.get("first_team_debut_competition", "") or players.at[idx, "first_team_debut_competition"]

              players.at[idx, "debut_scrape_status"] = final_status
              players.at[idx, "debut_scrape_url"] = used_url

              pro_show = players.at[idx, "pro_debut_date"] if str(players.at[idx, "pro_debut_date"]).strip() else "-"
              first_show = players.at[idx, "first_team_debut_date"] if str(players.at[idx, "first_team_debut_date"]).strip() else "-"

              print(f"[{rownum:5d}/{total}] {player_id:8s} {player_name[:35]:35s} -> {final_status:11s} | pro:{pro_show} | first:{first_show}")

              processed += 1

              if processed % SAVE_EVERY == 0:
                  save_checkpoint(players)
                  print(f"  [SAVE] {processed} verwerkt sinds start")

              # cooldown
              if final_status == "blocked":
                  save_checkpoint(players)
                  print("  [BLOCKED] lange cooldown 180s")
                  time.sleep(180)
              else:
                  time.sleep(random.uniform(MIN_SLEEP, MAX_SLEEP))

          save_checkpoint(players)
          print("\nKlaar.")
          print(f"Met pro_debut_date: {(players['pro_debut_date'].fillna('').astype(str).str.strip() != '').sum()}")
          print(f"Met first_team_debut_date: {(players['first_team_debut_date'].fillna('').astype(str).str.strip() != '').sum()}")
          PYEOF

      - name: Gzip en commit
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"

          gzip -f data/csv/players.csv
          echo "players.csv.gz: $(wc -c < data/csv/players.csv.gz) bytes"

          git add data/csv/players.csv.gz data/tmp/debut_checkpoint.csv
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "ScoutAI: scrape debuts from Transfermarkt [${TIMESTAMP}]" || echo "Geen wijzigingen"
          git push

      - name: Samenvatting
        run: |
          echo "=== DEBUT SCRAPE KLAAR ==="
          [ -f data/csv/players.csv.gz ] && echo "data/csv/players.csv.gz: $(wc -c < data/csv/players.csv.gz) bytes"
          [ -f data/tmp/debut_checkpoint.csv ] && echo "data/tmp/debut_checkpoint.csv: $(wc -c < data/tmp/debut_checkpoint.csv) bytes"
