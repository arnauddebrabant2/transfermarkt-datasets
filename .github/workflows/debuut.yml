name: Scrape Player Debuts

on:
  workflow_dispatch:
    inputs:
      start_from:
        description: 'Start vanaf rijnummer (voor resume)'
        required: false
        default: '1'
      workers:
        description: 'Aantal parallelle workers'
        required: false
        default: '8'
      save_every:
        description: 'Opslaan elke N spelers'
        required: false
        default: '100'
      commit_every:
        description: 'Commit elke N spelers'
        required: false
        default: '500'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas

      - name: Decompress players.csv.gz
        run: |
          python3 -c "
          import gzip, shutil
          from pathlib import Path
          gz  = Path('data/csv/players.csv.gz')
          csv = Path('data/csv/players.csv')
          if gz.exists():
              with gzip.open(gz,'rb') as fi, open(csv,'wb') as fo:
                  shutil.copyfileobj(fi, fo)
              print(f'Gedecomprimeerd: {csv.stat().st_size//1024} KB')
          elif csv.exists():
              print('players.csv bestaat al')
          else:
              raise FileNotFoundError('Geen players.csv.gz of players.csv')
          "

      - name: Scrape debuts
        timeout-minutes: 320
        env:
          START_FROM:   ${{ github.event.inputs.start_from   || '1' }}
          WORKERS:      ${{ github.event.inputs.workers      || '8' }}
          SAVE_EVERY:   ${{ github.event.inputs.save_every   || '100' }}
          COMMIT_EVERY: ${{ github.event.inputs.commit_every || '500' }}
        run: |
          python3 << 'PYEOF'
          import csv, random, re, time, os, gzip, shutil, subprocess, threading
          from pathlib import Path
          from urllib.parse import urlparse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime

          import pandas as pd
          import requests
          from bs4 import BeautifulSoup

          DATA_DIR     = Path("data/csv")
          PLAYERS_FILE = DATA_DIR / "players.csv"
          GZ_FILE      = DATA_DIR / "players.csv.gz"

          START_FROM   = int(os.getenv("START_FROM",   "1"))
          WORKERS      = int(os.getenv("WORKERS",      "8"))
          SAVE_EVERY   = int(os.getenv("SAVE_EVERY",   "100"))
          COMMIT_EVERY = int(os.getenv("COMMIT_EVERY", "500"))

          # Sneller: kortere sleep, meer workers
          # Met 8 workers en 0.3-0.8s sleep ≈ 10 spelers/sec ≈ 39K in ~65 min
          SLEEP_MIN = 0.3
          SLEEP_MAX = 0.8

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept-Language": "nl-BE,nl;q=0.9,en;q=0.8",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Referer": "https://www.transfermarkt.be/",
          }

          HIGHEST_TITLES = {
              "hoogste divisie", "highest division", "höchste spielklasse",
              "division la plus haute", "massima divisione", "primera division",
              "primeira divisão", "en yüksek lig",
          }
          SECOND_TITLES = {
              "2de niveau", "tweede niveau", "second tier", "second division",
              "2nd division", "2. spielklasse", "2. liga", "deuxième division",
              "seconda divisione", "segunda division",
          }

          save_lock   = threading.Lock()
          commit_lock = threading.Lock()

          def make_session():
              s = requests.Session()
              s.headers.update(HEADERS)
              return s

          def save_rows(path, fields, rows):
              tmp = path.with_suffix(".tmp")
              with open(tmp, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  for row in rows:
                      w.writerow({k: row.get(k, "") for k in fields})
              tmp.replace(path)

          def git_commit(msg):
              with gzip.open(GZ_FILE, "wb") as fo:
                  with open(PLAYERS_FILE, "rb") as fi:
                      shutil.copyfileobj(fi, fo)
              subprocess.run(["git", "config", "user.name",  "ScoutAI Bot"],  check=False)
              subprocess.run(["git", "config", "user.email", "actions@users.noreply.github.com"], check=False)
              subprocess.run(["git", "add", str(GZ_FILE)], check=False)
              result = subprocess.run(["git", "commit", "-m", msg], check=False, capture_output=True)
              if result.returncode == 0:
                  subprocess.run(["git", "push"], check=False)
                  print(f"  [COMMIT+PUSH] {msg}", flush=True)
              else:
                  print(f"  [COMMIT] Geen wijzigingen", flush=True)

          def clean_text(el):
              if not el:
                  return ""
              return re.sub(r"\s+", " ", el.get_text(" ", strip=True)).strip()

          def parse_date(s):
              s = (s or "").strip()
              if not s:
                  return ""
              dt = pd.to_datetime(s, dayfirst=True, errors="coerce")
              return "" if pd.isna(dt) else dt.strftime("%Y-%m-%d")

          def build_debut_url(row):
              pid = str(row.get("player_id", "")).strip()
              url = str(row.get("url", "")).strip()
              slug = ""
              if url:
                  try:
                      parts = urlparse(url).path.strip("/").split("/")
                      if "spieler" in parts:
                          i = parts.index("spieler")
                          slug = parts[i - 1] if i > 0 else ""
                          pid  = parts[i + 1] if i + 1 < len(parts) else pid
                  except:
                      pass
              base = f"https://www.transfermarkt.be/{slug}" if slug else "https://www.transfermarkt.be/spieler"
              return f"{base}/debuets/spieler/{pid}"

          def fetch(url, session, retries=3):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=20, allow_redirects=True)
                      if r.status_code == 200:
                          return r, "ok"
                      if r.status_code == 404:
                          return None, "not_found"
                      if r.status_code in (403, 429):
                          wait = 30 * (i + 1)
                          print(f"  HTTP{r.status_code} → wacht {wait}s", flush=True)
                          time.sleep(wait)
                          continue
                      time.sleep(3 * (i + 1))
                  except Exception as e:
                      time.sleep(4 * (i + 1))
              return None, "error"

          def parse_debut_page(html):
              soup = BeautifulSoup(html, "lxml")
              result = {
                  "debut_highest_division_date": "", "debut_highest_division_club": "",
                  "debut_highest_division_competition": "",
                  "debut_second_tier_date": "",     "debut_second_tier_club": "",
                  "debut_second_tier_competition": "",
              }

              table = None
              for div in soup.select("div.box"):
                  h2 = div.select_one("h2.content-box-headline")
                  if h2 and "debut" in clean_text(h2).lower():
                      table = div.select_one("table")
                      break
              if not table:
                  table = soup.select_one("div.responsive-table table")
              if not table:
                  return result

              current = ""
              for tr in table.select("tbody tr"):
                  hd = tr.select_one("td.hauptlink[colspan]")
                  if hd:
                      current = clean_text(hd).lower().strip()
                      continue

                  cells = tr.find_all("td")
                  if len(cells) < 4:
                      continue

                  date_val = parse_date(clean_text(cells[3]))
                  if not date_val:
                      continue

                  competition = clean_text(cells[1])

                  club = ""
                  img = cells[2].find("img")
                  if img and img.get("title"):
                      club = img["title"].strip()
                  if not club:
                      a = cells[2].find("a")
                      if a:
                          club = (a.get("title") or clean_text(a)).strip()

                  if current in HIGHEST_TITLES and not result["debut_highest_division_date"]:
                      result["debut_highest_division_date"]        = date_val
                      result["debut_highest_division_club"]        = club
                      result["debut_highest_division_competition"] = competition

                  elif current in SECOND_TITLES and not result["debut_second_tier_date"]:
                      result["debut_second_tier_date"]             = date_val
                      result["debut_second_tier_club"]             = club
                      result["debut_second_tier_competition"]      = competition

                  if result["debut_highest_division_date"] and result["debut_second_tier_date"]:
                      break

              return result

          def scrape_one(row):
              session = make_session()
              try:
                  url = build_debut_url(row)
                  r, status = fetch(url, session)
                  if r:
                      parsed = parse_debut_page(r.text)
                      for k, v in parsed.items():
                          row[k] = v
                  time.sleep(random.uniform(SLEEP_MIN, SLEEP_MAX))
                  return row, status
              except Exception as e:
                  return row, f"error:{e}"
              finally:
                  session.close()

          # ── Laden ─────────────────────────────────────────────────────────
          with open(PLAYERS_FILE, encoding="utf-8") as f:
              reader = csv.DictReader(f)
              fields = list(reader.fieldnames or [])
              rows   = list(reader)

          DEBUT_COLS = [
              "debut_highest_division_date", "debut_highest_division_club",
              "debut_highest_division_competition",
              "debut_second_tier_date",      "debut_second_tier_club",
              "debut_second_tier_competition",
          ]
          for col in DEBUT_COLS:
              if col not in fields:
                  fields.append(col)

          todo = []
          already = 0
          for idx, row in enumerate(rows, 1):
              if idx < START_FROM:
                  continue
              if row.get("debut_highest_division_date") or row.get("debut_second_tier_date"):
                  already += 1
                  continue
              if not row.get("player_id"):
                  continue
              todo.append((idx, row))

          print(f"Spelers totaal : {len(rows)}")
          print(f"Al verwerkt    : {already}")
          print(f"Nog te doen    : {len(todo)}")
          print(f"Workers        : {WORKERS}")
          print(f"Sleep          : {SLEEP_MIN}-{SLEEP_MAX}s")
          est = len(todo) * ((SLEEP_MIN + SLEEP_MAX) / 2) / WORKERS / 60
          print(f"Geschatte tijd : ~{est:.0f} min", flush=True)

          processed    = 0
          since_save   = 0
          since_commit = 0
          t_start      = time.time()

          with ThreadPoolExecutor(max_workers=WORKERS) as ex:
              BATCH = 200
              for batch_start in range(0, len(todo), BATCH):
                  batch   = todo[batch_start:batch_start + BATCH]
                  futures = {ex.submit(scrape_one, row): (idx, row) for idx, row in batch}

                  for fut in as_completed(futures):
                      idx, _ = futures[fut]
                      row, status = fut.result()

                      name    = (row.get("name") or "")[:30]
                      pid     = (row.get("player_id") or "")
                      highest = row.get("debut_highest_division_date") or "-"
                      second  = row.get("debut_second_tier_date")      or "-"

                      processed    += 1
                      since_save   += 1
                      since_commit += 1

                      elapsed = time.time() - t_start
                      speed   = processed / elapsed * 60  # per minuut
                      remain  = (len(todo) - processed) / (processed / elapsed) / 60 if processed else 0

                      print(
                          f"[{idx:5d}/{len(rows)}] {pid:8s} {name:<30s}"
                          f" {status:<10s} | H:{highest} S:{second}"
                          f" | {speed:.0f}/min ~{remain:.0f}min over",
                          flush=True
                      )

                      if since_save >= SAVE_EVERY:
                          with save_lock:
                              save_rows(PLAYERS_FILE, fields, rows)
                          since_save = 0
                          print(f"  [SAVE] {processed}/{len(todo)} verwerkt", flush=True)

                      if since_commit >= COMMIT_EVERY:
                          with commit_lock:
                              save_rows(PLAYERS_FILE, fields, rows)
                              ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
                              git_commit(f"ScoutAI debuts [{processed}/{len(todo)}] {ts}")
                          since_commit = 0

          # Finale opslag + commit
          save_rows(PLAYERS_FILE, fields, rows)
          ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          git_commit(f"ScoutAI debuts KLAAR [{len(todo)} spelers] {ts}")

          total = time.time() - t_start
          found_h = sum(1 for r in rows if r.get("debut_highest_division_date"))
          found_s = sum(1 for r in rows if r.get("debut_second_tier_date"))
          print(f"\n{'='*60}")
          print(f"✅ Klaar in {total/60:.1f} min")
          print(f"   1e divisie debut gevonden: {found_h:,}")
          print(f"   2e divisie debut gevonden: {found_s:,}")
          PYEOF

      - name: Summary
        run: |
          echo "=== PLAYER DEBUT SCRAPE KLAAR ==="
          [ -f data/csv/players.csv.gz ] && echo "players.csv.gz: $(wc -c < data/csv/players.csv.gz) bytes"
