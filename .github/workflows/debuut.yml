name: Scrape Player Debuts

on:
  workflow_dispatch:
    inputs:
      start_from:
        description: "Start vanaf rijnummer (voor resume)"
        required: false
        default: "1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install poetry aiohttp
          git clone https://github.com/dcaribou/transfermarkt-scraper.git /tmp/scraper
          cd /tmp/scraper
          poetry config virtualenvs.create false
          poetry install --without dev

      - name: Decompress players.csv.gz
        run: |
          python3 -c "
          import gzip, shutil
          from pathlib import Path
          gz  = Path('data/csv/players.csv.gz')
          csv = Path('data/csv/players.csv')
          if gz.exists():
              with gzip.open(gz,'rb') as fi, open(csv,'wb') as fo:
                  shutil.copyfileobj(fi, fo)
              print(f'OK: {csv.stat().st_size//1024} KB')
          "

      - name: Scrape debuts via Scrapy (zelfde sessie als weekly scrape)
        timeout-minutes: 300
        env:
          START_FROM: ${{ github.event.inputs.start_from || '1' }}
        run: |
          python3 << 'PYEOF'
          import asyncio
          import csv
          import gzip
          import json
          import os
          import random
          import re
          import shutil
          import subprocess
          import time
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlparse

          import aiohttp
          from bs4 import BeautifulSoup

          DATA_DIR     = Path("data/csv")
          PLAYERS_FILE = DATA_DIR / "players.csv"
          GZ_FILE      = DATA_DIR / "players.csv.gz"

          START_FROM   = int(os.getenv("START_FROM", "1"))
          SAVE_EVERY   = 100
          COMMIT_EVERY = 500

          # Zelfde User-Agent als de transfermarkt-scraper library
          SCRAPY_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          HEADERS = {
              "User-Agent": SCRAPY_UA,
              "Accept-Language": "nl-BE,nl;q=0.9,en;q=0.8,de;q=0.7",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Referer": "https://www.transfermarkt.be/",
          }

          HIGHEST_TITLES = {
              "hoogste divisie", "highest division", "höchste spielklasse",
              "division la plus haute", "massima divisione", "primera division",
              "primeira divisão", "en yüksek lig",
          }
          SECOND_TITLES = {
              "2de niveau", "tweede niveau", "2e niveau", "second tier",
              "second division", "2nd division", "2. spielklasse", "2. liga",
              "deuxième division", "seconda divisione", "segunda division",
          }

          MONTHS = {
              "jan.":"01","jan":"01","feb.":"02","feb":"02",
              "mrt.":"03","mrt":"03","mar.":"03","mar":"03",
              "apr.":"04","apr":"04","mei":"05","may":"05",
              "jun.":"06","jun":"06","jul.":"07","jul":"07",
              "aug.":"08","aug":"08","sep.":"09","sep":"09",
              "okt.":"10","okt":"10","oct.":"10","oct":"10",
              "nov.":"11","nov":"11","dec.":"12","dec":"12",
          }

          def save_rows(path, fields, rows):
              tmp = path.with_suffix(".tmp")
              with open(tmp, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  for row in rows:
                      w.writerow({k: row.get(k, "") for k in fields})
              tmp.replace(path)

          def git_commit(msg):
              with open(PLAYERS_FILE, "rb") as fi, gzip.open(GZ_FILE, "wb") as fo:
                  shutil.copyfileobj(fi, fo)
              subprocess.run(["git", "config", "user.name",  "ScoutAI Bot"],  check=False)
              subprocess.run(["git", "config", "user.email", "actions@users.noreply.github.com"], check=False)
              subprocess.run(["git", "add", str(GZ_FILE)], check=False)
              r = subprocess.run(["git", "commit", "-m", msg], capture_output=True)
              if r.returncode == 0:
                  subprocess.run(["git", "push"], check=False)
                  print(f"  [COMMIT+PUSH] {msg}", flush=True)

          def clean(el):
              return re.sub(r"\s+", " ", (el.get_text(" ", strip=True) if el else "").strip())

          def norm(s):
              return re.sub(r"\s+", " ", (s or "").strip().lower())

          def parse_date(text):
              s = norm(text).replace("\xa0", " ")
              parts = s.split()
              if len(parts) < 3:
                  return ""
              day   = re.sub(r"\D", "", parts[0]).zfill(2)
              month = MONTHS.get(parts[1], "")
              year  = re.sub(r"\D", "", parts[2])
              return f"{year}-{month}-{day}" if day and month and year else ""

          def build_url(row):
              pid  = str(row.get("player_id", "")).strip()
              url  = str(row.get("url", "")).strip()
              slug = ""
              if url:
                  try:
                      parts = urlparse(url).path.strip("/").split("/")
                      if "spieler" in parts:
                          i    = parts.index("spieler")
                          slug = parts[i - 1] if i > 0 else ""
                          pid  = parts[i + 1] if i + 1 < len(parts) else pid
                  except:
                      pass
              base = f"https://www.transfermarkt.be/{slug}" if slug else "https://www.transfermarkt.be/spieler"
              return f"{base}/debuets/spieler/{pid}"

          def parse_page(html):
              soup = BeautifulSoup(html, "lxml")
              result = {
                  "debut_highest_division_date":"", "debut_highest_division_club":"",
                  "debut_highest_division_competition":"",
                  "debut_second_tier_date":"",      "debut_second_tier_club":"",
                  "debut_second_tier_competition":"",
              }
              table = None
              for div in soup.select("div.box"):
                  h2 = div.select_one("h2.content-box-headline")
                  if h2 and "debut" in norm(clean(h2)):
                      table = div.select_one("table")
                      break
              if not table:
                  table = soup.select_one("div.responsive-table table")
              if not table:
                  return result
              current = ""
              for tr in table.select("tbody tr"):
                  hd = tr.select_one("td.hauptlink[colspan]")
                  if hd:
                      current = norm(clean(hd))
                      continue
                  cells = tr.find_all("td", recursive=False)
                  if len(cells) < 4:
                      continue
                  date_val = parse_date(clean(cells[3]))
                  if not date_val:
                      continue
                  competition = clean(cells[1])
                  club = ""
                  img = cells[2].find("img")
                  if img and img.get("title"):
                      club = img["title"].strip()
                  if not club:
                      a = cells[2].find("a")
                      if a:
                          club = (a.get("title") or clean(a)).strip()
                  if current in HIGHEST_TITLES and not result["debut_highest_division_date"]:
                      result["debut_highest_division_date"]        = date_val
                      result["debut_highest_division_club"]        = club
                      result["debut_highest_division_competition"] = competition
                  elif current in SECOND_TITLES and not result["debut_second_tier_date"]:
                      result["debut_second_tier_date"]             = date_val
                      result["debut_second_tier_club"]             = club
                      result["debut_second_tier_competition"]      = competition
                  if result["debut_highest_division_date"] and result["debut_second_tier_date"]:
                      break
              return result

          # Async fetch — zelfde aanpak als stap 2b/2c in weekly workflow
          async def fetch_all(todo_rows, fields, all_rows):
              # 10 concurrent requests, geen sleep — zelfde als ceapi calls in weekly
              semaphore = asyncio.Semaphore(10)
              processed    = 0
              since_save   = 0
              since_commit = 0

              connector = aiohttp.TCPConnector(limit=20, ttl_dns_cache=300)
              timeout   = aiohttp.ClientTimeout(total=20)

              async def fetch_one(session, idx, row):
                  url = build_url(row)
                  async with semaphore:
                      try:
                          async with session.get(url, headers=HEADERS, timeout=timeout, allow_redirects=True) as resp:
                              if resp.status == 200:
                                  html = await resp.text()
                                  return idx, row, html, "ok"
                              elif resp.status == 404:
                                  return idx, row, None, "not_found"
                              elif resp.status in (403, 429):
                                  await asyncio.sleep(30)
                                  return idx, row, None, f"http{resp.status}"
                              return idx, row, None, f"http{resp.status}"
                      except Exception as e:
                          return idx, row, None, "error"

              async with aiohttp.ClientSession(connector=connector) as session:
                  tasks = [fetch_one(session, idx, row) for idx, row in todo_rows]

                  for coro in asyncio.as_completed(tasks):
                      idx, row, html, status = await coro

                      if html:
                          parsed = parse_page(html)
                          for k, v in parsed.items():
                              row[k] = v

                      name    = (row.get("name") or "")[:30]
                      pid     = (row.get("player_id") or "")
                      highest = row.get("debut_highest_division_date") or "-"
                      second  = row.get("debut_second_tier_date")      or "-"

                      print(
                          f"[{idx:5d}/{len(all_rows)}] {pid:8s} {name:<30s}"
                          f" {status:<10s} | H:{highest} S:{second}",
                          flush=True
                      )

                      processed    += 1
                      since_save   += 1
                      since_commit += 1

                      if since_save >= SAVE_EVERY:
                          save_rows(PLAYERS_FILE, fields, all_rows)
                          since_save = 0
                          print(f"  [SAVE] {processed} verwerkt", flush=True)

                      if since_commit >= COMMIT_EVERY:
                          save_rows(PLAYERS_FILE, fields, all_rows)
                          ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
                          git_commit(f"ScoutAI debuts [{idx}/{len(all_rows)}] {ts}")
                          since_commit = 0

          # ── Laden ─────────────────────────────────────────────────────────
          with open(PLAYERS_FILE, encoding="utf-8") as f:
              reader = csv.DictReader(f)
              fields = list(reader.fieldnames or [])
              rows   = list(reader)

          DEBUT_COLS = [
              "debut_highest_division_date", "debut_highest_division_club",
              "debut_highest_division_competition",
              "debut_second_tier_date",      "debut_second_tier_club",
              "debut_second_tier_competition",
          ]
          for col in DEBUT_COLS:
              if col not in fields:
                  fields.append(col)

          todo = []
          already = 0
          for idx, row in enumerate(rows, 1):
              if idx < START_FROM:
                  continue
              if row.get("debut_highest_division_date") or row.get("debut_second_tier_date"):
                  already += 1
                  continue
              if not row.get("player_id"):
                  continue
              todo.append((idx, row))

          print(f"Spelers totaal : {len(rows)}", flush=True)
          print(f"Al verwerkt    : {already}", flush=True)
          print(f"Nog te doen    : {len(todo)}", flush=True)
          print(f"Concurrency    : 10", flush=True)

          # Verwerk in batches van 2000 zodat we tussentijds kunnen opslaan
          BATCH = 2000
          for i in range(0, len(todo), BATCH):
              batch = todo[i:i+BATCH]
              asyncio.run(fetch_all(batch, fields, rows))
              save_rows(PLAYERS_FILE, fields, rows)
              ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
              git_commit(f"ScoutAI debuts batch {i+len(batch)}/{len(todo)} [{ts}]")
              print(f"  [BATCH] {i+len(batch)}/{len(todo)} klaar", flush=True)

          save_rows(PLAYERS_FILE, fields, rows)
          ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          git_commit(f"ScoutAI debuts KLAAR [{len(todo)} spelers] {ts}")
          print(f"\nKlaar!", flush=True)
          PYEOF

      - name: Summary
        run: |
          echo "=== KLAAR ==="
          [ -f data/csv/players.csv.gz ] && echo "players.csv.gz: $(wc -c < data/csv/players.csv.gz) bytes"
