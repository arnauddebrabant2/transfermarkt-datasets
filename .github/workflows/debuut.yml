name: Scrape Player Debuts

on:
  workflow_dispatch:
    inputs:
      start_from:
        description: 'Start vanaf rijnummer (voor resume)'
        required: false
        default: '1'
      workers:
        description: 'Aantal parallelle workers'
        required: false
        default: '3'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas

      - name: Decompress players.csv.gz
        run: |
          python3 << 'PYEOF'
          import gzip, shutil
          from pathlib import Path

          gz  = Path("data/csv/players.csv.gz")
          csv = Path("data/csv/players.csv")

          if gz.exists():
              with gzip.open(gz, "rb") as fi, open(csv, "wb") as fo:
                  shutil.copyfileobj(fi, fo)
              print(f"Gedecomprimeerd: {gz} → {csv} ({csv.stat().st_size // 1024} KB)")
          elif csv.exists():
              print("players.csv bestaat al")
          else:
              raise FileNotFoundError("Geen players.csv.gz of players.csv gevonden")
          PYEOF

      - name: Scrape debuts from Transfermarkt
        timeout-minutes: 300
        env:
          START_FROM: ${{ github.event.inputs.start_from || '1' }}
          WORKERS: ${{ github.event.inputs.workers || '3' }}
        run: |
          python3 << 'PYEOF'
          import csv, random, re, time, os, gzip, shutil, subprocess
          from pathlib import Path
          from urllib.parse import urlparse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime

          import pandas as pd
          import requests
          from bs4 import BeautifulSoup

          DATA_DIR    = Path("data/csv")
          PLAYERS_FILE = DATA_DIR / "players.csv"
          GZ_FILE     = DATA_DIR / "players.csv.gz"

          START_FROM  = int(os.getenv("START_FROM", "1"))
          WORKERS     = int(os.getenv("WORKERS", "3"))
          SAVE_EVERY  = 50
          COMMIT_EVERY = 250
          SLEEP_MIN   = 1.0
          SLEEP_MAX   = 2.0

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept-Language": "nl-BE,nl;q=0.9,en;q=0.8",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Referer": "https://www.transfermarkt.be/",
          }

          # Sectietitels in alle TM talen voor 1e en 2e divisie
          HIGHEST_TITLES = {
              "hoogste divisie",           # nl
              "highest division",          # en
              "höchste spielklasse",       # de
              "division la plus haute",    # fr
              "massima divisione",         # it
              "primera division",          # es
              "primeira divisão",          # pt
              "en yüksek lig",             # tr
          }
          SECOND_TITLES = {
              "2de niveau", "tweede niveau",   # nl
              "second tier", "second division", "2nd division",  # en
              "2. spielklasse", "2. liga",      # de
              "deuxième division",              # fr
              "seconda divisione",              # it
              "segunda division",               # es
          }

          def make_session():
              s = requests.Session()
              s.headers.update(HEADERS)
              return s

          def save_rows(path, fields, rows):
              tmp = path.with_suffix(".tmp")
              with open(tmp, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  for row in rows:
                      w.writerow({k: row.get(k, "") for k in fields})
              tmp.replace(path)

          def git_checkpoint(msg):
              with gzip.open(GZ_FILE, "wb") as fo:
                  with open(PLAYERS_FILE, "rb") as fi:
                      shutil.copyfileobj(fi, fo)
              for cmd in [
                  ["git", "config", "user.name",  "ScoutAI Bot"],
                  ["git", "config", "user.email", "actions@users.noreply.github.com"],
                  ["git", "add", str(GZ_FILE)],
                  ["git", "commit", "-m", msg],
                  ["git", "push"],
              ]:
                  subprocess.run(cmd, check=False)

          def clean_text(el):
              if not el:
                  return ""
              return re.sub(r"\s+", " ", el.get_text(" ", strip=True)).strip()

          def parse_date(s):
              s = (s or "").strip()
              if not s:
                  return ""
              dt = pd.to_datetime(s, dayfirst=True, errors="coerce")
              if pd.isna(dt):
                  return ""
              return dt.strftime("%Y-%m-%d")

          def build_debut_url(row):
              player_id = str(row.get("player_id", "")).strip()
              url = str(row.get("url", "")).strip()
              slug = ""
              if url:
                  try:
                      parts = urlparse(url).path.strip("/").split("/")
                      if "spieler" in parts:
                          idx = parts.index("spieler")
                          slug = parts[idx - 1] if idx > 0 else ""
                          player_id = parts[idx + 1] if idx + 1 < len(parts) else player_id
                  except:
                      pass
              if slug:
                  return f"https://www.transfermarkt.be/{slug}/debuets/spieler/{player_id}"
              return f"https://www.transfermarkt.be/spieler/debuets/spieler/{player_id}"

          def fetch(url, session, retries=4):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=25, allow_redirects=True)
                      if r.status_code == 200:
                          return r, "ok"
                      if r.status_code == 404:
                          return None, "not_found"
                      if r.status_code in (403, 429):
                          time.sleep(45 * (i + 1))
                          continue
                      time.sleep(5 * (i + 1))
                  except Exception:
                      time.sleep(6 * (i + 1))
              return None, "error"

          def parse_debut_page(html):
              soup = BeautifulSoup(html, "lxml")
              result = {
                  "debut_highest_division_date":        "",
                  "debut_highest_division_club":        "",
                  "debut_highest_division_competition": "",
                  "debut_second_tier_date":             "",
                  "debut_second_tier_club":             "",
                  "debut_second_tier_competition":      "",
              }

              # Zoek de debutentabel in de .box div
              table = None
              for div in soup.select("div.box"):
                  h2 = div.select_one("h2.content-box-headline")
                  if h2 and "debut" in clean_text(h2).lower():
                      table = div.select_one("table")
                      break
              if not table:
                  table = soup.select_one("div.responsive-table table")
              if not table:
                  return result

              current_section = ""

              for tr in table.select("tbody tr"):
                  # Sectie-header rij
                  hd = tr.select_one("td.hauptlink[colspan]")
                  if hd:
                      current_section = clean_text(hd).lower().strip()
                      continue

                  cells = tr.find_all("td")
                  if len(cells) < 4:
                      continue

                  # Kolommen: [comp logo] [comp naam] [club] [datum] [wedstrijd] [trainer] [leeftijd]
                  competition = clean_text(cells[1])
                  date_val    = parse_date(clean_text(cells[3]))
                  if not date_val:
                      continue

                  # Club: img title heeft prioriteit (exacte naam), anders a title
                  club = ""
                  img = cells[2].find("img")
                  if img and img.get("title"):
                      club = img["title"].strip()
                  if not club:
                      a = cells[2].find("a")
                      if a:
                          club = (a.get("title") or clean_text(a)).strip()

                  # Match sectietitel
                  if current_section in HIGHEST_TITLES:
                      if not result["debut_highest_division_date"]:
                          result["debut_highest_division_date"]        = date_val
                          result["debut_highest_division_club"]        = club
                          result["debut_highest_division_competition"] = competition

                  elif current_section in SECOND_TITLES:
                      if not result["debut_second_tier_date"]:
                          result["debut_second_tier_date"]             = date_val
                          result["debut_second_tier_club"]             = club
                          result["debut_second_tier_competition"]      = competition

                  if result["debut_highest_division_date"] and result["debut_second_tier_date"]:
                      break

              return result

          def scrape_one(row):
              session = make_session()
              url = build_debut_url(row)
              r, status = fetch(url, session)
              if not r:
                  return row, status
              parsed = parse_debut_page(r.text)
              for k, v in parsed.items():
                  row[k] = v
              time.sleep(random.uniform(SLEEP_MIN, SLEEP_MAX))
              return row, "ok"

          # ── Laden ─────────────────────────────────────────────────────────
          with open(PLAYERS_FILE, encoding="utf-8") as f:
              reader = csv.DictReader(f)
              fields = list(reader.fieldnames or [])
              rows   = list(reader)

          DEBUT_COLS = [
              "debut_highest_division_date",
              "debut_highest_division_club",
              "debut_highest_division_competition",
              "debut_second_tier_date",
              "debut_second_tier_club",
              "debut_second_tier_competition",
          ]
          for col in DEBUT_COLS:
              if col not in fields:
                  fields.append(col)

          row_map = {str((r.get("player_id") or "").strip()): r for r in rows}

          todo = []
          already = 0
          for idx, row in enumerate(rows, 1):
              if idx < START_FROM:
                  continue
              if row.get("debut_highest_division_date") or row.get("debut_second_tier_date"):
                  already += 1
                  continue
              if not row.get("player_id"):
                  continue
              todo.append((idx, row))

          print(f"Spelers totaal:  {len(rows)}")
          print(f"Al verwerkt:     {already}")
          print(f"Nog te doen:     {len(todo)}")
          print(f"Workers:         {WORKERS}")

          processed = 0
          since_save = 0
          since_commit = 0

          with ThreadPoolExecutor(max_workers=WORKERS) as ex:
              BATCH = 120
              for batch_start in range(0, len(todo), BATCH):
                  batch = todo[batch_start:batch_start + BATCH]
                  futures = {ex.submit(scrape_one, row): (idx, row) for idx, row in batch}

                  for fut in as_completed(futures):
                      idx, orig = futures[fut]
                      updated_row, status = fut.result()
                      name = (updated_row.get("name") or "").strip()[:35]
                      pid  = (updated_row.get("player_id") or "").strip()

                      highest = updated_row.get("debut_highest_division_date") or "-"
                      second  = updated_row.get("debut_second_tier_date") or "-"

                      print(
                          f"[{idx:5d}/{len(rows)}] {pid:8s} {name:<35s}"
                          f" -> {status:<10s} | highest:{highest} | second:{second}"
                      )

                      processed   += 1
                      since_save  += 1
                      since_commit += 1

                      if since_save >= SAVE_EVERY:
                          save_rows(PLAYERS_FILE, fields, rows)
                          since_save = 0
                          print(f"  [SAVE] {processed} verwerkt")

                      if since_commit >= 250:
                          save_rows(PLAYERS_FILE, fields, rows)
                          ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
                          git_checkpoint(f"ScoutAI debuts checkpoint [{ts}]")
                          since_commit = 0
                          print(f"  [COMMIT] {processed} verwerkt")

          save_rows(PLAYERS_FILE, fields, rows)
          ts = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          git_checkpoint(f"ScoutAI debuts volledig [{ts}]")
          print(f"\nKlaar: {processed} bijgewerkt")
          PYEOF

      - name: Summary
        run: |
          echo "=== PLAYER DEBUT SCRAPE KLAAR ==="
          [ -f data/csv/players.csv.gz ] && echo "players.csv.gz: $(wc -c < data/csv/players.csv.gz) bytes"
