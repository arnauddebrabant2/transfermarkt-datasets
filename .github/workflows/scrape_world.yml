name: Scrape World Full - Competities + Clubs + Flags

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Maak output map aan
        run: mkdir -p data/csv

      - name: Stap 1 - Alle landen 1-300 scrapen voor competities + flags + logos
        run: |
          python3 << 'PYEOF'
          import requests, csv, time, re, random
          from pathlib import Path
          from bs4 import BeautifulSoup

          DATA = Path('data/csv')
          BASE = 'https://www.transfermarkt.co.uk'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept-Language': 'en-GB,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Referer': 'https://www.transfermarkt.co.uk/',
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=4):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=20)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 404:
                          return None
                      if r.status_code == 403:
                          wait = 60 * (i + 1)
                          print(f'  403 → wacht {wait}s')
                          time.sleep(wait)
                      else:
                          time.sleep(3)
                  except Exception as e:
                      print(f'  Fout: {e}')
                      time.sleep(5)
              return None

          def fix_name(s):
              if not s: return ''
              s = str(s).strip()
              try: s = s.encode('latin-1').decode('utf-8')
              except: pass
              return s

          competitions = {}  # competition_id -> row dict

          for num in range(1, 301):
              url = f'{BASE}/wettbewerbe/national/wettbewerbe/{num}'
              r = get(url)

              if not r:
                  print(f'[{num:3d}] SKIP')
                  time.sleep(0.3)
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')

              # ── Landnaam uit h1 ───────────────────────────────────────────
              country_name = ''
              h1 = soup.find('h1')
              if h1:
                  country_name = h1.get_text(strip=True)
              if not country_name:
                  continue  # Geen geldig land

              # ── Flag URL: nummer komt uit de URL zelf → altijd correct ────
              flag_url = f'https://tmssl.akamaized.net/images/flagge/verysmall/{num}.png'

              # ── Continent uit breadcrumb of navigatie ─────────────────────
              continent = 'EUR'  # default
              page_text = soup.get_text()
              for c, label in [('AME','America'),('ASI','Asia'),('AFR','Africa'),('OCE','Oceania')]:
                  if label in page_text:
                      continent = c
                      break

              # ── Alle competities op deze pagina ───────────────────────────
              # Naam + tier uit de tabel, logo uit img in dezelfde rij
              name_lookup = {}
              tier_lookup = {}
              logo_lookup = {}
              url_lookup  = {}

              for table in soup.find_all('table', class_='items'):
                  current_tier = ''
                  for row in table.find_all('tr'):
                      # Tier header
                      extrarow = row.find('td', class_='extrarow')
                      if extrarow:
                          current_tier = extrarow.get_text(strip=True)
                          continue

                      # Competitie links
                      for a in row.find_all('a', href=re.compile(r'/startseite/wettbewerb/')):
                          m = re.search(r'/startseite/wettbewerb/([^/?&\s]+)', a['href'])
                          if not m:
                              continue
                          cid = m.group(1)
                          name = fix_name(a.get('title') or a.get_text(strip=True))
                          if not name:
                              continue
                          name_lookup[cid] = name
                          tier_lookup[cid] = current_tier
                          url_lookup[cid]  = BASE + a['href'] if a['href'].startswith('/') else a['href']

                          # Logo: zoek img in dezelfde rij (niet flagge)
                          for img in row.find_all('img'):
                              src = img.get('src', '')
                              if src and 'flagge' not in src and 'tmssl' in src:
                                  if src.startswith('//'):
                                      src = 'https:' + src
                                  logo_lookup[cid] = src
                                  break

              # ── Competition IDs via de keys divs (volledigste lijst) ──────
              found = 0
              for kd in soup.find_all('div', class_='keys'):
                  for span in kd.find_all('span'):
                      cid = span.get_text(strip=True)
                      if not cid or cid in competitions:
                          continue

                      # country_id: letters voor het eerste cijfer in cid
                      country_id = re.sub(r'\d.*$', '', cid)

                      competitions[cid] = {
                          'competition_id': cid,
                          'name':           name_lookup.get(cid, cid)[:80],
                          'country':        country_name,
                          'country_id':     country_id,
                          'country_num_id': str(num),
                          'continent':      continent,
                          'continent_id':   continent,
                          'tier':           tier_lookup.get(cid, ''),
                          'url':            url_lookup.get(cid, f'{BASE}/{cid.lower()}/startseite/wettbewerb/{cid}'),
                          'flag_id':        str(num),
                          'flag_url':       flag_url,
                          'logo_url':       logo_lookup.get(cid, ''),
                      }
                      found += 1

              if found > 0 or name_lookup:
                  print(f'[{num:3d}] {country_name:30s} +{found:3d} comps  (totaal: {len(competitions)})')
              else:
                  print(f'[{num:3d}] {country_name or "---":30s} geen comps')

              time.sleep(1.0 + random.uniform(0, 0.5))

          # ── Nu: voor competities zonder logo → scrape de competitiepagina ─
          no_logo = [cid for cid, row in competitions.items() if not row.get('logo_url')]
          print(f'\nCompetities zonder logo: {len(no_logo)} → scrape competitiepagina')

          for i, cid in enumerate(no_logo, 1):
              row = competitions[cid]
              comp_url = row.get('url', '')
              if not comp_url:
                  continue

              print(f'  [{i:4d}/{len(no_logo)}] {cid:12s}', end=' ', flush=True)
              r = get(comp_url)
              if not r:
                  print('SKIP')
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')

              # Zoek logo op de competition pagina
              logo_url = ''
              for pattern in [r'logo/homepageWappen', r'logo/header', r'wappen/header', r'wappen/normal']:
                  for img in soup.find_all('img'):
                      src = img.get('src', '')
                      if src and 'flagge' not in src and re.search(pattern, src, re.I):
                          logo_url = src if src.startswith('http') else 'https://tmssl.akamaized.net' + src
                          break
                  if logo_url:
                      break

              row['logo_url'] = logo_url
              print(f'logo:{"ok" if logo_url else "-"}')
              time.sleep(0.8 + random.uniform(0, 0.4))

          # ── CSV schrijven ─────────────────────────────────────────────────
          FIELDS = [
              'competition_id', 'name', 'country', 'country_id',
              'country_num_id', 'continent', 'continent_id', 'tier',
              'url', 'flag_id', 'flag_url', 'logo_url',
          ]
          out = DATA / 'competitions.csv'
          with open(out, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=FIELDS, extrasaction='ignore')
              w.writeheader()
              w.writerows(competitions.values())

          ok_flag = sum(1 for r in competitions.values() if r.get('flag_url'))
          ok_logo = sum(1 for r in competitions.values() if r.get('logo_url'))
          print(f'\n✅ {len(competitions)} competities')
          print(f'   Vlaggen: {ok_flag}/{len(competitions)}')
          print(f'   Logos:   {ok_logo}/{len(competitions)}')
          PYEOF

      - name: Stap 2 - Clubs per competitie scrapen
        timeout-minutes: 300
        run: |
          python3 << 'PYEOF'
          import requests, csv, time, re, random
          from pathlib import Path
          from bs4 import BeautifulSoup

          DATA = Path('data/csv')
          BASE = 'https://www.transfermarkt.co.uk'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept-Language': 'en-GB,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml',
              'Referer': 'https://www.transfermarkt.co.uk/',
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=3):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=20)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 403:
                          wait = 60 * (i + 1)
                          print(f'  403 → wacht {wait}s')
                          time.sleep(wait)
                      else:
                          time.sleep(3)
                  except Exception as e:
                      print(f'  Fout: {e}')
                      time.sleep(5)
              return None

          def fix_name(s):
              if not s: return ''
              s = str(s).strip()
              try: s = s.encode('latin-1').decode('utf-8')
              except: pass
              for bad, good in [
                  ('\u00c3\u00bc','\u00fc'),('\u00c3\u00b6','\u00f6'),
                  ('\u00c3\u00a4','\u00e4'),('\u00c3\u00a9','\u00e9'),
                  ('\u00c3\u00a0','\u00e0'),('\u00c3\u00a7','\u00e7'),
                  ('\u00c3\u00b1','n'),('\u00e2\u0080\u0099',"'"),
                  ('\u00e2\u0080\u0093','-'),
              ]:
                  s = s.replace(bad, good)
              return s

          # Laad competitions
          competitions = []
          with open(DATA / 'competitions.csv', encoding='utf-8') as f:
              competitions = list(csv.DictReader(f))
          print(f'Competities: {len(competitions)}')

          # Laad bestaande clubs (voor resume na crash)
          clubs = {}
          club_file = DATA / 'clubs2.csv'
          if club_file.exists():
              with open(club_file, encoding='utf-8') as f:
                  for row in csv.DictReader(f):
                      if row.get('club_id'):
                          clubs[row['club_id']] = row
              print(f'Bestaande clubs: {len(clubs)}')

          CLUB_FIELDS = [
              'club_id', 'name', 'short_name',
              'domestic_competition_id', 'competition_name',
              'country', 'country_id', 'continent', 'continent_id',
              'squad_size', 'average_age', 'total_market_value',
              'coach_name', 'url',
          ]

          total = len(competitions)
          for i, comp in enumerate(competitions, 1):
              comp_id      = comp['competition_id']
              comp_url     = comp.get('url', '')
              comp_name    = comp.get('name', comp_id)
              country      = comp.get('country', '')
              country_id   = comp.get('country_id', '')
              continent    = comp.get('continent', '')
              continent_id = comp.get('continent_id', '')

              if not comp_url:
                  continue

              print(f'[{i:4d}/{total}] {comp_id:12s} {comp_name[:35]:35s}', end=' ', flush=True)

              r = get(comp_url)
              if not r:
                  print('SKIP')
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')
              found = 0

              for table in soup.find_all('table', class_=re.compile('items')):
                  for row in table.find_all('tr'):
                      for a in row.find_all('a', href=re.compile(r'/startseite/verein/\d+')):
                          href = a['href']
                          m = re.search(r'/startseite/verein/(\d+)', href)
                          if not m:
                              continue
                          club_id = m.group(1)

                          full_name  = fix_name(a.get('title', '') or a.get_text(strip=True))
                          short_name = fix_name(a.get_text(strip=True))
                          if short_name == full_name:
                              short_name = ''

                          td = a.find_parent('td')
                          if td:
                              for span in td.find_all('span'):
                                  txt = fix_name(span.get_text(strip=True))
                                  if txt and txt != full_name and 2 < len(txt) < len(full_name):
                                      short_name = txt
                                      break

                          if not full_name or len(full_name) < 2:
                              continue

                          cells = row.find_all('td')
                          squad_size = avg_age = market_val = ''
                          for td in cells:
                              txt = td.get_text(strip=True)
                              if re.match(r'^\d+$', txt) and 5 <= int(txt) <= 60:
                                  squad_size = txt
                              if re.match(r'^\d+[,.]\d$', txt):
                                  try:
                                      v = float(txt.replace(',', '.'))
                                      if 15 < v < 40:
                                          avg_age = txt
                                  except:
                                      pass
                              if re.match(r'^\d+[.,]\d+[mkMK]?$', txt):
                                  market_val = txt

                          clubs[club_id] = {
                              'club_id':                  club_id,
                              'name':                     full_name,
                              'short_name':               short_name,
                              'domestic_competition_id':  comp_id,
                              'competition_name':         comp_name,
                              'country':                  country,
                              'country_id':               country_id,
                              'continent':                continent,
                              'continent_id':             continent_id,
                              'squad_size':               squad_size,
                              'average_age':              avg_age,
                              'total_market_value':       market_val,
                              'coach_name':               '',
                              'url':                      BASE + href if href.startswith('/') else href,
                          }
                          found += 1

              print(f'+{found:3d} clubs  (totaal: {len(clubs)})')

              # Tussentijds opslaan elke 50 competities
              if i % 50 == 0:
                  with open(club_file, 'w', newline='', encoding='utf-8') as f:
                      w = csv.DictWriter(f, fieldnames=CLUB_FIELDS, extrasaction='ignore')
                      w.writeheader()
                      for row in clubs.values():
                          w.writerow({k: row.get(k, '') for k in CLUB_FIELDS})
                  print(f'  [SAVE] {len(clubs)} clubs opgeslagen')

              time.sleep(1.2 + random.uniform(0, 0.8))

          # Finale opslag
          with open(club_file, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=CLUB_FIELDS, extrasaction='ignore')
              w.writeheader()
              for row in clubs.values():
                  w.writerow({k: row.get(k, '') for k in CLUB_FIELDS})

          print(f'\n✅ {len(clubs)} clubs geschreven')
          PYEOF

      - name: Stap 3 - Gzippen en committen
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -f data/csv/competitions.csv ]; then
            echo "Competities: $(wc -l < data/csv/competitions.csv) rijen"
            gzip -f data/csv/competitions.csv
            echo "competitions.csv.gz: $(wc -c < data/csv/competitions.csv.gz) bytes"
          fi

          if [ -f data/csv/clubs2.csv ]; then
            echo "Clubs: $(wc -l < data/csv/clubs2.csv) rijen"
            gzip -f data/csv/clubs2.csv
            echo "clubs2.csv.gz: $(wc -c < data/csv/clubs2.csv.gz) bytes"
          fi

          git add data/csv/competitions.csv.gz data/csv/clubs2.csv.gz
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "ScoutAI world full: ${TIMESTAMP}" || echo "Geen wijzigingen"
          git push

      - name: Samenvatting
        run: |
          echo "=== WORLD SCRAPE KLAAR ==="
          for f in data/csv/competitions.csv.gz data/csv/clubs2.csv.gz; do
            [ -f "$f" ] && echo "$f: $(wc -c < $f) bytes"
          done
