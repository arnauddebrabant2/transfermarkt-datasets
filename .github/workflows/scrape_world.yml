name: Scrape World Full - Alle Divisies en Clubs

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Maak output map aan
        run: mkdir -p data/csv

      - name: Stap 1 - Alle competities per land scrapen
        run: |
          python3 << 'PYEOF'
          import requests, csv, time, re, random
          from pathlib import Path
          from bs4 import BeautifulSoup

          DATA = Path('data/csv')
          BASE = 'https://www.transfermarkt.co.uk'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept-Language': 'en-GB,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Referer': 'https://www.transfermarkt.co.uk/',
          }

          # Transfermarkt numerieke land-IDs + landcodes
          # URL: /wettbewerbe/national/wettbewerbe/{country_code}
          # De HTML bevat een verborgen <div class="keys"> met alle competitie-IDs
          COUNTRIES = [
              ('L','Germany','EUR'),('GB','England','EUR'),('ES','Spain','EUR'),
              ('IT','Italy','EUR'),('FR','France','EUR'),('NL','Netherlands','EUR'),
              ('BE','Belgium','EUR'),('PO','Portugal','EUR'),('TR','Turkey','EUR'),
              ('GR','Greece','EUR'),('A','Austria','EUR'),('RU','Russia','EUR'),
              ('UKR','Ukraine','EUR'),('PL','Poland','EUR'),('RO','Romania','EUR'),
              ('TS','Switzerland','EUR'),('UNG','Hungary','EUR'),('SER','Serbia','EUR'),
              ('SLO','Slovenia','EUR'),('SC','Scotland','EUR'),('DK','Denmark','EUR'),
              ('SE','Sweden','EUR'),('NO','Norway','EUR'),('KR','Croatia','EUR'),
              ('SLN','Slovakia','EUR'),('ALB','Albania','EUR'),('BOS','Bosnia-Herzegovina','EUR'),
              ('MKD','North Macedonia','EUR'),('MNE','Montenegro','EUR'),('FI','Finland','EUR'),
              ('IS','Iceland','EUR'),('NIR','Northern Ireland','EUR'),('IR','Ireland','EUR'),
              ('WAL','Wales','EUR'),('GEO','Georgia','EUR'),('AZE','Azerbaijan','EUR'),
              ('ARM','Armenia','EUR'),('KAS','Kazakhstan','EUR'),('WER','Belarus','EUR'),
              ('MOL','Moldova','EUR'),('LIT','Lithuania','EUR'),('LV','Latvia','EUR'),
              ('EST','Estonia','EUR'),('BUL','Bulgaria','EUR'),('KOS','Kosovo','EUR'),
              ('ISR','Israel','EUR'),('ZYP','Cyprus','EUR'),('LUX','Luxembourg','EUR'),
              ('MLT','Malta','EUR'),('AND','Andorra','EUR'),('FRO','Faroe Islands','EUR'),
              ('LIE','Liechtenstein','EUR'),('SMR','San Marino','EUR'),('GIB','Gibraltar','EUR'),
              ('MLS','USA','AME'),('MEX','Mexico','AME'),('BRA','Brazil','AME'),
              ('ARG','Argentina','AME'),('COL','Colombia','AME'),('CHI','Chile','AME'),
              ('PER','Peru','AME'),('ECU','Ecuador','AME'),('URU','Uruguay','AME'),
              ('PAR','Paraguay','AME'),('BOL','Bolivia','AME'),('VEN','Venezuela','AME'),
              ('CRC','Costa Rica','AME'),('HON','Honduras','AME'),('GUA','Guatemala','AME'),
              ('PAN','Panama','AME'),('JAM','Jamaica','AME'),('TTO','Trinidad and Tobago','AME'),
              ('CAN','Canada','AME'),('DOM','Dominican Republic','AME'),
              ('CUB','Cuba','AME'),('HAI','Haiti','AME'),('SLV','El Salvador','AME'),
              ('NCA','Nicaragua','AME'),('GUY','Guyana','AME'),('SUR','Suriname','AME'),
              ('JAP','Japan','ASI'),('KOR','South Korea','ASI'),('CHN','China','ASI'),
              ('IND','India','ASI'),('SAU','Saudi Arabia','ASI'),('UAE','United Arab Emirates','ASI'),
              ('QAT','Qatar','ASI'),('IRN','Iran','ASI'),('IRQ','Iraq','ASI'),
              ('JOR','Jordan','ASI'),('KUW','Kuwait','ASI'),('BHR','Bahrain','ASI'),
              ('OMA','Oman','ASI'),('THA','Thailand','ASI'),('VIE','Vietnam','ASI'),
              ('MAL','Malaysia','ASI'),('IDN','Indonesia','ASI'),('PHI','Philippines','ASI'),
              ('KGZ','Kyrgyzstan','ASI'),('TJK','Tajikistan','ASI'),('TKM','Turkmenistan','ASI'),
              ('UZB','Uzbekistan','ASI'),('MNG','Mongolia','ASI'),('SIN','Singapore','ASI'),
              ('MYA','Myanmar','ASI'),('KHM','Cambodia','ASI'),('LAO','Laos','ASI'),
              ('BGD','Bangladesh','ASI'),('PAK','Pakistan','ASI'),('SRL','Sri Lanka','ASI'),
              ('NEP','Nepal','ASI'),('MAC','Macao','ASI'),('HKG','Hong Kong','ASI'),
              ('TPE','Chinese Taipei','ASI'),('AFG','Afghanistan','ASI'),
              ('SYR','Syria','ASI'),('LIB','Lebanon','ASI'),('PSE','Palestine','ASI'),
              ('YEM','Yemen','ASI'),('KPR','North Korea','ASI'),
              ('EGY','Egypt','AFR'),('MAR','Morocco','AFR'),('TUN','Tunisia','AFR'),
              ('ALG','Algeria','AFR'),('RSA','South Africa','AFR'),('NGA','Nigeria','AFR'),
              ('GHA','Ghana','AFR'),('CMR','Cameroon','AFR'),('SEN','Senegal','AFR'),
              ('CIV','Ivory Coast','AFR'),('MLI','Mali','AFR'),('ZIM','Zimbabwe','AFR'),
              ('ZAM','Zambia','AFR'),('KEN','Kenya','AFR'),('TAN','Tanzania','AFR'),
              ('UGA','Uganda','AFR'),('ETH','Ethiopia','AFR'),('ANG','Angola','AFR'),
              ('MOZ','Mozambique','AFR'),('RWA','Rwanda','AFR'),('BFA','Burkina Faso','AFR'),
              ('GNE','Guinea','AFR'),('MLW','Malawi','AFR'),('BOT','Botswana','AFR'),
              ('NAM','Namibia','AFR'),('LIB2','Libya','AFR'),('SDN','Sudan','AFR'),
              ('SSD','South Sudan','AFR'),('SOM','Somalia','AFR'),('COD','DR Congo','AFR'),
              ('COG','Congo','AFR'),('GAB','Gabon','AFR'),('MDG','Madagascar','AFR'),
              ('MUS','Mauritius','AFR'),('CPV','Cape Verde','AFR'),('GNB','Guinea-Bissau','AFR'),
              ('SLE','Sierra Leone','AFR'),('LBR','Liberia','AFR'),('NIG','Niger','AFR'),
              ('BEN','Benin','AFR'),('TGO','Togo','AFR'),('GNQ','Equatorial Guinea','AFR'),
              ('CAF','Central African Rep.','AFR'),('TCD','Chad','AFR'),('LSO','Lesotho','AFR'),
              ('SWZ','Eswatini','AFR'),('DJI','Djibouti','AFR'),('ERI','Eritrea','AFR'),
              ('COM','Comoros','AFR'),('STP','Sao Tome and Principe','AFR'),
              ('AUS','Australia','OCE'),('NZL','New Zealand','OCE'),
              ('PNG','Papua New Guinea','OCE'),('FIJ','Fiji','OCE'),
              ('SOL','Solomon Islands','OCE'),('VAN','Vanuatu','OCE'),
          ]

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=3):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=20)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 403:
                          wait = 60 * (i + 1)
                          print(f'  403 - wacht {wait}s...')
                          time.sleep(wait)
                      else:
                          print(f' HTTP{r.status_code}', end='')
                          time.sleep(3)
                  except Exception as e:
                      print(f'  Fout: {e}')
                      time.sleep(5)
              return None

          def fix_name(s):
              if not s: return ''
              s = str(s).strip()
              try: s = s.encode('latin-1').decode('utf-8')
              except: pass
              for bad, good in [
                  ('\u00c3\u00bc','\u00fc'),('\u00c3\u00b6','\u00f6'),
                  ('\u00c3\u00a4','\u00e4'),('\u00c3\u00a9','\u00e9'),
                  ('\u00c3\u00a0','\u00e0'),('\u00c3\u00a7','\u00e7'),
                  ('\u00c3\u00b1','n'),('\u00e2\u0080\u0099',"'"),
                  ('\u00e2\u0080\u0093','-'),
              ]:
                  s = s.replace(bad, good)
              for suffix in [r'\s+Fussball$',r'\s+Football\s+Club$',
                              r'\s+Football\s+Club\b',r'\s+e\.V\.$',r'\s+a\.s\.$']:
                  s = re.sub(suffix, '', s, flags=re.IGNORECASE).strip()
              return s

          competitions = {}
          total = len(COUNTRIES)

          for idx, (country_code, country_name, continent_id) in enumerate(COUNTRIES, 1):
              url = f'{BASE}/wettbewerbe/national/wettbewerbe/{country_code}'
              print(f'[{idx:3d}/{total}] {country_name} ({country_code})...', end=' ', flush=True)

              r = get(url)
              if not r:
                  print('SKIP')
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')
              found = 0

              # METHODE 1: Lees de verborgen div class=keys - bevat ALLE comp IDs
              # Dit is de betrouwbaarste methode gebaseerd op de echte HTML structuur
              key_divs = soup.find_all('div', class_='keys')
              all_comp_ids = []
              for kd in key_divs:
                  for span in kd.find_all('span'):
                      comp_id = span.get_text(strip=True)
                      if comp_id:
                          all_comp_ids.append(comp_id)

              # Bouw een naam-lookup uit de tabel links
              name_lookup = {}
              tier_lookup = {}
              for table in soup.find_all('table', class_='items'):
                  # Zoek tier headers (extrarow)
                  current_tier = ''
                  for row in table.find_all('tr'):
                      # Check for tier header row
                      extrarow = row.find('td', class_='extrarow')
                      if extrarow:
                          current_tier = extrarow.get_text(strip=True)
                          continue
                      # Competition link
                      for a in row.find_all('a', href=re.compile(r'/startseite/wettbewerb/')):
                          m = re.search(r'/startseite/wettbewerb/([^/?]+)', a['href'])
                          if m:
                              cid = m.group(1)
                              name = fix_name(a.get('title','') or a.get_text(strip=True))
                              if name:
                                  name_lookup[cid] = name
                                  tier_lookup[cid] = current_tier

              # Combineer: voor elke ID uit keys, zoek de naam op
              for comp_id in all_comp_ids:
                  if comp_id not in competitions:
                      name = name_lookup.get(comp_id, comp_id)
                      tier = tier_lookup.get(comp_id, '')
                      comp_url = f'{BASE}/{comp_id.lower()}/startseite/wettbewerb/{comp_id}'
                      # Zoek correcte URL in de tabel links
                      link = soup.find('a', href=re.compile(f'/startseite/wettbewerb/{comp_id}'))
                      if link:
                          href = link['href']
                          comp_url = f'{BASE}{href}' if href.startswith('/') else href
                      competitions[comp_id] = {
                          'competition_id': comp_id,
                          'name':           name[:80],
                          'country':        country_name,
                          'country_id':     country_code,
                          'continent':      continent_id,
                          'continent_id':   continent_id,
                          'tier':           tier,
                          'url':            comp_url,
                      }
                      found += 1

              print(f'+{found} (totaal {len(competitions)})')
              time.sleep(1.0 + random.uniform(0, 0.5))

          # Schrijf competitions.csv
          FIELDS = ['competition_id','name','country','country_id',
                    'continent','continent_id','tier','url']
          out = DATA / 'competitions_new.csv'
          with open(out, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=FIELDS, extrasaction='ignore')
              w.writeheader()
              w.writerows(competitions.values())
          print(f'\ncompetitions_new.csv: {len(competitions)} competities geschreven')
          PYEOF

      - name: Stap 2 - Clubs per competitie scrapen
        timeout-minutes: 300
        run: |
          python3 << 'PYEOF'
          import requests, csv, time, re, random
          from pathlib import Path
          from bs4 import BeautifulSoup

          DATA = Path('data/csv')
          BASE = 'https://www.transfermarkt.co.uk'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept-Language': 'en-GB,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml',
              'Referer': 'https://www.transfermarkt.co.uk/',
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=3):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=20)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 403:
                          wait = 60 * (i + 1)
                          print(f'  403 - wacht {wait}s...')
                          time.sleep(wait)
                      else:
                          time.sleep(3)
                  except Exception as e:
                      print(f'  Fout: {e}')
                      time.sleep(5)
              return None

          def fix_name(s):
              if not s: return ''
              s = str(s).strip()
              try: s = s.encode('latin-1').decode('utf-8')
              except: pass
              for bad, good in [
                  ('\u00c3\u00bc','\u00fc'),('\u00c3\u00b6','\u00f6'),
                  ('\u00c3\u00a4','\u00e4'),('\u00c3\u00a9','\u00e9'),
                  ('\u00c3\u00a0','\u00e0'),('\u00c3\u00a7','\u00e7'),
                  ('\u00c3\u00b1','n'),('\u00e2\u0080\u0099',"'"),
                  ('\u00e2\u0080\u0093','-'),
              ]:
                  s = s.replace(bad, good)
              for suffix in [r'\s+Fussball$',r'\s+Football\s+Club$',
                              r'\s+Football\s+Club\b',r'\s+e\.V\.$',r'\s+a\.s\.$']:
                  s = re.sub(suffix, '', s, flags=re.IGNORECASE).strip()
              return s

          # Laad competities
          competitions = []
          with open(DATA / 'competitions_new.csv', encoding='utf-8') as f:
              competitions = list(csv.DictReader(f))
          print(f'Competities: {len(competitions)}')

          # Laad bestaande clubs2
          clubs = {}
          club_file = DATA / 'clubs2.csv'
          if club_file.exists():
              with open(club_file, encoding='utf-8') as f:
                  for row in csv.DictReader(f):
                      if row.get('club_id'): clubs[row['club_id']] = row
              print(f'Bestaande clubs2: {len(clubs)}')

          CLUB_FIELDS = [
              'club_id','name','short_name',
              'domestic_competition_id','competition_name',
              'country','country_id','continent','continent_id',
              'squad_size','average_age','total_market_value','coach_name','url',
          ]

          total = len(competitions)
          for i, comp in enumerate(competitions, 1):
              comp_id      = comp['competition_id']
              comp_url     = comp.get('url','')
              comp_name    = comp.get('name', comp_id)
              country      = comp.get('country','')
              country_id   = comp.get('country_id','')
              continent    = comp.get('continent','')
              continent_id = comp.get('continent_id','')

              if not comp_url: continue
              print(f'[{i:4d}/{total}] {comp_id:12s} {comp_name[:38]:38s}', end=' ', flush=True)

              r = get(comp_url)
              if not r:
                  print('SKIP')
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')
              found = 0

              for table in soup.find_all('table', class_=re.compile('items')):
                  for row in table.find_all('tr'):
                      for a in row.find_all('a', href=re.compile(r'/startseite/verein/\d+')):
                          href = a['href']
                          m = re.search(r'/startseite/verein/(\d+)', href)
                          if not m: continue
                          club_id = m.group(1)

                          full_name  = fix_name(a.get('title','') or a.get_text(strip=True))
                          short_name = fix_name(a.get_text(strip=True))
                          if short_name == full_name: short_name = ''

                          td = a.find_parent('td')
                          if td:
                              for span in td.find_all('span'):
                                  txt = fix_name(span.get_text(strip=True))
                                  if txt and txt != full_name and 2 < len(txt) < len(full_name):
                                      short_name = txt; break

                          if not full_name or len(full_name) < 2: continue

                          cells = row.find_all('td')
                          squad_size = avg_age = market_val = ''
                          for td in cells:
                              txt = td.get_text(strip=True)
                              if re.match(r'^\d+$', txt) and 5 <= int(txt) <= 60:
                                  squad_size = txt
                              if re.match(r'^\d+[,.]\d$', txt):
                                  try:
                                      v = float(txt.replace(',','.'))
                                      if 15 < v < 40: avg_age = txt
                                  except: pass
                              if re.match(r'^\d+[.,]\d+[mkMK]?$', txt):
                                  market_val = txt

                          clubs[club_id] = {
                              'club_id': club_id, 'name': full_name,
                              'short_name': short_name,
                              'domestic_competition_id': comp_id,
                              'competition_name': comp_name,
                              'country': country, 'country_id': country_id,
                              'continent': continent, 'continent_id': continent_id,
                              'squad_size': squad_size, 'average_age': avg_age,
                              'total_market_value': market_val, 'coach_name': '',
                              'url': f'{BASE}{href}' if href.startswith('/') else href,
                          }
                          found += 1

              print(f'+{found} (totaal {len(clubs)})')

              if i % 50 == 0:
                  with open(club_file, 'w', newline='', encoding='utf-8') as f:
                      w = csv.DictWriter(f, fieldnames=CLUB_FIELDS, extrasaction='ignore')
                      w.writeheader()
                      for row in clubs.values():
                          w.writerow({k: row.get(k,'') for k in CLUB_FIELDS})
                  print(f'  [SAVE] {len(clubs)} clubs opgeslagen')

              time.sleep(1.2 + random.uniform(0, 0.8))

          with open(club_file, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=CLUB_FIELDS, extrasaction='ignore')
              w.writeheader()
              for row in clubs.values():
                  w.writerow({k: row.get(k,'') for k in CLUB_FIELDS})
          print(f'\nclubs2.csv: {len(clubs)} clubs geschreven')
          PYEOF

      - name: Stap 3 - Gzippen en committen
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/csv/competitions_new.csv ]; then
            gzip -c data/csv/competitions_new.csv > data/csv/competitions.csv.gz
            rm data/csv/competitions_new.csv
            echo "competitions.csv.gz: $(wc -c < data/csv/competitions.csv.gz) bytes"
          fi
          if [ -f data/csv/clubs2.csv ]; then
            gzip -f data/csv/clubs2.csv
            echo "clubs2.csv.gz: $(wc -c < data/csv/clubs2.csv.gz) bytes"
          fi
          git add data/csv/competitions.csv.gz data/csv/clubs2.csv.gz
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "ScoutAI world full: ${TIMESTAMP}" || echo "Geen wijzigingen"
          git push

      - name: Samenvatting
        run: |
          echo "=== WORLD SCRAPE KLAAR ==="
          for f in data/csv/competitions.csv.gz data/csv/clubs2.csv.gz; do
            [ -f "$f" ] && echo "$f: $(wc -c < $f) bytes"
          done
