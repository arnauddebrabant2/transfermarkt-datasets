              (12,'Australia','AUS','OCE'),
              (120,'New Zealand','NZL','OCE'),
              (48,'Fiji','FIJ','OCE'),
          ]

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=3):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=20)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 403:
                          wait = 60 * (i + 1)
                          print(f'  403 - wacht {wait}s...')
                          time.sleep(wait)
                      else:
                          print(f' HTTP{r.status_code}', end='')
                          time.sleep(3)
                  except Exception as e:
                      print(f'  Fout: {e}')
                      time.sleep(5)
              return None

          def fix_name(s):
              if not s: return ''
              s = str(s).strip()
              try: s = s.encode('latin-1').decode('utf-8')
              except: pass
              for bad, good in [
                  ('\u00c3\u00bc','\u00fc'),('\u00c3\u00b6','\u00f6'),
                  ('\u00c3\u00a4','\u00e4'),('\u00c3\u00a9','\u00e9'),
                  ('\u00c3\u00a0','\u00e0'),('\u00c3\u00a7','\u00e7'),
                  ('\u00c3\u00b1','n'),('\u00e2\u0080\u0099',"'"),
                  ('\u00e2\u0080\u0093','-'),
              ]:
                  s = s.replace(bad, good)
              for suffix in [r'\s+Fussball$',r'\s+Football\s+Club$',
                              r'\s+Football\s+Club\b',r'\s+e\.V\.$',r'\s+a\.s\.$']:
                  s = re.sub(suffix, '', s, flags=re.IGNORECASE).strip()
              return s

          competitions = {}
          seen_countries = set()
          total = len(COUNTRIES)

          for idx, (country_num, country_name, country_code, continent_id) in enumerate(COUNTRIES, 1):
              # Sla dubbele numerieke IDs over
              key = (country_num, country_code)
              if key in seen_countries:
                  continue
              seen_countries.add(key)

              url = f'{BASE}/wettbewerbe/national/wettbewerbe/{country_num}'
              print(f'[{idx:3d}/{total}] {country_name} (ID:{country_num})...', end=' ', flush=True)

              r = get(url)
              if not r:
                  print('SKIP')
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')

              # Controleer of we het juiste land hebben via de form action
              form = soup.find('form', action=re.compile(r'/wettbewerbe/national/wettbewerbe/'))
              if form:
                  action = form.get('action','')
                  m = re.search(r'/wettbewerbe/national/wettbewerbe/(\d+)', action)
                  if m and m.group(1) != str(country_num):
                      print(f'WRONG PAGE (got {m.group(1)}, expected {country_num})')
                      continue

              # Lees alle comp IDs uit de verborgen keys divs
              found = 0
              name_lookup = {}
              tier_lookup = {}

              for table in soup.find_all('table', class_='items'):
                  current_tier = ''
                  for row in table.find_all('tr'):
                      extrarow = row.find('td', class_='extrarow')
                      if extrarow:
                          current_tier = extrarow.get_text(strip=True)
                          continue
                      for a in row.find_all('a', href=re.compile(r'/startseite/wettbewerb/')):
                          m2 = re.search(r'/startseite/wettbewerb/([^/?]+)', a['href'])
                          if m2:
                              cid = m2.group(1)
                              name = fix_name(a.get('title','') or a.get_text(strip=True))
                              if name:
                                  name_lookup[cid] = name
                                  tier_lookup[cid] = current_tier

              for kd in soup.find_all('div', class_='keys'):
                  for span in kd.find_all('span'):
                      comp_id = span.get_text(strip=True)
                      if not comp_id: continue
                      if comp_id not in competitions:
                          name = name_lookup.get(comp_id, comp_id)
                          tier = tier_lookup.get(comp_id, '')
                          link = soup.find('a', href=re.compile(f'/startseite/wettbewerb/{re.escape(comp_id)}'))
                          comp_url = f'{BASE}{link["href"]}' if link else f'{BASE}/{comp_id.lower()}/startseite/wettbewerb/{comp_id}'
                          competitions[comp_id] = {
                              'competition_id': comp_id,
                              'name':           name[:80],
                              'country':        country_name,
                              'country_id':     country_code,
                              'country_num_id': str(country_num),
                              'continent':      continent_id,
                              'continent_id':   continent_id,
                              'tier':           tier,
                              'url':            comp_url,
                          }
                          found += 1

              print(f'+{found} (totaal {len(competitions)})')
              time.sleep(1.0 + random.uniform(0, 0.5))

          FIELDS = ['competition_id','name','country','country_id','country_num_id',
                    'continent','continent_id','tier','url']
          out = DATA / 'competitions_new.csv'
          with open(out, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=FIELDS, extrasaction='ignore')
              w.writeheader()
              w.writerows(competitions.values())
          print(f'\ncompetitions_new.csv: {len(competitions)} competities')
          PYEOF

