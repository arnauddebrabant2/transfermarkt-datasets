name: Scrape World Full - Alle Divisies en Clubs

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Maak output map aan
        run: mkdir -p data/csv

      - name: Stap 1 - Alle competities per land scrapen
        run: |
          python3 << 'PYEOF'
          import requests, csv, time, re, random
          from pathlib import Path
          from bs4 import BeautifulSoup

          DATA = Path('data/csv')
          BASE = 'https://www.transfermarkt.co.uk'
          HEADERS = {
