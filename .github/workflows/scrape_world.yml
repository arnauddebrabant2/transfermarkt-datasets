              ('SA1K', 'South Africa',       'RSA', 'AFR', '/premier-soccer-league/startseite/wettbewerb/SA1K',           'First Tier'),
              ('NGA1', 'Nigeria',            'NGA', 'AFR', '/nigeria-professional-football-league/startseite/wettbewerb/NGA1', 'First Tier'),
              ('GHA1', 'Ghana',              'GHA', 'AFR', '/ghana-premier-league/startseite/wettbewerb/GHA1',            'First Tier'),
              ('CMR1', 'Cameroon',           'CMR', 'AFR', '/elite-one/startseite/wettbewerb/CMR1',                       'First Tier'),
              ('SEN1', 'Senegal',            'SEN', 'AFR', '/ligue-1/startseite/wettbewerb/SEN1',                         'First Tier'),
              ('CIV1', 'Ivory Coast',        'CIV', 'AFR', '/ligue-1/startseite/wettbewerb/CIV1',                         'First Tier'),
              ('UGL1', 'Uganda',             'UGA', 'AFR', '/uganda-premier-league/startseite/wettbewerb/UGL1',           'First Tier'),
              ('KAS2', 'Kenya',              'KEN', 'AFR', '/kenyan-premier-league/startseite/wettbewerb/KPL1',            'First Tier'),
          ]

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=4):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=25)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 403:
                          wait = 60 * (i + 1)
                          print(f'  403 → wacht {wait}s')
                          time.sleep(wait)
                      else:
                          print(f'  HTTP{r.status_code}')
                          time.sleep(5)
                  except Exception as e:
                      print(f'  Fout: {e}')
                      time.sleep(5)
              return None

          def scrape_comp(comp_id, href):
              """
              Scrape naam, flag_url en logo_url van de Transfermarkt pagina.
              country_num_id wordt AUTOMATISCH geëxtraheerd uit de flag img src URL.
              """
              url = BASE + href
              r = get(url)
              if not r:
                  return None, None, None, None

              soup = BeautifulSoup(r.text, 'html.parser')

              # ── Naam ─────────────────────────────────────────────────────
              name = ''
              h1 = soup.find('h1')
              if h1:
                  for span in h1.find_all('span'):
                      span.decompose()
                  name = h1.get_text(strip=True)

              # ── Flag URL + country_num_id (uit de img src) ────────────────
              # Patroon: tmssl.akamaized.net/images/flagge/verysmall/189.png
              flag_url = ''
              country_num = ''
              for img in soup.find_all('img'):
                  src = img.get('src', '') or img.get('data-src', '')
                  if not src:
                      continue
                  m = re.search(r'flagge/(?:verysmall|small|normal|big)/(\d+)\.png', src)
                  if m:
                      country_num = m.group(1)
                      flag_url = f'https://tmssl.akamaized.net/images/flagge/verysmall/{country_num}.png'
                      break

              # ── Logo URL ──────────────────────────────────────────────────
              logo_url = ''
              logo_patterns = [
                  r'logo/homepageWappen150x150',
                  r'logo/header',
                  r'wappen/header',
                  r'homepageWappen',
              ]
              all_srcs = []
              for img in soup.find_all('img'):
                  src = img.get('src', '') or img.get('data-src', '')
                  if src and 'flagge' not in src and src != '#' and 'tmssl' in src:
                      all_srcs.append(src)

              for pattern in logo_patterns:
                  for src in all_srcs:
                      if re.search(pattern, src, re.I):
                          logo_url = src
                          if logo_url.startswith('//'):
                              logo_url = 'https:' + logo_url
                          break
                  if logo_url:
                      break

              return name, flag_url, logo_url, country_num

          # ── Verwerk alle competities ──────────────────────────────────────
          FIELDS = [
              'competition_id', 'name', 'country', 'country_id',
              'country_num_id', 'continent', 'continent_id', 'tier',
              'url', 'flag_id', 'flag_url', 'logo_url',
          ]

          results = []
          total = len(COMPETITIONS)

          for i, (comp_id, country, country_code, continent, href, tier) in enumerate(COMPETITIONS, 1):
              print(f'[{i:3d}/{total}] {comp_id:8s} {country:28s}', end=' ', flush=True)

              name, flag_url, logo_url, country_num = scrape_comp(comp_id, href)

              row = {
                  'competition_id': comp_id,
                  'name':           name or comp_id,
                  'country':        country,
                  'country_id':     country_code,
                  'country_num_id': country_num or '',
                  'continent':      continent,
                  'continent_id':   continent,
                  'tier':           tier,
                  'url':            BASE + href,
                  'flag_id':        country_num or '',
                  'flag_url':       flag_url or '',
                  'logo_url':       logo_url or '',
              }
              results.append(row)

              flag_ok = '✓' if flag_url  else '✗'
              logo_ok = '✓' if logo_url  else '✗'
              num_str = f'num={country_num}' if country_num else 'num=??'
              print(f'flag:{flag_ok} logo:{logo_ok} ({num_str})  {(name or "")[:30]}')

              time.sleep(1.5 + random.uniform(0, 1.0))

          # ── Statistieken ─────────────────────────────────────────────────
          ok_flag = sum(1 for r in results if r['flag_url'])
          ok_logo = sum(1 for r in results if r['logo_url'])
          print(f'\n{"="*60}')
          print(f'✅ {len(results)} competities verwerkt')
          print(f'   Vlaggen:  {ok_flag}/{len(results)}')
          print(f'   Logos:    {ok_logo}/{len(results)}')

          failed = [r for r in results if not r['flag_url'] or not r['logo_url']]
          if failed:
              print('\n⚠️  Ontbrekende flag/logo:')
              for r in failed:
                  print(f'   {r["competition_id"]:10s}  flag={bool(r["flag_url"])}  logo={bool(r["logo_url"])}  url={r["url"]}')

          # ── CSV schrijven ─────────────────────────────────────────────────
          out_csv = DATA / 'competitions.csv'
          with open(out_csv, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=FIELDS)
              w.writeheader()
              w.writerows(results)
          print(f'\nGeschreven: {out_csv}')
          PYEOF

      - name: Preview CSV
        run: |
          echo "=== Eerste 5 rijen ==="
          head -6 data/csv/competitions.csv

      - name: Gzip en commit
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/csv/competitions.csv ]; then
            gzip -f data/csv/competitions.csv
            echo "competitions.csv.gz: $(wc -c < data/csv/competitions.csv.gz) bytes"
            git add data/csv/competitions.csv.gz
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "competitions.csv.gz correcte flag+logo: ${TIMESTAMP}" || echo "Geen wijzigingen"
            git push
          else
            echo "❌ competitions.csv niet gevonden"
            exit 1
          fi
