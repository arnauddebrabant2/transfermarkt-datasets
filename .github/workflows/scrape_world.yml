name: Scrape World Full - Alle Divisies en Clubs

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Maak output map aan
        run: mkdir -p data/csv

      - name: Stap 1 - Alle competities per land scrapen
        run: |
          python3 << 'PYEOF'
          import requests, csv, time, re, random
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          DATA = Path('data/csv')
          BASE = 'https://www.transfermarkt.com'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36',
              'Accept-Language': 'en-GB,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Referer': BASE + '/',
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=4, sleep_base=3):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=25, allow_redirects=True)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 403:
                          wait = 30 * (i + 1)
                          print(f'  403 - wacht {wait}s...')
                          time.sleep(wait)
                      else:
                          time.sleep(sleep_base * (i + 1))
                  except Exception as e:
                      print(f'  Fout bij {url}: {e}')
                      time.sleep(sleep_base * (i + 1))
              return None

          def fix_name(s):
              if not s:
                  return ''
              s = str(s).strip()
              try:
                  s = s.encode('latin-1').decode('utf-8')
              except:
                  pass
              bad_pairs = [
                  ('Ã¼','ü'),('Ã¶','ö'),('Ã¤','ä'),('Ã©','é'),('Ã¨','è'),
                  ('Ã¡','á'),('Ã ','à'),('Ã§','ç'),('Ã±','ñ'),
                  ('â€™', "'"),('â€“', '-'),('â€”', '-'),
              ]
              for bad, good in bad_pairs:
                  s = s.replace(bad, good)
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          def infer_continent_from_comp_id(comp_id):
              cid = str(comp_id).upper()
              if cid.startswith(('GB','L','ES','IT','FR','NL','BE','PO','TR','GR','A','RU','UKR','PL','RO','TS','UNG','SER','SLO','SLN','SC','DK','SE','NO','KR','ALB','BOS','MKD','MNE','FI','IS','NIR','IR','WAL','GEO','AZE','ARM','KAS','WER','MOL','LIT','LV','EST','BUL','KOS','ISR','ZYP','LUX','MLT','AND','FRO','LIE','SMR','GIB')):
                  return 'EUR'
              if cid.startswith(('MLS','MEX','BRA','ARG','COL','CHI','PER','ECU','URU','PAR','BOL','VEN','CRC','HON','GUA','PAN','JAM','TTO','CAN','DOM','CUB','HAI','SLV','NCA','GUY','SUR')):
                  return 'AME'
              if cid.startswith(('JAP','KOR','CHN','IND','SAU','UAE','QAT','IRN','IRQ','JOR','KUW','BHR','OMA','THA','VIE','MAL','IDN','PHI','KGZ','TJK','TKM','UZB','MNG','SIN','MYA','KHM','LAO','BGD','PAK','SRL','NEP','AFG','SYR','LIB','PSE','YEM')):
                  return 'ASI'
              if cid.startswith(('EGY','MAR','TUN','ALG','RSA','NGA','GHA','CMR','SEN','CIV','MLI','ZIM','ZAM','KEN','TAN','UGA','ETH','ANG','MOZ','RWA','BFA','GNE','MLW','BOT','NAM','LIB2','SDN','COG','COD','GAB','MDG','SLE','LBR','NIG','BEN','TGO')):
                  return 'AFR'
              if cid.startswith(('AUS','NZL','PNG','FIJ')):
                  return 'OCE'
              return ''

          def parse_country_name(soup, response_url, fallback_num):
              html = str(soup)
              m = re.search(r'https://www\.transfermarkt\.(?:com|co\.uk)/([^/]+)/national/wettbewerbe/' + re.escape(str(fallback_num)), html)
              if m:
                  slug = m.group(1)
                  slug = slug.replace('-', ' ')
                  return ' '.join(w.capitalize() for w in slug.split())

              m2 = re.search(r'https://www\.transfermarkt\.(?:com|co\.uk)/([^/]+)/national/wettbewerbe/' + re.escape(str(fallback_num)), response_url)
              if m2:
                  slug = m2.group(1)
                  slug = slug.replace('-', ' ')
                  return ' '.join(w.capitalize() for w in slug.split())

              title = soup.get_text(" ", strip=True)
              if 'National leagues and domestic cups' in title:
                  h1 = soup.find(['h1','h2'])
                  if h1:
                      txt = fix_name(h1.get_text(" ", strip=True))
                      if txt and 'National leagues' not in txt:
                          return txt

              return f'Country {fallback_num}'

          def is_valid_country_page(soup):
              txt = soup.get_text(" ", strip=True)
              return 'National leagues and domestic cups' in txt or 'Domestic leagues & cups' in txt

          competitions = {}
          valid_countries = 0

          for country_num in range(1, 221):
              url = f'{BASE}/wettbewerbe/national/wettbewerbe/{country_num}'
              print(f'[{country_num:3d}/220] scan country id {country_num}...', end=' ', flush=True)

              r = get(url, retries=2, sleep_base=2)
              if not r:
                  print('SKIP')
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')

              if not is_valid_country_page(soup):
                  print('NO')
                  continue

              valid_countries += 1
              found = 0
              current_tier = ''
              country_name = parse_country_name(soup, r.url, country_num)
              country_num_id = str(country_num)

              for table in soup.find_all('table', class_=re.compile(r'items')):
                  for row in table.find_all('tr'):
                      extrarow = row.find('td', class_='extrarow')
                      if extrarow:
                          current_tier = fix_name(extrarow.get_text(" ", strip=True))
                          continue

                      comp_link = row.find('a', href=re.compile(r'/startseite/wettbewerb/'))
                      if not comp_link:
                          continue

                      mcomp = re.search(r'/startseite/wettbewerb/([^/?#]+)', comp_link.get('href', ''))
                      if not mcomp:
                          continue

                      comp_id = mcomp.group(1)
                      comp_name = fix_name(comp_link.get('title') or comp_link.get_text(" ", strip=True))
                      comp_url = urljoin(BASE, comp_link['href'])

                      if not comp_name:
                          comp_name = comp_id

                      if comp_id not in competitions:
                          competitions[comp_id] = {
                              'competition_id': comp_id,
                              'name': comp_name[:120],
                              'country': country_name,
                              'country_id': '',
                              'country_num_id': country_num_id,
                              'continent': infer_continent_from_comp_id(comp_id),
                              'continent_id': infer_continent_from_comp_id(comp_id),
                              'tier': current_tier,
                              'url': comp_url,
                          }
                          found += 1

              print(f'+{found} ({country_name})')
              time.sleep(0.8 + random.uniform(0, 0.4))

          print(f'\nGeldige landen: {valid_countries}')
          print(f'Totaal competities: {len(competitions)}')

          FIELDS = [
              'competition_id','name','country','country_id','country_num_id',
              'continent','continent_id','tier','url'
          ]
          out = DATA / 'competitions_new.csv'
          with open(out, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=FIELDS, extrasaction='ignore')
              w.writeheader()
              w.writerows(competitions.values())

          print(f'competitions_new.csv: {len(competitions)} competities')
          PYEOF

      - name: Stap 2 - Clubs per competitie scrapen
        timeout-minutes: 300
        run: |
          python3 << 'PYEOF'
          import requests, csv, time, re, random
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          DATA = Path('data/csv')
          BASE = 'https://www.transfermarkt.com'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36',
              'Accept-Language': 'en-GB,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml',
              'Referer': BASE + '/',
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, retries=4):
              for i in range(retries):
                  try:
                      r = session.get(url, timeout=25)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 403:
                          wait = 30 * (i + 1)
                          print(f'  403 - wacht {wait}s...')
                          time.sleep(wait)
                      else:
                          time.sleep(3 * (i + 1))
                  except Exception as e:
                      print(f'  Fout: {e}')
                      time.sleep(3 * (i + 1))
              return None

          def fix_name(s):
              if not s:
                  return ''
              s = str(s).strip()
              try:
                  s = s.encode('latin-1').decode('utf-8')
              except:
                  pass
              replacements = [
                  ('Ã¼','ü'),('Ã¶','ö'),('Ã¤','ä'),('Ã©','é'),('Ã¨','è'),
                  ('Ã¡','á'),('Ã ','à'),('Ã§','ç'),('Ã±','ñ'),
                  ('â€™', "'"),('â€“', '-'),('â€”', '-'),
              ]
              for bad, good in replacements:
                  s = s.replace(bad, good)
              return re.sub(r'\s+', ' ', s).strip()

          with open(DATA / 'competitions_new.csv', encoding='utf-8') as f:
              competitions = list(csv.DictReader(f))
          print(f'Competities: {len(competitions)}')

          clubs = {}
          club_file = DATA / 'clubs2.csv'
          if club_file.exists():
              with open(club_file, encoding='utf-8') as f:
                  for row in csv.DictReader(f):
                      if row.get('club_id'):
                          clubs[row['club_id']] = row
              print(f'Bestaande clubs2: {len(clubs)}')

          CLUB_FIELDS = [
              'club_id','name','short_name',
              'domestic_competition_id','competition_name',
              'country','country_id','continent','continent_id',
              'squad_size','average_age','total_market_value','coach_name','url',
          ]

          total = len(competitions)
          for i, comp in enumerate(competitions, 1):
              comp_id      = comp['competition_id']
              comp_url     = comp.get('url', '')
              comp_name    = comp.get('name', comp_id)
              country      = comp.get('country', '')
              country_id   = comp.get('country_id', '')
              continent    = comp.get('continent', '')
              continent_id = comp.get('continent_id', '')

              if not comp_url:
                  continue

              print(f'[{i:4d}/{total}] {comp_id:12s} {comp_name[:38]:38s}', end=' ', flush=True)

              r = get(comp_url)
              if not r:
                  print('SKIP')
                  continue

              soup = BeautifulSoup(r.text, 'html.parser')
              found = 0

              for table in soup.find_all('table', class_=re.compile(r'items')):
                  for row in table.find_all('tr'):
                      a = row.find('a', href=re.compile(r'/startseite/verein/\d+'))
                      if not a:
                          continue

                      href = a['href']
                      m = re.search(r'/startseite/verein/(\d+)', href)
                      if not m:
                          continue

                      club_id = m.group(1)

                      full_name = fix_name(a.get('title', '') or a.get_text(" ", strip=True))
                      short_name = fix_name(a.get_text(" ", strip=True))
                      if short_name == full_name:
                          short_name = ''

                      td = a.find_parent('td')
                      if td:
                          for span in td.find_all('span'):
                              txt = fix_name(span.get_text(" ", strip=True))
                              if txt and txt != full_name and 2 < len(txt) < len(full_name):
                                  short_name = txt
                                  break

                      if not full_name or len(full_name) < 2:
                          continue

                      cells = row.find_all('td')
                      squad_size = avg_age = market_val = ''
                      for td in cells:
                          txt = td.get_text(" ", strip=True)
                          if re.match(r'^\d+$', txt):
                              try:
                                  n = int(txt)
                                  if 5 <= n <= 60:
                                      squad_size = txt
                              except:
                                  pass
                          if re.match(r'^\d+[,.]\d$', txt):
                              try:
                                  v = float(txt.replace(',', '.'))
                                  if 15 < v < 40:
                                      avg_age = txt
                              except:
                                  pass
                          if re.match(r'^\d+[.,]?\d*\s*[mkMK]?$', txt):
                              market_val = txt

                      clubs[club_id] = {
                          'club_id': club_id,
                          'name': full_name,
                          'short_name': short_name,
                          'domestic_competition_id': comp_id,
                          'competition_name': comp_name,
                          'country': country,
                          'country_id': country_id,
                          'continent': continent,
                          'continent_id': continent_id,
                          'squad_size': squad_size,
                          'average_age': avg_age,
                          'total_market_value': market_val,
                          'coach_name': '',
                          'url': urljoin(BASE, href),
                      }
                      found += 1

              print(f'+{found} (totaal {len(clubs)})')

              if i % 50 == 0:
                  with open(club_file, 'w', newline='', encoding='utf-8') as f:
                      w = csv.DictWriter(f, fieldnames=CLUB_FIELDS, extrasaction='ignore')
                      w.writeheader()
                      for row in clubs.values():
                          w.writerow({k: row.get(k, '') for k in CLUB_FIELDS})
                  print(f'  [SAVE] {len(clubs)} clubs opgeslagen')

              time.sleep(1.0 + random.uniform(0, 0.6))

          with open(club_file, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=CLUB_FIELDS, extrasaction='ignore')
              w.writeheader()
              for row in clubs.values():
                  w.writerow({k: row.get(k, '') for k in CLUB_FIELDS})

          print(f'\nclubs2.csv: {len(clubs)} clubs geschreven')
          PYEOF

      - name: Stap 3 - Gzippen en committen
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -f data/csv/competitions_new.csv ]; then
            gzip -c data/csv/competitions_new.csv > data/csv/competitions.csv.gz
            rm data/csv/competitions_new.csv
            echo "competitions.csv.gz: $(wc -c < data/csv/competitions.csv.gz) bytes"
          fi

          if [ -f data/csv/clubs2.csv ]; then
            gzip -f data/csv/clubs2.csv
            echo "clubs2.csv.gz: $(wc -c < data/csv/clubs2.csv.gz) bytes"
          fi

          git add data/csv/competitions.csv.gz data/csv/clubs2.csv.gz
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "ScoutAI world full: ${TIMESTAMP}" || echo "Geen wijzigingen"
          git push

      - name: Samenvatting
        run: |
          echo "=== WORLD SCRAPE KLAAR ==="
          for f in data/csv/competitions.csv.gz data/csv/clubs2.csv.gz; do
            [ -f "$f" ] && echo "$f: $(wc -c < $f) bytes"
          done
