name: Weekly Transfermarkt Scrape

on:
  schedule:
    - cron: '0 4 * * 1'  # Elke maandag om 04:00 UTC
  workflow_dispatch:       # Ook manueel te starten via GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # Max 6 uur

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transfermarkt-scraper
        run: |
          pip install poetry
          git clone https://github.com/dcaribou/transfermarkt-scraper.git /tmp/scraper
          cd /tmp/scraper
          poetry config virtualenvs.create false
          poetry install --without dev

      - name: Maak output map aan
        run: mkdir -p data/raw

      - name: Stap 1 - Clubs scrapen
        run: |
          cd /tmp/scraper
          python -m tfmkt clubs \
            -p $GITHUB_WORKSPACE/data/competitions.json \
            -s 2024 \
            > $GITHUB_WORKSPACE/data/raw/clubs.json
          echo "Clubs: $(wc -l < $GITHUB_WORKSPACE/data/raw/clubs.json)"

      - name: Stap 2 - Spelers scrapen
        run: |
          cd /tmp/scraper
          python -m tfmkt players \
            -p $GITHUB_WORKSPACE/data/raw/clubs.json \
            -s 2024 \
            > $GITHUB_WORKSPACE/data/raw/players.json
          echo "Spelers: $(wc -l < $GITHUB_WORKSPACE/data/raw/players.json)"

      - name: Stap 3 - Optredens scrapen
        run: |
          cd /tmp/scraper
          python -m tfmkt appearances \
            -p $GITHUB_WORKSPACE/data/raw/players.json \
            -s 2024 \
            > $GITHUB_WORKSPACE/data/raw/appearances.json
          echo "Optredens: $(wc -l < $GITHUB_WORKSPACE/data/raw/appearances.json)"

      - name: Stap 4 - Wedstrijden scrapen
        run: |
          cd /tmp/scraper
          python -m tfmkt games \
            -p $GITHUB_WORKSPACE/data/raw/clubs.json \
            -s 2024 \
            > $GITHUB_WORKSPACE/data/raw/games.json
          echo "Wedstrijden: $(wc -l < $GITHUB_WORKSPACE/data/raw/games.json)"

      - name: Stap 5 - JSON naar CSV omzetten
        run: |
          python3 << 'PYEOF'
          import json, csv, gzip
          from pathlib import Path

          RAW = Path('data/raw')
          OUT = Path('data/csv')
          OUT.mkdir(exist_ok=True)

          def load_jsonl(path):
              items = []
              with open(path, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          try: items.append(json.loads(line))
                          except: pass
              return items

          def extract_id(href):
              parts = href.rstrip('/').split('/')
              if 'wettbewerb' in parts:
                  return parts[parts.index('wettbewerb') + 1]
              if 'verein' in parts:
                  return parts[parts.index('verein') + 1]
              return parts[-1]

          # ── CLUBS ──
          clubs = load_jsonl(RAW / 'clubs.json')
          club_lookup = {}
          club_rows = []
          for c in clubs:
              comp_href = c.get('parent', {}).get('href', '')
              comp_id = extract_id(comp_href)
              club_id = c.get('id') or extract_id(c.get('href', ''))
              club_lookup[c.get('href', '')] = {'club_id': club_id, 'name': c.get('name', ''), 'competition_id': comp_id}
              club_rows.append({
                  'club_id': club_id, 'name': c.get('name', ''),
                  'domestic_competition_id': comp_id,
                  'squad_size': c.get('squad_size', ''),
                  'average_age': c.get('average_age', ''),
                  'total_market_value': c.get('total_market_value', ''),
                  'coach_name': c.get('coach_name', ''),
                  'url': f"https://www.transfermarkt.co.uk{c.get('href', '')}",
              })
          if club_rows:
              with open(OUT / 'clubs.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(club_rows[0].keys()))
                  w.writeheader(); w.writerows(club_rows)
              print(f'clubs.csv: {len(club_rows)} rijen')

          # ── SPELERS ──
          players = load_jsonl(RAW / 'players.json')
          player_rows = []
          player_lookup = {}
          for p in players:
              club_href = p.get('parent', {}).get('href', '')
              club_info = club_lookup.get(club_href, {})
              player_id = p.get('id') or extract_id(p.get('href', ''))
              
              # Hoogte: "1,85 m" → 185
              height_raw = p.get('height', '') or ''
              try:
                  height_cm = int(float(height_raw.replace('m','').replace(',','.').strip()) * 100)
              except:
                  height_cm = ''

              # Positie mapping
              pos = p.get('position', '') or ''
              pos_map = {'Goalkeeper': 'Goalkeeper', 'Defender': 'Defender', 
                         'Centre-Back': 'Defender', 'Left-Back': 'Defender', 'Right-Back': 'Defender',
                         'Midfielder': 'Midfield', 'Attacking Midfield': 'Midfield',
                         'Forward': 'Attack', 'Centre-Forward': 'Attack', 'Left Winger': 'Attack', 'Right Winger': 'Attack'}
              position = next((v for k, v in pos_map.items() if k.lower() in pos.lower()), 'Midfield')

              # Marktwaarde
              mv_raw = p.get('current_market_value') or ''
              try:
                  mv = int(str(mv_raw).replace('€','').replace(',','').strip()) if mv_raw else ''
              except:
                  mv = ''

              mv_high_raw = p.get('highest_market_value') or ''
              try:
                  mv_high = int(str(mv_high_raw).replace('€','').replace(',','').strip()) if mv_high_raw else ''
              except:
                  mv_high = ''

              row = {
                  'player_id': player_id,
                  'name': p.get('name', '') or p.get('last_name', ''),
                  'first_name': p.get('name', ''),
                  'last_name': p.get('last_name', ''),
                  'date_of_birth': p.get('date_of_birth', ''),
                  'age': p.get('age', ''),
                  'country_of_citizenship': p.get('citizenship', ''),
                  'country_of_birth': (p.get('place_of_birth') or {}).get('country', ''),
                  'position': position,
                  'sub_position': pos,
                  'foot': p.get('foot', ''),
                  'height_in_cm': height_cm,
                  'market_value_in_eur': mv,
                  'highest_market_value_in_eur': mv_high,
                  'contract_expiration_date': p.get('contract_expires', ''),
                  'current_club_id': club_info.get('club_id', ''),
                  'current_club_name': club_info.get('name', ''),
                  'current_club_domestic_competition_id': club_info.get('competition_id', ''),
                  'image_url': p.get('image_url', ''),
                  'url': f"https://www.transfermarkt.co.uk{p.get('href', '')}",
              }
              player_rows.append(row)
              player_lookup[p.get('href', '')] = row

          if player_rows:
              with open(OUT / 'players.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(player_rows[0].keys()))
                  w.writeheader(); w.writerows(player_rows)
              print(f'players.csv: {len(player_rows)} rijen')

          # ── OPTREDENS ──
          appearances = load_jsonl(RAW / 'appearances.json')
          app_rows = []
          for a in appearances:
              player_href = a.get('parent', {}).get('href', '')
              player_info = player_lookup.get(player_href, {})
              app_rows.append({
                  'appearance_id': a.get('id', ''),
                  'game_id': a.get('game_id', ''),
                  'player_id': player_info.get('player_id', ''),
                  'player_club_id': player_info.get('current_club_id', ''),
                  'date': a.get('date', ''),
                  'player_name': player_info.get('name', ''),
                  'competition_id': a.get('competition_id', ''),
                  'yellow_cards': a.get('yellow_cards', 0) or 0,
                  'red_cards': a.get('red_cards', 0) or 0,
                  'goals': a.get('goals', 0) or 0,
                  'assists': a.get('assists', 0) or 0,
                  'minutes_played': a.get('minutes_played', 0) or 0,
              })
          if app_rows:
              with open(OUT / 'appearances.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(app_rows[0].keys()))
                  w.writeheader(); w.writerows(app_rows)
              print(f'appearances.csv: {len(app_rows)} rijen')

          # ── WEDSTRIJDEN ──
          games_raw = RAW / 'games.json'
          if games_raw.exists():
              games = load_jsonl(games_raw)
              game_rows = []
              for g in games:
                  game_rows.append({
                      'game_id': g.get('id', ''),
                      'competition_id': g.get('competition_id', ''),
                      'season': g.get('season', ''),
                      'date': g.get('date', ''),
                      'home_club_id': g.get('home_club_id', ''),
                      'away_club_id': g.get('away_club_id', ''),
                      'home_club_goals': g.get('home_club_goals', ''),
                      'away_club_goals': g.get('away_club_goals', ''),
                      'home_club_name': g.get('home_club_name', ''),
                      'away_club_name': g.get('away_club_name', ''),
                      'stadium': g.get('stadium', ''),
                      'attendance': g.get('attendance', ''),
                      'url': f"https://www.transfermarkt.co.uk{g.get('href', '')}",
                  })
              if game_rows:
                  with open(OUT / 'games.csv', 'w', newline='', encoding='utf-8') as f:
                      w = csv.DictWriter(f, fieldnames=list(game_rows[0].keys()))
                      w.writeheader(); w.writerows(game_rows)
                  print(f'games.csv: {len(game_rows)} rijen')

          print('Conversie klaar!')
          PYEOF

      - name: Commit en push CSV's
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/csv/
          git add data/raw/
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "ScoutAI data update: ${TIMESTAMP}" || echo "Geen wijzigingen"
          git push

      - name: Samenvatting
        run: |
          echo "=== SCRAPING KLAAR ==="
          for f in data/csv/*.csv; do
            echo "$f: $(wc -l < $f) rijen"
          done
